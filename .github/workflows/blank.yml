          fi
          if [[ -z "$sdkmanager_bin" || ! -x "$sdkmanager_bin" ]]; then
            echo "::error::sdkmanager was not found in the preinstalled GitHub runner Android SDK."
            find "$sdk_root" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "::notice::Using preinstalled Android SDK: $sdk_root"
          echo "::notice::Using sdkmanager: $sdkmanager_bin"

      - name: Install and verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager_bin="$(command -v sdkmanager)"
          yes | "$sdkmanager_bin" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" --sdk_root="$ANDROID_SDK_ROOT" \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0'

          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          echo "::notice::Android SDK 36 and Build Tools 35.0.0 are ready."

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare resilient Gradle artifact downloads
        shell: bash
        run: |
          set -euo pipefail
          # CI-only settings; original Android source and dependency versions stay unchanged.
          # Kotlin compiler 2.2.20 is a large artifact and can time out while downloading.
          cat >> "$PROJECT_DIR/gradle.properties" <<'GRADLE_PROPERTIES'
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=180000
          GRADLE_PROPERTIES

          helper="$RUNNER_TEMP/bankmovie-gradle-retry.sh"
          cat > "$helper" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          max_attempts=3
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            log_file="$(mktemp "${RUNNER_TEMP:-/tmp}/bankmovie-gradle-log.XXXXXX")"
            echo "::group::Gradle attempt ${attempt}/${max_attempts}: $*"
            set +e
            gradle --no-daemon --stacktrace "$@" 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e
            echo '::endgroup::'
            if (( status == 0 )); then
              rm -f "$log_file"
              exit 0
            fi
            # Retry ONLY transient network failures; never conceal source/compiler errors.
            if (( attempt == max_attempts )) || ! grep -Eiq \
              'Read timed out|SocketTimeoutException|Connect timed out|Connection timed out|Connection reset|Broken pipe|UnknownHostException|Temporary failure in name resolution|503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout|Too Many Requests|Received status code (429|50[0-9])|HTTP (429|50[0-9])' \
              "$log_file"; then
              echo "::error::Gradle stopped with exit code $status (attempt $attempt/$max_attempts). See Job summary or failure log artifact for compiler diagnostics."
              echo "::group::Gradle root-cause lines"
              # Kotlin 2.x may format its compiler diagnostics with or without an `e:` prefix.
              grep -n -Ei '(^e: |(^|[[:space:]])error: |Unresolved reference|^> Task .* FAILED|^FAILURE:|^\* What went wrong:|^Execution failed for task|^> .*Exception|^> Could not|^Caused by:|^\[ERROR\]' "$log_file" | tail -n 90 || true
              echo '--- Last 120 Gradle log lines ---'
              tail -n 120 "$log_file" || true
              echo '::endgroup::'
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                {
                  echo '### BankMovie Gradle failed'
                  echo 'Compiler / Gradle diagnosis:'
                  echo '```text'
                  grep -n -Ei '(^e: |(^|[[:space:]])error: |Unresolved reference|^> Task .* FAILED|^FAILURE:|^\* What went wrong:|^Execution failed for task|^> .*Exception|^> Could not|^Caused by:|^\[ERROR\]' "$log_file" | tail -n 80 || true
                  echo '```'
                  echo 'If that is insufficient, download artifact `Bankmovie-2.5-Media3-Gradle-Error-Log`.'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              mkdir -p "$GITHUB_WORKSPACE/output"
              cp "$log_file" "$GITHUB_WORKSPACE/output/gradle-failure.log" || true
              rm -f "$log_file"
              exit "$status"
            fi
            rm -f "$log_file"
            pause=$((attempt * 15))
            echo "::warning::Transient dependency download failure; retrying Gradle in ${pause}s (attempt $((attempt+1))/$max_attempts)."
            sleep "$pause"
          done
          BASH
          chmod +x "$helper"
          echo "BANKMOVIE_GRADLE_RETRY=$helper" >> "$GITHUB_ENV"
          echo '::notice::Gradle download timeouts set to 120s connect / 180s read; network-only retry enabled.'

      - name: Warm Gradle plugin classpath before APK builds
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          # Fail early/retry while resolving the Kotlin 2.0.21 plugin/compiler jars.
          "$BANKMOVIE_GRADLE_RETRY" help

      # Historical VLC-specific text-pattern verifiers are not applicable to
      # the new engine. The actual Gradle compile and APK audit below are required.
      - name: Verify Media3 bridge and no native VLC dependency
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 verify_media3_migration.py
          python3 verify_media3_playback_fixes.py
          python3 verify_media3_ui_polish.py

      - name: Install and verify BankMovie font pack
        shell: bash
        run: |
          set -euo pipefail
          font_dir="$PROJECT_DIR/app/src/main/assets/fonts"
          mkdir -p "$font_dir"
          python3 -m pip install --disable-pip-version-check --quiet fonttools brotli

          font_zip="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'irancell*.zip' -print -quit)"
          if [[ -n "$font_zip" ]]; then
            FONT_ZIP="$font_zip" FONT_DIR="$font_dir" python3 - <<'PY'
          import os, re
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive, output = Path(os.environ['FONT_ZIP']), Path(os.environ['FONT_DIR'])
          targets = {1:'irancell_bold.ttf',2:'irancell_regular.ttf',3:'irancell_black.ttf',4:'irancell_semibold.ttf',5:'irancell_medium.ttf'}
          with ZipFile(archive) as zf:
              indexed = {}
              for item in zf.infolist():
                  if item.is_dir() or not item.filename.lower().endswith('.ttf'): continue
                  match = re.search(r'irancell[^0-9]*([1-5])', PurePosixPath(item.filename).name, re.I)
                  if match: indexed[int(match.group(1))] = item
              for number, name in targets.items():
                  if number not in indexed: raise SystemExit(f'Missing Irancell font {number}')
                  data = zf.read(indexed[number], pwd=b'fontbazi')
                  if len(data) < 1024: raise SystemExit(f'Invalid font: {name}')
                  (output / name).write_bytes(data)
          PY
          fi

          declare -A direct_fonts=(
            [Cinema.otf]=cinema.otf
            ['Diako Hima Regular-@Fontsplua.ttf']=diako_hima.ttf
            ['Nic [@fontbazi].ttf']=nic.ttf
          )
          for source in "${!direct_fonts[@]}"; do
            [[ -s "$GITHUB_WORKSPACE/$source" ]] && cp "$GITHUB_WORKSPACE/$source" "$font_dir/${direct_fonts[$source]}"
          done

          FONT_DIR="$font_dir" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import os
          from pathlib import Path
          from fontTools.ttLib import TTFont
          root, out = Path(os.environ['GITHUB_WORKSPACE']), Path(os.environ['FONT_DIR'])
          for weight in ('regular','medium','bold'):
              source = next(iter(root.glob(f'IRANSansXFaNum-{weight}*.woff2')), None)
              if source is None: continue
              font = TTFont(source); font.flavor = None; font.save(out / f'iransansx_{weight}.ttf')
          PY

          filimo_source="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'filimo-demo-variable-vf.woff2' -print -quit)"
          if [[ -z "$filimo_source" ]]; then
            filimo_source="$RUNNER_TEMP/filimo-demo-variable-vf.woff2"
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 12 \
              'https://bankmovie.top/assets/fonts/filimo-demo-variable-vf.woff2' \
              --output "$filimo_source"
          fi
          test -s "$filimo_source"
          FILIMO_SOURCE="$filimo_source" FONT_DIR="$font_dir" python3 - <<'PY'
          import os
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont

          src = Path(os.environ['FILIMO_SOURCE'])
          out_dir = Path(os.environ['FONT_DIR'])
          weights = {400:'400', 500:'500', 700:'700', 900:'900', 950:'950'}

          source_font = TTFont(src)
          if 'fvar' not in source_font or not any(axis.axisTag == 'wght' for axis in source_font['fvar'].axes):
              raise SystemExit('Filimo source is not the expected variable wght font')

          for weight, suffix in weights.items():
              font = TTFont(src)
              static_font = instantiateVariableFont(font, {'wght': weight}, inplace=False, optimize=True)
              static_font.flavor = None

              # Normalize metadata so Android recognizes the requested weight.
              is_bold = weight >= 700
              static_font['OS/2'].usWeightClass = weight
              static_font['OS/2'].fsSelection &= ~(1 << 5)
              static_font['OS/2'].fsSelection &= ~(1 << 6)
              static_font['OS/2'].fsSelection |= (1 << 5) if is_bold else (1 << 6)
              if is_bold:
                  static_font['head'].macStyle |= 1
              else:
                  static_font['head'].macStyle &= ~1

              family = f'BankMovie Filimo {weight}'
              subfamily = 'Bold' if is_bold else 'Regular'
              ps_name = f'BankMovieFilimo-{weight}'
              for record in static_font['name'].names:
                  value = None
                  if record.nameID == 1:
                      value = family
                  elif record.nameID == 2:
                      value = subfamily
                  elif record.nameID == 4:
                      value = f'{family} {subfamily}'
                  elif record.nameID == 6:
                      value = ps_name
                  elif record.nameID == 17:
                      value = subfamily
                  if value is not None:
                      try:
                          record.string = value.encode(record.getEncoding())
                      except Exception:
                          pass

              out = out_dir / f'bankmovie_filimo_{suffix}.ttf'
              static_font.save(out)
              if out.stat().st_size < 4096:
                  raise SystemExit(f'Converted BankMovie font is invalid: {out.name}')
          PY

          required_fonts=(
            bankmovie_filimo_400.ttf bankmovie_filimo_500.ttf bankmovie_filimo_700.ttf bankmovie_filimo_900.ttf bankmovie_filimo_950.ttf
            irancell_regular.ttf irancell_medium.ttf irancell_semibold.ttf irancell_bold.ttf irancell_black.ttf
            cinema.otf diako_hima.ttf nic.ttf
            iransansx_regular.ttf iransansx_medium.ttf iransansx_bold.ttf
          )
          for font in "${required_fonts[@]}"; do
            if [[ ! -s "$font_dir/$font" ]]; then
              echo "::error::Required Android font asset is missing: $font"
              exit 1
            fi
          done
          echo "::notice::BankMovie + legacy font pack installed and verified."

      # Keep the original ABI2-Lite/ABI4-Full edition and 8-artifact contract.
      - name: Build ABI2 Lite releases
        shell: bash
        env:
          BANKMOVIE_ABIS: armeabi-v7a,arm64-v8a
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          export BANKMOVIE_SIGNING_STORE_FILE="$PROJECT_DIR/bankmovie_update.jks"
          "$BANKMOVIE_GRADLE_RETRY" clean assembleAbi2LiteRelease

      - name: Build ABI4 Full releases
        shell: bash
        env:
          BANKMOVIE_ABIS: armeabi-v7a,arm64-v8a,x86,x86_64
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          export BANKMOVIE_SIGNING_STORE_FILE="$PROJECT_DIR/bankmovie_update.jks"
          "$BANKMOVIE_GRADLE_RETRY" assembleAbi4FullRelease

      - name: Collect exactly 8 APKs with original filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          rm -f output/*.apk
          python3 - <<'PYCOLLECT'
          import os
          import shutil
          from pathlib import Path
          from zipfile import ZipFile

          apk_root = Path(os.environ['PROJECT_DIR']) / 'app/build/outputs/apk'
          out = Path('output')
          editions = {
              'abi2Lite': ('ABI2-Lite', [
                  ('Universal', 'universal'),
                  ('Armeabi-v7a', 'armeabi-v7a'),
                  ('Arm64-v8a', 'arm64-v8a')]),
              'abi4Full': ('ABI4-Full', [
                  ('Universal', 'universal'),
                  ('Armeabi-v7a', 'armeabi-v7a'),
                  ('Arm64-v8a', 'arm64-v8a'),
                  ('X86', 'x86'),
                  ('X86_64', 'x86_64')]),
          }
          for flavor, (edition, kinds) in editions.items():
              # Gradle may use camel-case or lower-case folder names depending on version.
              folders = [p for p in apk_root.glob('*/release') if p.parent.name.lower() == flavor.lower()]
              if len(folders) != 1:
                  raise SystemExit(f'Expected one release directory for {flavor}, found: {folders}')
              files = sorted(folders[0].glob('*.apk'))
              if not files:
                  raise SystemExit(f'No APK generated for {flavor} in {folders[0]}')
              def matching(token):
                  for p in files:
                      stem = p.stem.lower()
                      if token == 'universal':
                          if 'universal' in stem: return p
                      elif token == 'x86':
                          if '-x86-' in stem or stem.endswith('-x86'): return p
                      elif token in stem:
                          return p
                  return None
              universal = matching('universal')
              if universal is None and len(files) == 1:
                  # Some AGP configurations output only a normal, native-free APK.
                  universal = files[0]
              if universal is None:
                  raise SystemExit(f'Universal APK missing for {edition}: {[p.name for p in files]}')
              with ZipFile(universal) as apk:
                  native_libs = [n for n in apk.namelist() if n.startswith('lib/') and n.endswith('.so')]
              for label, token in kinds:
                  candidate = universal if token == 'universal' else matching(token)
                  if candidate is None:
                      if native_libs:
                          raise SystemExit(f'Cannot copy a universal APK as {edition} {label}: native libraries present {native_libs}')
                      # With no JNI libraries, APKs are inherently multi-ABI. Preserve
                      # original eight separate artifact names using signed universal bytes.
                      candidate = universal
                      print(f'Native-free edition: using universal APK for {edition} {label}')
                  target = out / f'Bankmovie-v2.5-{edition}-{label}.apk'
                  shutil.copy2(candidate, target)
                  print(f'{target.name}: {target.stat().st_size:,} bytes (source: {candidate.name})')
          assert len(list(out.glob('*.apk'))) == 8, 'Expected exactly 8 separately named APKs'
          PYCOLLECT

      - name: Verify all 8 signed APKs, update identity and no bundled VLC
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt_bin"
          for apk in output/*.apk; do
            "$apksigner" verify --verbose --print-certs "$apk"
            version_code="$($aapt_bin dump badging "$apk" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n 1)"
            version_name="$($aapt_bin dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
            [[ "$version_name" == "2.5" ]] || { echo "::error::Unexpected versionName: $apk ($version_name)"; exit 1; }
            app_label="$($aapt_bin dump badging "$apk" | sed -n "s/^application-label:'\([^']*\)'.*/\1/p" | head -n 1)"
            [[ "$app_label" == "Bankmovie" ]] || { echo "::error::Expected original Bankmovie label, got: $app_label"; exit 1; }
            [[ "$version_code" == "$BANKMOVIE_VERSION_CODE" ]] || { echo "::error::Unexpected versionCode: $apk ($version_code)"; exit 1; }
            APK_FILE="$apk" python3 - <<'PYAUDIT'
          import hashlib, os, zipfile
          from pathlib import Path

          keys = ('action', 'adventure', 'animation', 'anime', 'biography', 'comedy', 'crime',
                  'documentary', 'drama', 'family', 'fantasy', 'history', 'horror',
                  'music', 'musical', 'mystery', 'noir', 'romance', 'school',
                  'sci_fi', 'science', 'short', 'sport', 'supernatural',
                  'thriller', 'war', 'western')
          source_drawables = (Path(os.environ['PROJECT_DIR']) / 'app/src/main/res/drawable-nodpi')
          expected = {
              key: hashlib.sha256((source_drawables / ('bm_genre_' + key + '.webp')).read_bytes()).digest()
              for key in keys
          }
          unique_digests = set(expected.values())
          if len(unique_digests) != 25:
              raise SystemExit('Expected 25 distinct authentic WebP originals for 27 category keys')

          with zipfile.ZipFile(os.environ['APK_FILE']) as z:
              names = z.namelist()
              forbidden = [n for n in names if 'libvlc' in n.lower() or 'libvlccore' in n.lower()]
              if forbidden: raise SystemExit(f'VLC native libraries still found: {forbidden}')
              if any('ffmpeg' in n.lower() for n in names if n.startswith('lib/')):
                  raise SystemExit('Unexpected FFmpeg native library packaged')

              # With shrinkResources=true, AGP/AAPT2 may rename resource paths to
              # short names such as res/3d or res/X.webp. The basename cannot be
              # used to audit an optimized release APK. WebP file bytes are kept
              # intact; verify their SHA-256 instead, regardless of path/extension.
              found = set()
              for info in z.infolist():
                  if not info.filename.startswith('res/') or info.file_size < 10_000:
                      continue
                  with z.open(info) as file:
                      image_hash = hashlib.sha256(file.read()).digest()
                  if image_hash in unique_digests:
                      found.add(image_hash)
              missing = [key for key, digest in expected.items() if digest not in found]
              if missing:
                  raise SystemExit('Compiled APK is genuinely missing genre image bytes: '
                                   + ', '.join(sorted(missing)) + '. '
                                   + 'If AGP ever re-encodes WebP payloads, update the verifier to inspect compiled resources.')
              print('APK_ORIGINAL_GENRES_OK', len(keys), 'keys /', len(found), 'unique originals', os.environ['APK_FILE'])

              expected_proof = Path('output/BANKMOVIE-SOURCE-PROOF.txt').read_bytes()
              actual_proof = z.read('assets/bankmovie_source_proof.txt')
              if expected_proof != actual_proof:
                  raise SystemExit('Source stamp absent or wrong in '+os.environ['APK_FILE'])
              print('APK_SOURCE_STAMP_OK:', os.environ['APK_FILE'])
          PYAUDIT
            echo "Verified $apk"
          done
          sha256sum output/*.apk > output/SHA256SUMS.txt
          {
            echo 'BankMovie 2.5 Media3 eight signed APK sizes (bytes)'
            find output -maxdepth 1 -name '*.apk' -printf '%f %s\n' | sort
          } > output/APK-SIZES.txt

      - name: Upload ABI2 Lite Universal
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.5-ABI2-Lite-Universal
          path: output/Bankmovie-v2.5-ABI2-Lite-Universal.apk
          if-no-files-found: error
          retention-days: 30

