          retention-days: 30

      - name: Upload ABI4 Full Universal
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.5-ABI4-Full-Universal
          path: output/Bankmovie-v2.5-ABI4-Full-Universal.apk
