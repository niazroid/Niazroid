name: Build BankMovie Windows v1.1.0

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

env:
  SOURCE_ZIP: bankmovie_desktop_source_v1.1.0_MEDIAFIX.zip
  EXPECTED_APP_NAME: bankmovie-windows
  EXPECTED_VERSION: 1.1.0

jobs:
  build-windows:
    name: Build BankMovie Windows 1.1.0
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate BankMovie source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = '${{ github.workspace }}'
          $zipName = '${{ env.SOURCE_ZIP }}'

          Write-Host "Workspace: $workspace"
          Write-Host "Looking for exact archive: $zipName"

          # 1) Prefer the exact ZIP, even if it is inside a subfolder of the repo.
          $zip = Get-ChildItem -Path $workspace -Recurse -File -Filter $zipName -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($zip) {
            Write-Host "Found exact source ZIP: $($zip.FullName)"

            # Make sure this really is a ZIP and not e.g. a Git LFS pointer.
            $firstBytes = [System.IO.File]::ReadAllBytes($zip.FullName) | Select-Object -First 2
            if ($firstBytes.Count -lt 2 -or $firstBytes[0] -ne 0x50 -or $firstBytes[1] -ne 0x4B) {
              throw "'$($zip.FullName)' is not a real ZIP file. If Git LFS is used, make sure the binary is actually checked out."
            }

            $extractRoot = Join-Path $workspace '_bankmovie_source'
            if (Test-Path $extractRoot) {
              Remove-Item $extractRoot -Recurse -Force
            }
            New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extractRoot -Force

            $expectedDesktop = Join-Path $extractRoot 'bankmovie_desktop_v2_pack\desktop'
            $expectedPackage = Join-Path $expectedDesktop 'package.json'

            if (Test-Path $expectedPackage) {
              $desktopDir = $expectedDesktop
            }
          }

          # 2) Fallback: source may already be extracted and committed to the repository.
          if (-not $desktopDir) {
            Write-Host 'Exact ZIP was not usable/found. Searching for an extracted BankMovie desktop source...'

            $packages = Get-ChildItem -Path $workspace -Recurse -File -Filter 'package.json' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' }

            foreach ($pkg in $packages) {
              try {
                $json = Get-Content $pkg.FullName -Raw | ConvertFrom-Json
                if ($json.name -eq '${{ env.EXPECTED_APP_NAME }}' -and $json.version -eq '${{ env.EXPECTED_VERSION }}') {
                  $desktopDir = $pkg.Directory.FullName
                  Write-Host "Found extracted BankMovie source: $desktopDir"
                  break
                }
              } catch {
                # Ignore unrelated/invalid package.json files.
              }
            }
          }

          if (-not $desktopDir) {
            Write-Host ''
            Write-Host 'Repository files:'
            Get-ChildItem -Path $workspace -Force | ForEach-Object { Write-Host " - $($_.Name)" }
            Write-Host ''
            throw "BankMovie source was not found. Upload '$zipName' anywhere in this repository OR extract it and commit the folder 'bankmovie_desktop_v2_pack/desktop'."
          }

          $packagePath = Join-Path $desktopDir 'package.json'
          $package = Get-Content $packagePath -Raw | ConvertFrom-Json

          if ($package.name -ne '${{ env.EXPECTED_APP_NAME }}') {
            throw "Wrong application. Expected '${{ env.EXPECTED_APP_NAME }}', found '$($package.name)'."
          }
          if ($package.version -ne '${{ env.EXPECTED_VERSION }}') {
            throw "Wrong version. Expected '${{ env.EXPECTED_VERSION }}', found '$($package.version)'."
          }

          # GitHub Actions supports absolute paths in working-directory.
          "DESKTOP_DIR=$desktopDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_JSON=$packagePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Using Desktop directory: $desktopDir"
          Write-Host "Verified: $($package.name) v$($package.version)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show selected source
        shell: pwsh
        run: |
          Write-Host "DESKTOP_DIR=$env:DESKTOP_DIR"
          Get-ChildItem -Path $env:DESKTOP_DIR -Force | Format-Table Name, Length, LastWriteTime

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm install

      - name: Validate JavaScript
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check src/app.js

      - name: Build Windows installer
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: List build output
        if: always()
        shell: pwsh
        run: |
          $dist = Join-Path $env:DESKTOP_DIR 'dist'
          if (Test-Path $dist) {
            Get-ChildItem -Path $dist -Recurse -File | Format-Table FullName, Length
          } else {
            Write-Host 'dist directory does not exist.'
          }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-1.1.0-${{ github.sha }}
          path: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.zip
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.zip
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
