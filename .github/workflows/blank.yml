name: Build BankMovie 2.3 TV Focus V7.6.1 Video Root Fix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bankmovie-2.3-tv-focus-v761-\4{{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: Bankmovie-v2.3-TV-GLOBAL-FOCUS-V7.6.1-VIDEO-ROOT-FIXED-SOURCE.zip
  SOURCE_SHA256: 1b83327be1268982dbc43e7647537e0fa3356c16f20782ed304202fd9774c310

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and verify exact V7.6.1 source
        shell: bash
        run: |
          set -euo pipefail
          source_zip="\4GITHUB_WORKSPACE/\4SOURCE_ZIP"
          test -s "\4source_zip" || { echo "::error::Missing \4SOURCE_ZIP"; exit 1; }
          actual="\4(sha256sum "\4source_zip" | awk '{print \41}')"
          [[ "\4actual" == "\4SOURCE_SHA256" ]] || { echo "::error::SHA mismatch: \4actual"; exit 1; }
          unzip -tq "\4source_zip" >/dev/null
          extract="\4RUNNER_TEMP/bankmovie-v761"
          rm -rf "\4extract" && mkdir -p "\4extract"
          unzip -q "\4source_zip" -d "\4extract"
          project="\4extract/bankmovie_src"
          test -s "\4project/app/build.gradle" || { echo "::error::app/build.gradle missing"; exit 1; }
          echo "PROJECT_DIR=\4project" >> "\4GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify V7.6.1 video fixes
        shell: bash
        run: |
          set -euo pipefail
          cd "\4PROJECT_DIR"
          bash verify_tv_focus_v761_video_first_char.sh
          grep -Fq 'V7.6.1 FIRST-CHAR FIX' app/src/main/java/ir/bankmoviee/app/MainActivity.kt
          grep -Fq 'wireV76DetailActionRow(actions, primaryAction, trailerAction, favoriteAction)' app/src/main/java/ir/bankmoviee/app/MainActivity.kt
          grep -Fq 'wireV76CategoryHubGrid(grid)' app/src/main/java/ir/bankmoviee/app/MainActivity.kt

      - name: Build ABI2 Lite releases
        shell: bash
        env:
          BANKMOVIE_ABIS: armeabi-v7a,arm64-v8a
        run: |
          set -euo pipefail
          cd "\4PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleAbi2LiteRelease

      - name: Build ABI4 Full releases
        shell: bash
        env:
          BANKMOVIE_ABIS: armeabi-v7a,arm64-v8a,x86,x86_64
        run: |
          set -euo pipefail
          cd "\4PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleAbi4FullRelease

      - name: Collect APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          find "\4PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -exec cp {} output/ \;
          count="\4(find output -type f -name '*.apk' | wc -l)"
          [[ "\4count" -gt 0 ]] || { echo '::error::No APK generated'; exit 1; }
          sha256sum output/*.apk | tee output/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.3-V7.6.1-APKs
          path: |
            output/*.apk
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
