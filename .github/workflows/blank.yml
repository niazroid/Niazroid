name: Build BankMovie 2.3 V7.39 Website Auth Security Themed Update

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bankmovie-2.3-v739-main-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: Bankmovie-v2.3-V7.39-WEBSITE-AUTH-SECURITY-THEMED-UPDATE-FULLSOURCE_20260912.zip
  SOURCE_SHA256: 8c516544dfc1809e2635e87dedb2824e81abeeaced3ab74c62febb725f8cdcb9

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and verify exact V7.39 source
        shell: bash
        run: |
          set -euo pipefail

          source_zip="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          if [[ ! -s "$source_zip" ]]; then
            echo "::error::Missing source ZIP: $SOURCE_ZIP"
            echo "Files in repository root:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          actual_sha="$(sha256sum "$source_zip" | awk '{print $1}')"
          if [[ "$actual_sha" != "$SOURCE_SHA256" ]]; then
            echo "::error::Source SHA-256 mismatch. Expected $SOURCE_SHA256, got $actual_sha"
            exit 1
          fi

          unzip -tq "$source_zip" >/dev/null

          extract_dir="$RUNNER_TEMP/bankmovie-v739-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          unzip -q "$source_zip" -d "$extract_dir"

          build_file="$(find "$extract_dir" -type f -path '*/app/build.gradle' ! -path '*/app/build/*' -print -quit || true)"
          if [[ -z "$build_file" ]]; then
            echo "::error::app/build.gradle was not found inside $SOURCE_ZIP"
            exit 1
          fi

          project_dir="$(dirname "$(dirname "$build_file")")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "::notice::Using Android project: $project_dir"
          echo "::notice::Source SHA-256 verified: $actual_sha"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify V7.39 website auth + security + themed update + regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -s verify_v739_website_auth_security_update.sh || {
            echo "::error::V7.39 verifier is missing"
            exit 1
          }
          test -s verify_v738_profile_vip_boxoffice_micro_polish.sh || {
            echo "::error::V7.38 regression verifier is missing"
            exit 1
          }
          test -s verify_v736_home_archive_gates_profile_vip_boxoffice.sh || {
            echo "::error::V7.36 regression verifier is missing"
            exit 1
          }
          test -s verify_v733_filters_notifications_archive_policy.sh || {
            echo "::error::V7.33 regression verifier is missing"
            exit 1
          }
          test -s verify_v732_uiverse_downloader_settings.sh || {
            echo "::error::V7.32 regression verifier is missing"
            exit 1
          }

          bash verify_v739_website_auth_security_update.sh
          bash verify_v738_profile_vip_boxoffice_micro_polish.sh
          bash verify_v736_home_archive_gates_profile_vip_boxoffice.sh
          bash verify_v733_filters_notifications_archive_policy.sh
          bash verify_v732_uiverse_downloader_settings.sh
          bash verify_release.sh

          main='app/src/main/java/ir/bankmoviee/app/MainActivity.kt'
          player='app/src/main/java/ir/bankmoviee/app/PlayerActivity.kt'
          manifest='app/src/main/AndroidManifest.xml'
          draw='app/src/main/res/drawable'
          admin='server-required/bm_admin.php'
          appcfg='server-required/app_config.php'
          policy='server-required/includes/app_archive_policy.php'
          auth='app/src/main/java/ir/bankmoviee/app/AuthActivity.kt'
          account_api='app/src/main/java/ir/bankmoviee/app/AccountApi.kt'
          user_api='server-required/app_user_api.php'
          ui_prefs='app/src/main/java/ir/bankmoviee/app/UiPreferences.kt'

          grep -Fq 'sourceMainUpdateTwentiethHotfixTag=BANKMOVIE-2.3-V739-20260912' BANKMOVIE_BUILD_SOURCE_2_3.txt
          grep -Fq 'sourceMainUpdateNineteenthHotfixTag=BANKMOVIE-2.3-V738-20260912' BANKMOVIE_BUILD_SOURCE_2_3.txt
          grep -Fq 'ساخت حساب بانک مووی' "$auth"
          grep -Fq 'ورود به بانک مووی' "$auth"
          grep -Fq 'تأیید امنیتی' "$auth"
          grep -Fq 'AccountApi.authChallenge(this)' "$auth"
          grep -Fq 'challenge_token' "$account_api"
          grep -Fq 'security_code' "$account_api"
          grep -Fq 'syncWebsiteTheme' "$account_api"
          grep -Fq 'fun bm_user_api_auth_challenge(): array' "$user_api" || grep -Fq 'function bm_user_api_auth_challenge(): array' "$user_api"
          grep -Fq 'function bm_user_api_validate_auth_challenge(): void' "$user_api"
          grep -Fq '"pink" -> Color.rgb(236, 72, 153)' "$ui_prefs"
          grep -Fq 't("آپدیت الزامی", "Update required")' "$main"
          grep -Fq 't("↻  آپدیت کردم، دوباره بررسی کن", "↻  I updated, check again")' "$main"
          grep -Fq 't("خرید همین پلن در تلگرام", "Buy this plan on Telegram")' "$main"
          grep -Fq 'Triple(R.drawable.ic_archive_database, t("آرشیوهای بیشتر"' "$main"
          grep -Fq 'fun heroAuthButton(label: String, primary: Boolean, register: Boolean)' "$main"
          grep -Fq 'setImageResource(R.drawable.ic_chevron_right)' "$main"
          grep -Fq 'remote_home_controls_v736' "$main"
          grep -Fq 'last_remote_config_revision_v736' "$main"
          grep -Fq 'cached_remote_config_v5' "$main"
          grep -Fq 'remoteHomeSectionEnabled' "$main"
          grep -Fq 'hasVisibilityPolicy' "$main"
          grep -Fq 'showProfileMobileV736' "$main"
          grep -Fq 'showVipPlansMobileV736' "$main"
          grep -Fq 'showBoxOfficeMobileV736' "$main"
          grep -Fq 'remoteArchiveWatchPartyScopes' "$main"
          grep -Fq 'remoteArchiveInternalPlayerScopes' "$main"
          grep -Fq 'remoteArchiveExternalPlayerScopes' "$main"
          grep -Fq 'remoteArchiveAllPlayerScopes' "$main"
          grep -Fq 'archiveRuntimeScope(item, "external_player")' "$main"
          grep -Fq 'archiveRuntimeScope(item, "all_players")' "$main"
          grep -Fq "'home_section_policy'=>\$homeSectionPolicy" "$admin"
          grep -Fq 'name="archive<?= (int)$bmArchiveNumber ?>_external_player_scope"' "$admin"
          grep -Fq 'name="archive<?= (int)$bmArchiveNumber ?>_internal_player_scope"' "$admin"
          grep -Fq 'name="archive<?= (int)$bmArchiveNumber ?>_watch_party_scope"' "$admin"
          grep -Fq 'name="archive<?= (int)$bmArchiveNumber ?>_all_players_scope"' "$admin"
          grep -Fq 'V7.36: home-section visibility is authoritative per section' "$appcfg"
          grep -Fq 'watch_party_access_scope' "$policy"
          grep -Fq 'external_player_access_scope' "$policy"
          grep -Fq 'OrbitalGlowLoaderView(this@MainActivity)' "$main"
          grep -Fq 'duration = 3000L' app/src/main/java/ir/bankmoviee/app/OrbitalGlowLoaderView.kt
          grep -Fq 'DashPathEffect(floatArrayOf(44f, 1111f), dashOffset)' app/src/main/java/ir/bankmoviee/app/OrbitalGlowLoaderView.kt
          grep -Fq 'showDownloadSettingsSheet()' app/src/main/java/ir/bankmoviee/app/DownloadsActivity.kt
          grep -Fq 'DownloadPreferences.connectionsPerFile(this).coerceIn(1, 8)' app/src/main/java/ir/bankmoviee/app/InternalDownloadService.kt
          grep -Fq 'private fun showCommentActionsSheetV731' "$main"
          grep -Fq 'R.drawable.ic_weekly_schedule' "$main"
          grep -Fq 'return telegramJoinButton()' "$main"
          grep -Fq 'R.drawable.ic_logout' "$main"
          test -s "$draw/ic_weekly_schedule.xml"
          test -s "$draw/ic_logout.xml"
          ! grep -Fq 'android.widget.PopupMenu' "$main"
          ! grep -Eq 'CastContext|RemoteMediaClient|MediaRoute|DlnaController|Chromecast' "$player"
          ! grep -Eq 'play-services-cast|androidx\.mediarouter' app/build.gradle
          ! grep -Eq 'OPTIONS_PROVIDER_CLASS_NAME|CHANGE_WIFI_MULTICAST_STATE' "$manifest"

          php -l "$admin" >/dev/null
          php -l "$appcfg" >/dev/null
          php -l "$policy" >/dev/null
          php -l "$user_api" >/dev/null

          echo WORKFLOW_VERIFY_V739_OK

      - name: Build ABI2 Lite releases
        shell: bash
        env:
          BANKMOVIE_ABIS: armeabi-v7a,arm64-v8a
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleAbi2LiteRelease

      - name: Build ABI4 Full releases
        shell: bash
        env:
          BANKMOVIE_ABIS: armeabi-v7a,arm64-v8a,x86,x86_64
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleAbi4FullRelease

      - name: Collect and verify signed APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          rm -f output/*

          apk_root="$PROJECT_DIR/app/build/outputs/apk"
          if [[ ! -d "$apk_root" ]]; then
            echo "::error::Gradle produced no APK output directory: $apk_root"
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 5 -type f -printf '%P\n' 2>/dev/null | sort | head -n 120 || true
            exit 1
          fi

          mapfile -d '' built_apks < <(find "$apk_root" -type f -iname '*.apk' -print0)
          if [[ ${#built_apks[@]} -eq 0 ]]; then
            echo "::error::Gradle completed but no APK files were found below: $apk_root"
            exit 1
          fi

          for apk in "${built_apks[@]}"; do
            full_lower="${apk,,}"
            base="$(basename "$apk")"
            base_lower="${base,,}"

            case "$full_lower" in
              *abi2lite*) edition="ABI2-Lite" ;;
              *abi4full*) edition="ABI4-Full" ;;
              *)
                echo "::warning::Skipping APK with unknown edition: $apk"
                continue
                ;;
            esac

            case "$base_lower" in
              *universal*) abi="Universal" ;;
              *arm64-v8a*) abi="Arm64-v8a" ;;
              *armeabi-v7a*) abi="Armeabi-v7a" ;;
              *x86_64*) abi="X86_64" ;;
              *x86*) abi="X86" ;;
              *)
                echo "::error::Cannot identify APK ABI from filename: $base"
                exit 1
                ;;
            esac

            target="output/Bankmovie-v2.3-$edition-$abi.apk"
            if [[ -e "$target" ]]; then
              echo "::error::More than one APK maps to output file: $target"
              exit 1
            fi
            cp "$apk" "$target"
            echo "Collected: ${apk#$PROJECT_DIR/} -> $target"
          done

          expected=(
            Bankmovie-v2.3-ABI2-Lite-Universal.apk
            Bankmovie-v2.3-ABI2-Lite-Armeabi-v7a.apk
            Bankmovie-v2.3-ABI2-Lite-Arm64-v8a.apk
            Bankmovie-v2.3-ABI4-Full-Universal.apk
            Bankmovie-v2.3-ABI4-Full-Armeabi-v7a.apk
            Bankmovie-v2.3-ABI4-Full-Arm64-v8a.apk
            Bankmovie-v2.3-ABI4-Full-X86.apk
            Bankmovie-v2.3-ABI4-Full-X86_64.apk
          )

          for apk in "${expected[@]}"; do
            if [[ ! -s "output/$apk" ]]; then
              echo "::error::Expected APK was not generated: $apk"
              find "$apk_root" -type f -iname '*.apk' -printf '%P\n' | sort
              exit 1
            fi
          done

          apk_count="$(find output -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [[ "$apk_count" -ne 8 ]]; then
            echo "::error::Expected exactly 8 APKs, collected $apk_count."
            find output -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort
            exit 1
          fi

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            echo "::error::Android apksigner was not found below $ANDROID_HOME/build-tools."
            exit 1
          fi

          while IFS= read -r apk; do
            "$apksigner" verify --verbose --print-certs "$apk"
          done < <(find output -type f -name '*.apk' | sort)

          sha256sum output/*.apk | tee output/SHA256SUMS.txt
          {
            echo "BankMovie 2.3 V7.39 release APK sizes (bytes)"
            find output -maxdepth 1 -type f -name '*.apk' -printf '%f %s\n' | sort
          } | tee output/APK-SIZES.txt
          echo "::notice::All 8 APK files were found and their signatures verified."

      - name: Upload ABI2 Lite Universal
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.3-ABI2-Lite-Universal
          path: output/Bankmovie-v2.3-ABI2-Lite-Universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ABI2 Lite Armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.3-ABI2-Lite-Armeabi-v7a
          path: output/Bankmovie-v2.3-ABI2-Lite-Armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ABI2 Lite Arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.3-ABI2-Lite-Arm64-v8a
          path: output/Bankmovie-v2.3-ABI2-Lite-Arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ABI4 Full Universal
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.3-ABI4-Full-Universal
          path: output/Bankmovie-v2.3-ABI4-Full-Universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ABI4 Full Armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.3-ABI4-Full-Armeabi-v7a
          path: output/Bankmovie-v2.3-ABI4-Full-Armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ABI4 Full Arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.3-ABI4-Full-Arm64-v8a
          path: output/Bankmovie-v2.3-ABI4-Full-Arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ABI4 Full X86
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.3-ABI4-Full-X86
          path: output/Bankmovie-v2.3-ABI4-Full-X86.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ABI4 Full X86_64
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.3-ABI4-Full-X86_64
          path: output/Bankmovie-v2.3-ABI4-Full-X86_64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksum and size manifests
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.3-V7.39-Manifests
          path: |
            output/SHA256SUMS.txt
            output/APK-SIZES.txt
          if-no-files-found: error
          retention-days: 30
