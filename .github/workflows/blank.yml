name: BankMovie 2.5 - TV Home Cache + TV PIN + Archive 2 - 8 Signed APKs

# Build ONLY the verified Android TV home-cache source ZIP; no stale-source fallback.
# Preserve all BankMovie 2.5 features, stable signing identity and 8 APK outputs.
# SIGNING FIX: prefer Actions Secrets; for older BankMovie repos, safely recover
# historical signing settings from the same SHA-verified FULLSOURCE ZIP as the keystore.
# Never print/store passwords in repository, source ZIP, or build artifacts.
# Existing app APIs and previous Android app versions remain untouched by this CI job.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bankmovie-v25-tv-cache-pin-search2-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ZIP: BankMovie_V25_AndroidTV_HomeCache_FIXED_SOURCE.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required for signing-key recovery when an older FULLSOURCE zip
          # was deleted from the current branch but still exists in Git history.
          fetch-depth: 0

      - name: Locate exact Media3 project
        shell: bash
        run: |
          set -euo pipefail
          # No fallback to stale source in the repository. Missing ZIP is a hard failure.
          source_zip="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          [[ -s "$source_zip" ]] || {
            echo "::error::Required source ZIP missing: $SOURCE_ZIP. Upload this exact ZIP to the repository root."
            exit 1
          }
          echo "2d2adfa4bca088965acf044a76a14710075eefeec30c8c4957cd9cbfd1cb2c71  $source_zip" | sha256sum --check --status || {
            echo '::error::Source ZIP checksum differs from the required BankMovie 2.5 release.'
            sha256sum "$source_zip"
            exit 1
          }
          unzip -tq "$source_zip"
          extract_dir="$RUNNER_TEMP/bankmovie-media3-src"
          mkdir -p "$extract_dir"
          unzip -qo "$source_zip" -d "$extract_dir"
          mapfile -t matches < <(find "$extract_dir" -maxdepth 7 -path '*/app/build.gradle' -type f | sort)
          [[ ${#matches[@]} -eq 1 ]] || { echo "::error::Expected one app/build.gradle in media3 ZIP"; exit 1; }
          project_dir="$(dirname "$(dirname "${matches[0]}")")"

          # Verify direct offline drawables and TV display mode implementation.
          SRC_ROOT="$project_dir" python3 - <<'PYSOURCE'
          import hashlib, os, re, json
          from pathlib import Path
          root = Path(os.environ['SRC_ROOT'])
          src = root / 'app/src/main/java/ir/bankmoviee/app'
          expected = {
              'MainActivity.kt': 'e360f69ca757156de3de184e2130d29d36cd459bb90cca3055e56adb50d5c4cf',
              'BankmovieSmoothScrollView.kt': 'ad83ec7fed0b9600eb96f10f92c1a747c16ebc961e08ffc0d315abf55b54c8f1',
              'PlayerActivity.kt': '2e7d49f589a9047fc6ea9c9ad06f8d10c07336d82fa9bf6fdb856e6d0efdf781',
              'Media3PlaybackBridge.kt': '6700b23e532f27bb5a2c227654f37ae9b85fd274c7b40a3d7bdd77a884cd43c8',
              'PosterDiskCache.kt': '54f80b558e73f57bd381ebbc816bee2255e8c9de7b9ebb5e38f0231702df817a',
              'BmDeviceStorage.kt': '2947c6f3da30d855d24f03bc2a6e17de46ef0e0b8d58d2e300e37e8d624a22a3',
              'app/build.gradle': '4fb5bf49d6608da5ca40e19d742ac5133a8a64d2e0487764fcb2534045d4663d',
              'BmDiagnostics.kt': 'b2a351d94da313e62b94bd2e903bab284730483ca2d3b29a1991faaa779153fc',
              'BankmovieApplication.kt': 'e69beb87d519c9fceaf3ba239322ffb01033b3e171a8443acbb037ea1de4c23c',
              'BmV22Client.kt': '82d20e801fc906b5d33849942879f3e82e0d7030f91aad9bcca811ae1b91efd5',
              'AccountApi.kt': 'a43f8d6fca147ea404dd46422e8266139cde105513a79f8dffe0d2564d28c02d',
              'app/src/main/res/xml/network_security_config.xml': 'b4f26926e1fc336fa361d75032d92b0b0358f43865f4de5e5c3dc11cc7dd1a13',
              'app/src/main/res/raw/isrg_root_yr.pem': 'd8a34bfb5df6b4a0592b0a9cd6b3b9a9335bd431cb2ac32243ab298cba24cbf2',
          }
          for name, expected_hash in expected.items():
              data = (src / name).read_bytes() if not name.startswith('app/') else (root / name).read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected_hash:
                  raise SystemExit(f'SOURCE_MISMATCH {name}: {actual} != {expected_hash}')
              print('PASS_SOURCE_SHA256',name,actual[:20])

          # Safety gate for the native Watch Party host-kick controls.
          player = (src / 'PlayerActivity.kt').read_text()
          main = (src / 'MainActivity.kt').read_text()
          api = (src / 'AccountApi.kt').read_text()
          if 'watchPartyKickMember' not in api or 'watchPartyUndoKickMember' not in api or 'watch_party_undo_kick' not in api:
              raise SystemExit('WATCH_PARTY_KICK_API_MISSING')
          if 'room_member_kicked' not in player or 'watchPartyKickMember' not in player or 'partyKickedMembers' not in player:
              raise SystemExit('WATCH_PARTY_KICK_PLAYER_MISSING')
          if 'watch_party_non_json:' not in api or 'HTTP $code' not in api:
              raise SystemExit('WATCH_PARTY_HTTP_DIAGNOSTICS_MISSING')
          if 'fun watchPartyJoinNumeric' not in api or 'watch_party_join_numeric' not in api:
              raise SystemExit('TV_NUMERIC_JOIN_API_MISSING')
          if 'showTvWatchPartyNumericJoinDialog' not in main or 'if (isTvLike())' not in main:
              raise SystemExit('TV_NUMERIC_JOIN_DIALOG_MISSING')
          if 'archive != 1 && archive != 2' not in main:
              raise SystemExit('ARCHIVE2_LEGACY_FALLBACK_NOT_REMOVED')
          cache_requirements = (
              'private fun rememberHomeForSession()',
              'private fun tryRestoreHomeSession()',
              'resetHomeTvRailViewportsToNewest()',
              'requestHomeTvFocus(target)',
          )
          if any(item not in main for item in cache_requirements):
              raise SystemExit('ANDROID_TV_HOME_CACHE_FIX_MISSING')
          print('TV_NUMERIC_JOIN_AND_ARCHIVE2_SEARCH_STATIC_OK')
          print('WATCH_PARTY_KICK_UNDO_AND_HTTP_DIAGNOSTICS_STATIC_OK')

          # Exact approved poster-wall compositions as phone and 4K TV assets.
          # Their independent aspect ratios prevent portrait crop on television.
          asset = root/'app/src/main/res/drawable-nodpi/bm_splash_wall_phone.webp'
          if hashlib.sha256(asset.read_bytes()).hexdigest() != 'fa933dab138ad1ffb2d857218dd4c6eb7e0a3e3f993548cf349ac645338c5380':
              raise SystemExit('SPLASH_ASSET_HASH_MISMATCH: app/src/main/res/drawable-nodpi/bm_splash_wall_phone.webp')
          asset = root/'app/src/main/res/drawable-nodpi/bm_splash_wall_tv.webp'
          if hashlib.sha256(asset.read_bytes()).hexdigest() != '7907358e95a831b50608a2b940c56337d3eda2b55a95cd57354f276d5abdf49b':
              raise SystemExit('SPLASH_ASSET_HASH_MISMATCH: app/src/main/res/drawable-nodpi/bm_splash_wall_tv.webp')
          real_images = {
              'hero-wall.jpg': '71bb4b8bf5c2ac104d45be305dce1c5041a7d3780b25360513332662580919b9',
              'hero-5.webp': '39b4ff828bf1d047308a03dd9c3010789cd291c8b3b823cbe9bf99a6d07dde5e',
          }
          real_root = root / 'design-resources/real-poster-inputs'
          for filename, expected_digest in real_images.items():
              if hashlib.sha256((real_root/filename).read_bytes()).hexdigest() != expected_digest:
                  raise SystemExit('REAL_USER_POSTER_SOURCE_MISMATCH: '+filename)
          auth_source = src / 'AuthActivity.kt'
          if hashlib.sha256(auth_source.read_bytes()).hexdigest() != '9ac02294e6cba8d61e7bbcfdb4d5ad9aa78d5ba320c4bf8b4734d1ee834b7606':
              raise SystemExit('AUTH_BACKGROUND_SOURCE_HASH_MISMATCH')
          # The two redundant approval PNGs were omitted to keep the source
          # release lean. Runtime 4K/phone WebP images above are SHA-pinned.
          main = (src / 'MainActivity.kt').read_text()
          bridge = (src / 'Media3PlaybackBridge.kt').read_text()
          player = (src / 'PlayerActivity.kt').read_text()
          gradle = (root / 'app/build.gradle').read_text()
          keys = ('action', 'adventure', 'animation', 'anime', 'biography', 'comedy', 'crime', 'documentary', 'drama', 'family', 'fantasy', 'history', 'horror', 'music', 'musical', 'mystery', 'noir', 'romance', 'school', 'sci_fi', 'science', 'short', 'sport', 'supernatural', 'thriller', 'war', 'western')
          manifest = json.loads((root/'GENRE_ORIGINAL_ASSET_MAP.json').read_text())
          if manifest.get('aliases') != {'musical': 'music', 'noir': 'crime'}:
              raise SystemExit('USER_GENRE_SOURCE_MAP_MISSING')
          for key in keys:
              if f'"{key}" -> R.drawable.bm_genre_{key}' not in main:
                  raise SystemExit('GENRE_RESOURCE_REFERENCE_MISSING: '+key)
              asset = root / f'app/src/main/res/drawable-nodpi/bm_genre_{key}.webp'
              if not asset.is_file() or asset.stat().st_size < 10000:
                  raise SystemExit('OFFLINE_ORIGINAL_GENRE_FILE_MISSING: '+key)
              if hashlib.sha256(asset.read_bytes()).hexdigest() != manifest['genre_assets'][key]['sha256']:
                  raise SystemExit('USER_ORIGINAL_GENRE_IMAGE_SHA_MISMATCH: '+key)
          required = [
              'setImageResource(genreImageResource(category.key))',
              'watchlistTabs(allItems)',
              'private fun watchlistIsSeries(',
              'private fun unifiedNetworkFailureCard(',
              'private fun handleHomeSharedErrorDirectionalFocus(',
              'private fun handleV74CategoryDirectionalFocus(',
          ]
          if not all(s in main for s in required): raise SystemExit('GENRE_OR_WATCHLIST_SOURCE_NOT_ACTIVE')
          diag = (src/'BmDiagnostics.kt').read_text()
          app = (src/'BankmovieApplication.kt').read_text()
          if not all(s in main for s in ['showDiagnosticReportDialog()', 'BmDiagnostics.record(', 'bm_v71_about_row_5']):
              raise SystemExit('DIAGNOSTIC_ABOUT_PAGE_OR_ERROR_HOOKS_MISSING')
          if not all(s in main for s in [
              'private fun installMobileNavigationBarInsets()',
              'mobileBottomNavBaseMarginDp = bottom',
              'WindowInsetsCompat.Type.navigationBars()',
              'if (!tv) installMobileNavigationBarInsets()',
          ]):
              raise SystemExit('ANDROID15_MOBILE_NAV_SAFE_INSETS_MISSING')
          # Font choice is untouched; only cramped mobile layouts adapt.
          if not all(s in main for s in [
              'val needsScroll = !isTvLike()',
              'UiPreferences.appFontMode(this@MainActivity)',
              'private fun sectionHeader(',
              'val compactMobileHeader = !tvCompactHeader',
              'val compactMobileActions = !tv',
              'track.findViewWithTag<View>("bm_archive_segment_$selectedArchive")',
          ]):
              raise SystemExit('MOBILE_HOME_FONT_SAFE_RESPONSIVE_LAYOUT_MISSING')
          fonts = (src/'BankmovieFonts.kt').read_text()
          if 'UiPreferences.appFontMode(context)' not in fonts or 'fun applyToTree(' not in fonts:
              raise SystemExit('USER_FONT_SELECTION_OR_CUSTOM_TYPEFACES_MISSING')
          # Two user SVG vectors and contained, scrollable Avatar/Diagnostic modals.
          for resource in ('bm_ic_diagnostics_bug.xml', 'bm_ic_update_alt_user.xml'):
              asset = root/'app/src/main/res/drawable'/resource
              if not asset.is_file() or b'pathData' not in asset.read_bytes():
                  raise SystemExit('USER_SUPPLIED_ABOUT_SVG_MISSING: '+resource)
          if not all(s in main for s in [
              'R.drawable.bm_ic_update_alt_user',
              'R.drawable.bm_ic_diagnostics_bug',
              'galleryScroll.post { galleryScroll.scrollTo(0, 0) }',
              'val avatarGalleryHeightDp = if (isTvLike()) 460 else',
              'clipToOutline = true',
              'private fun showDiagnosticReportDialog()',
              'BmDiagnostics.send(this@MainActivity',
              'BmDiagnostics.snapshot(this@MainActivity',
          ]):
              raise SystemExit('AVATAR_BOUNDED_SCROLL_OR_DIAGNOSTIC_SHEET_MISSING')
          if not all(s in diag for s in ['fun send(', 'fun record(', 'statusProbe()', '/v2/api/diagnostics.php']):
              raise SystemExit('DIAGNOSTIC_COLLECTOR_MISSING')
          if 'uncaught_crash' not in app:
              raise SystemExit('DIAGNOSTIC_CRASH_HOOK_MISSING')
          if not all(s in bridge for s in [
              'private var requestedDisplayMode = "FIT"', 'applyRequestedDisplayMode()',
              'private fun applyVideoSizing()', 'videoView.layoutParams = FrameLayout.LayoutParams(',
              'videoView.videoSurfaceView?.requestLayout()', '"CROP" -> 1.18f', '"STRETCH" -> 1.14f'
          ]):
              raise SystemExit('TV_MEASURED_RESIZE_SOURCE_NOT_ACTIVE')
          if 'box.addView(settingButton("حالت تصویر"' not in player:
              raise SystemExit('TV_REMOTE_SETTINGS_MODE_MISSING')
          if '1.10.1' not in gradle or 'ffmpeg-decoder' in gradle.lower():
              raise SystemExit('MEDIA3_CHANGED_UNEXPECTEDLY')
          print('REQUIRED_BM25_USER_ORIGINAL_GENRES_TV_SOURCE_VERIFIED',len(keys),'keys / 25 original images')
          PYSOURCE

          # Keep the complete BankMovie 2.5 gates and add the second AI's
          # Android TV Home session/cache regression verifiers.
          for verifier in verify_media3_migration.py verify_media3_playback_fixes.py verify_media3_ui_polish.py verify_bm25_ui.py verify_bm25_offline_genres_tv.py verify_bm25_unified_error_tv_genre.py verify_tv_smooth_cache_ui.py verify_v24_smooth_startup_home_session_cache.py verify_bm25_storage_help_icons.py verify_bm25_archive_splash_skeleton_ui.py verify_bm25_splash_poster_motion.py verify_bm25_hd_splash_archive_watchlist.py verify_bm25_real_mosaic_auth.py verify_bm25_tv_splash_readability.py verify_bm25_tls_compat.py; do
            [[ -s "$project_dir/$verifier" ]] || { echo "::error::Missing required source verifier $verifier"; exit 1; }
            ( cd "$project_dir" && python3 "$verifier" )
          done
          [[ -s "$project_dir/verify_v22_5_7_7_tv_home_v23_stable_return.sh" ]] || {
            echo '::error::TV Home stable-return verifier missing'; exit 1;
          }
          ( cd "$project_dir" && bash verify_v22_5_7_7_tv_home_v23_stable_return.sh )

          # Embed a verifiable source stamp into every generated APK (asset is not obfuscated by R8).
          mkdir -p "$project_dir/app/src/main/assets" "$GITHUB_WORKSPACE/output"
          {
            echo 'BANKMOVIE_25_TV_HOME_CACHE_SOURCE_20261121'
            echo "source_zip=$SOURCE_ZIP"
            echo 'app_label=Bankmovie'
            echo 'diagnostics=profile_about_report_and_crash_capture'
            echo 'diagnostics_endpoint=/v2/api/diagnostics.php'
            echo 'tls_provider=conscrypt_2.8.0_android_lt29'
            echo 'tls_trust=system_isrg_root_x1_isrg_root_yr'
            echo 'tls_y_root_sha256=e57b7e6f150c419102e8d5c055729ff967b9d1a829bf00cec89ca604ebf4a86f'
            echo 'version_name=2.5'
            echo 'genres_offline=27'
            echo 'genres_origin=user_genres_zip'
            echo 'genres_unique_files=25'
            echo 'watchlist_tabs=movie_series'
            echo 'home_error_card=single_shared_card_six_steps_two_actions'
            echo 'tv_genre_navigation=index_based_dpad_up_down'
            echo 'tv_home_cache=retained_tv_session_reset_rails_restore_focus'
            echo 'tv_poster_rails=platform_native_focus_reveal'
            echo 'tv_splash_loading=high_contrast_white_shadow'
            echo 'tv_splash_art=unzoomed_native_3840x2160_user_mosaic'
            echo 'tv_splash_motion=static_mobile_animation_unchanged'
            echo 'tv_focus_controls=content_sized_no_scale'
            echo 'tv_dpad_guard=removed_custom_focus_intercept'
            echo 'device_storage_used=total_minus_available'
            echo 'help_step_4=vpn_and_step_5=clear_data_no_warning'
            echo 'archive_tabs=one_line_font_measured_horizontal_scroll_when_cramped'
            echo 'mobile_home=responsive_headers_and_error_actions_preserve_selected_font'
            echo 'avatar_picker=bounded_scroll_clipped_gallery_persistent_pager'
            echo 'about_dialog=themed_diagnostics_report_and_user_svg_icons'
            echo 'detail_skeleton=real_play_size_imdb_likes_monochrome_tint'
            echo 'startup=bankmovie_font_no_tagline'
            echo 'startup_poster_motion=mobile_only_drift_tv_static'
            echo 'startup_poster_mobile_asset=1600x2844_real_three_band_collage'
            echo 'startup_poster_tv_asset=3840x2160_static_three_band_collage'
            echo 'startup_poster_source=real_user_photo_top_original_app_middle_real_user_photo_bottom'
            echo 'startup_poster_separators=no_black_bands'
            echo 'startup_tv_mode=static_landscape_backdrop'
            echo 'startup_logo_scale=about_16_percent_smaller'
            echo 'startup_poster_wall=real_user_sources_no_ai_legacy_auth_remote_disabled'
            echo 'archive3_4_home=exclude_animation_and_subtitled_rails_keep_anime'
            echo 'watchlist_tabs=movie_series_download_vector_icons'
            echo 'skeleton_imdb_likes=neutral_glass_monochrome'
            echo 'detail_more_info=restored_full_width'
            echo 'view_all_icon=user_svg_locale_aware_left_fa_right_en_theme_tint'
            echo 'app_update_icon=user_svg_download'
            echo 'error_buttons=inline_icons_clipped_no_second_art'
            echo 'tv_display_modes=fit_crop_stretch_measured'
            echo 'zip_sha256=2d2adfa4bca088965acf044a76a14710075eefeec30c8c4957cd9cbfd1cb2c71'
            echo "build_commit=$GITHUB_SHA"
            echo "build_run=$GITHUB_RUN_ID"
          } > "$project_dir/app/src/main/assets/bankmovie_source_proof.txt"
          cp "$project_dir/app/src/main/assets/bankmovie_source_proof.txt" "$GITHUB_WORKSPACE/output/BANKMOVIE-SOURCE-PROOF.txt"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo '::notice::Pinned ZIP and Kotlin source verified; APK stamp injected.'

      - name: Set monotonic Android versionCode
        shell: bash
        run: |
          set -euo pipefail
          # Unix epoch seconds are monotonic across workflow renames/replacements
          # and remain below Android's 2,100,000,000 versionCode ceiling today.
          version_code="$(date -u +%s)"
          if (( version_code <= 5400000 || version_code > 2100000000 )); then
            echo "::error::Generated Android versionCode is outside the safe range: $version_code"
            exit 1
          fi
          echo "BANKMOVIE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "::notice::Android versionCode locked for this release: $version_code"

      - name: Restore and verify stable signing keystore
        shell: bash
        env:
          BANKMOVIE_KEYSTORE_B64: ${{ secrets.BANKMOVIE_KEYSTORE_B64 }}
          BANKMOVIE_SIGNING_STORE_PASSWORD: ${{ secrets.BANKMOVIE_SIGNING_STORE_PASSWORD }}
          BANKMOVIE_SIGNING_KEY_ALIAS: ${{ secrets.BANKMOVIE_SIGNING_KEY_ALIAS }}
          BANKMOVIE_SIGNING_KEY_PASSWORD: ${{ secrets.BANKMOVIE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          target="$PROJECT_DIR/bankmovie_update.jks"
          expected_sha="b73994bc2228e91763fde6d049fa792e44bcfce4f1359bef8d0bd6cd6d2f7b39"

          verify_key() {
            local f="$1"
            [[ -s "$f" ]] || return 1
            local actual
            actual="$(sha256sum "$f" | awk '{print $1}')"
            [[ "$actual" == "$expected_sha" ]]
          }

          # Migration-only fallback for the historical BankMovie keystore.
          # GitHub Secrets remain preferred. The legacy source may contain the
          # matching release signing configuration; do not print its values.
          recover_legacy_signing_from_zip() {
            local candidate="$1"
            local -a legacy=()

            # Do not override any explicitly configured GitHub Secret.
            if [[ -n "${BANKMOVIE_SIGNING_STORE_PASSWORD:-}" &&
                  -n "${BANKMOVIE_SIGNING_KEY_ALIAS:-}" &&
                  -n "${BANKMOVIE_SIGNING_KEY_PASSWORD:-}" ]]; then
              return 0
            fi

            mapfile -d '' -t legacy < <(python3 - "$candidate" <<'PYLEGACY'
          import re, sys, zipfile
          try:
              with zipfile.ZipFile(sys.argv[1]) as z:
                  paths = [p for p in z.namelist() if p == 'app/build.gradle' or p.endswith('/app/build.gradle')]
                  if len(paths) != 1:
                      sys.exit(0)
                  gradle = z.read(paths[0]).decode('utf-8', errors='replace')
              # Only literal historical Gradle signing settings; never evaluate code.
              keys = ('storePassword', 'keyAlias', 'keyPassword')
              values = []
              for key in keys:
                  match = re.search(r'(?m)^\s*' + key + r'\s*(?:=|\s)\s*[\"\']([^\"\'\r\n]+)[\"\']', gradle)
                  if not match:
                      sys.exit(0)
                  values.append(match.group(1))
              if all(0 < len(value) <= 200 for value in values):
                  sys.stdout.buffer.write(('\0'.join(values) + '\0').encode('utf-8'))
          except (OSError, KeyError, zipfile.BadZipFile):
              pass
          PYLEGACY
            )
            [[ ${#legacy[@]} -eq 3 ]] || return 1
            [[ -n "${legacy[0]}" && -n "${legacy[1]}" && -n "${legacy[2]}" ]] || return 1

            BANKMOVIE_SIGNING_STORE_PASSWORD="${BANKMOVIE_SIGNING_STORE_PASSWORD:-${legacy[0]}}"
            BANKMOVIE_SIGNING_KEY_ALIAS="${BANKMOVIE_SIGNING_KEY_ALIAS:-${legacy[1]}}"
            BANKMOVIE_SIGNING_KEY_PASSWORD="${BANKMOVIE_SIGNING_KEY_PASSWORD:-${legacy[2]}}"
            echo "::add-mask::$BANKMOVIE_SIGNING_STORE_PASSWORD"
            echo "::add-mask::$BANKMOVIE_SIGNING_KEY_ALIAS"
            echo "::add-mask::$BANKMOVIE_SIGNING_KEY_PASSWORD"
            echo "::notice::Legacy signing settings recovered from the archive holding the SHA-verified update keystore. Move them to GitHub Secrets for future builds."
          }

          recover_key_from_zip() {
            local candidate="$1"
            local label="$2"
            local entry tmp

            unzip -tq "$candidate" >/dev/null 2>&1 || return 1
            entry="$(unzip -Z1 "$candidate" 2>/dev/null | grep -Ei '(^|/)bankmovie_update\.jks$' | head -n 1 || true)"
            [[ -n "$entry" ]] || return 1

            tmp="$(mktemp "$RUNNER_TEMP/bankmovie-update-key.XXXXXX")"
            if unzip -p "$candidate" "$entry" > "$tmp" 2>/dev/null && verify_key "$tmp"; then
              mv "$tmp" "$target"
              echo "::notice::Recovered stable signing key from $label."
              recover_legacy_signing_from_zip "$candidate" || true
              return 0
            fi
            rm -f "$tmp"
            return 1
          }

          materialize_lfs_blob_if_needed() {
            local candidate="$1"
            local out="$2"
            local lfs_oid cached

            if ! grep -q '^version https://git-lfs.github.com/spec/v1' "$candidate" 2>/dev/null; then
              cp "$candidate" "$out"
              return 0
            fi

            lfs_oid="$(sed -n 's/^oid sha256://p' "$candidate" | head -n 1)"
            [[ "$lfs_oid" =~ ^[0-9a-fA-F]{64}$ ]] || return 1

            if ! git lfs version >/dev/null 2>&1; then
              return 1
            fi

            # Fetch only the historical LFS object we need, not every old artifact.
            git lfs fetch --object-id origin "$lfs_oid" >/dev/null 2>&1 || true
            cached="$(find "$GITHUB_WORKSPACE/.git/lfs/objects/${lfs_oid:0:2}/${lfs_oid:2:2}" \
              -type f -name "$lfs_oid" -print -quit 2>/dev/null || true)"
            [[ -s "$cached" ]] || return 1
            cp "$cached" "$out"
          }

          # 1) Prefer the stable key already bundled with the current source.
          if verify_key "$target"; then
            echo "::notice::Stable BankMovie signing keystore is already present in the source."
          else
            rm -f "$target"

            # 2) Preferred CI path: encrypted GitHub Actions secret.
            if [[ -n "${BANKMOVIE_KEYSTORE_B64:-}" ]]; then
              printf '%s' "$BANKMOVIE_KEYSTORE_B64" | base64 --decode > "$target"
              if ! verify_key "$target"; then
                rm -f "$target"
                echo "::error::BANKMOVIE_KEYSTORE_B64 decoded successfully but it is not the stable BankMovie update keystore."
                exit 1
              fi
              echo "::notice::Stable signing keystore restored from GitHub Actions secret."
            fi

            # 3) Private-repository convenience: a root-level keystore file.
            if [[ ! -s "$target" && -s "$GITHUB_WORKSPACE/bankmovie_update.jks" ]]; then
              cp "$GITHUB_WORKSPACE/bankmovie_update.jks" "$target"
              if ! verify_key "$target"; then
                rm -f "$target"
                echo "::error::Repository bankmovie_update.jks does not match the stable BankMovie update key."
                exit 1
              fi
              echo "::notice::Stable signing keystore copied from repository root."
            fi

            # 4) Search every FULLSOURCE zip still present in the current checkout.
            #    This is recursive so archived files in subdirectories are not missed.
            if [[ ! -s "$target" ]]; then
              while IFS= read -r -d '' candidate; do
                if recover_key_from_zip "$candidate" "current repository: ${candidate#$GITHUB_WORKSPACE/}"; then
                  break
                fi
              done < <(find "$GITHUB_WORKSPACE" -type f -iname '*FULLSOURCE*.zip' -print0)
            fi

            # 5) Recovery for deleted older FULLSOURCE zips. Because checkout uses
            #    fetch-depth: 0, their blobs are still reachable from Git history.
            if [[ ! -s "$target" && -d "$GITHUB_WORKSPACE/.git" ]]; then
              echo "::notice::Stable key not found in the current tree; scanning deleted FULLSOURCE zips in Git history."
              cd "$GITHUB_WORKSPACE"
              declare -A seen_history_blobs=()

              while IFS=' ' read -r object path; do
                [[ -n "${object:-}" && -n "${path:-}" ]] || continue
                lower_path="${path,,}"
                [[ "$lower_path" == *fullsource*.zip ]] || continue
                [[ -z "${seen_history_blobs[$object]:-}" ]] || continue
                seen_history_blobs["$object"]=1
                [[ "$(git cat-file -t "$object" 2>/dev/null || true)" == "blob" ]] || continue

                raw="$(mktemp "$RUNNER_TEMP/bankmovie-history-raw.XXXXXX")"
                candidate="$(mktemp "$RUNNER_TEMP/bankmovie-history-zip.XXXXXX")"
                if ! git cat-file blob "$object" > "$raw" 2>/dev/null; then
                  rm -f "$raw" "$candidate"
                  continue
                fi

                if ! materialize_lfs_blob_if_needed "$raw" "$candidate"; then
                  rm -f "$raw" "$candidate"
                  continue
                fi
                rm -f "$raw"

                if recover_key_from_zip "$candidate" "Git history: $path"; then
                  rm -f "$candidate"
                  break
                fi
                rm -f "$candidate"
              done < <(git rev-list --objects --all)
            fi
          fi

          if ! verify_key "$target"; then
            echo "::error::Stable signing keystore was not found in the current source, repository secret, current repository files, or reachable Git history."
            echo "::error::If the old FULLSOURCE commit was force-purged from Git history, restore bankmovie_update.jks or set BANKMOVIE_KEYSTORE_B64."
            exit 1
          fi

          # If the keystore came from a Secret/current file rather than a ZIP,
          # credentials must be explicitly supplied via GitHub Secrets.
          missing=()
          [[ -n "${BANKMOVIE_SIGNING_STORE_PASSWORD:-}" ]] || missing+=(BANKMOVIE_SIGNING_STORE_PASSWORD)
          [[ -n "${BANKMOVIE_SIGNING_KEY_ALIAS:-}" ]] || missing+=(BANKMOVIE_SIGNING_KEY_ALIAS)
          [[ -n "${BANKMOVIE_SIGNING_KEY_PASSWORD:-}" ]] || missing+=(BANKMOVIE_SIGNING_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::The update keystore was found, but these signing settings are missing: ${missing[*]}"
            echo "::error::GitHub repository > Settings > Secrets and variables > Actions > New repository secret."
            echo "::error::Legacy fallback is available only if the SHA-matching FULLSOURCE archive also contains literal historical signing settings."
            exit 1
          fi

          keytool -list -keystore "$target" -storepass "$BANKMOVIE_SIGNING_STORE_PASSWORD" \
            -alias "$BANKMOVIE_SIGNING_KEY_ALIAS" > /dev/null 2>&1 || {
            echo '::error::Stable keystore password or alias is invalid; do not generate a new key.'
            exit 1
          }
          # Verify private-key password too; keytool -list checks only store password.
          csr="$(mktemp "$RUNNER_TEMP/bankmovie-signing.XXXXXX.csr")"
          if ! keytool -certreq -keystore "$target" -storepass "$BANKMOVIE_SIGNING_STORE_PASSWORD" \
            -alias "$BANKMOVIE_SIGNING_KEY_ALIAS" -keypass "$BANKMOVIE_SIGNING_KEY_PASSWORD" \
            -file "$csr" -noprompt > /dev/null 2>&1; then
            rm -f "$csr"
            echo '::error::Stable signing key password is incorrect; do not generate a new key.'
            exit 1
          fi
          rm -f "$csr"

          # GITHUB_ENV makes recovered legacy settings available to LATER steps.
          # Do not print credentials or embed them in the YAML/source APK.
          {
            printf 'BANKMOVIE_SIGNING_STORE_PASSWORD=%s\n' "$BANKMOVIE_SIGNING_STORE_PASSWORD"
            printf 'BANKMOVIE_SIGNING_KEY_ALIAS=%s\n' "$BANKMOVIE_SIGNING_KEY_ALIAS"
            printf 'BANKMOVIE_SIGNING_KEY_PASSWORD=%s\n' "$BANKMOVIE_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          chmod 600 "$target"
          echo "::notice::BankMovie stable signing key SHA-256, alias, and private-key password verified."

      - name: Configure Firebase Cloud Messaging (optional)
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.BANKMOVIE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
