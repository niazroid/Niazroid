      - name: Upload ABI4 Full Armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.5-ABI4-Full-Armeabi-v7a
          path: output/Bankmovie-v2.5-ABI4-Full-Armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ABI4 Full Arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.5-ABI4-Full-Arm64-v8a
          path: output/Bankmovie-v2.5-ABI4-Full-Arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ABI4 Full X86
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.5-ABI4-Full-X86
          path: output/Bankmovie-v2.5-ABI4-Full-X86.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ABI4 Full X86_64
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.5-ABI4-Full-X86_64
          path: output/Bankmovie-v2.5-ABI4-Full-X86_64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksum and size manifests
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.5-Offline-Genres-TV-Source-Proof
          path: |
            output/SHA256SUMS.txt
            output/APK-SIZES.txt
            output/BANKMOVIE-SOURCE-PROOF.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle failure log for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.5-Media3-Gradle-Error-Log
          path: output/gradle-failure.log
          if-no-files-found: ignore
          retention-days: 30
