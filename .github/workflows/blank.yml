name: Build BankMovie 2.1 Archive VIP Remote

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bankmovie-2.1-archive-vip-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: Bankmovie-v2.1-ARCHIVE-VIP-REMOTE-SOURCE.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s app/build.gradle && -s settings.gradle ]]; then
            project_dir="$GITHUB_WORKSPACE"
          else
            source_zip="$SOURCE_ZIP"
            if [[ ! -s "$source_zip" ]]; then
              source_zip="$(find . -maxdepth 1 -type f -iname '*Bankmovie*SOURCE*.zip' -print -quit)"
            fi
            test -n "$source_zip"
            test -s "$source_zip"
            mkdir -p "$RUNNER_TEMP/bankmovie-source"
            unzip -q "$source_zip" -d "$RUNNER_TEMP/bankmovie-source"
            project_dir="$(dirname "$(find "$RUNNER_TEMP/bankmovie-source" -type f -path '*/app/build.gradle' -print -quit)")"
            project_dir="$(dirname "$project_dir")"
          fi
          test -s "$project_dir/app/build.gradle"
          test -s "$project_dir/build.gradle"
          test -s "$project_dir/settings.gradle"
          test -s "$project_dir/bankmovie_update.jks"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup PHP 8.2 for server endpoint lint
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install repository fonts when supplied
        shell: bash
        run: |
          set -euo pipefail
          font_dir="$PROJECT_DIR/app/src/main/assets/fonts"
          mkdir -p "$font_dir"

          font_zip="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'irancell*.zip' -print -quit)"
          if [[ -n "$font_zip" ]]; then
            FONT_ZIP="$font_zip" FONT_DIR="$font_dir" python3 - <<'PY'
          import os, re
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive, output = Path(os.environ['FONT_ZIP']), Path(os.environ['FONT_DIR'])
          targets = {1:'irancell_bold.ttf',2:'irancell_regular.ttf',3:'irancell_black.ttf',4:'irancell_semibold.ttf',5:'irancell_medium.ttf'}
          with ZipFile(archive) as zf:
              indexed = {}
              for item in zf.infolist():
                  if item.is_dir() or not item.filename.lower().endswith('.ttf'): continue
                  match = re.search(r'irancell[^0-9]*([1-5])', PurePosixPath(item.filename).name, re.I)
                  if match: indexed[int(match.group(1))] = item
              for number, name in targets.items():
                  if number not in indexed: raise SystemExit(f'Missing Irancell font {number}')
                  data = zf.read(indexed[number], pwd=b'fontbazi')
                  if len(data) < 1024: raise SystemExit(f'Invalid font: {name}')
                  (output / name).write_bytes(data)
          PY
          fi

          declare -A direct_fonts=(
            [Cinema.otf]=cinema.otf
            ['Diako Hima Regular-@Fontsplua.ttf']=diako_hima.ttf
            ['Nic [@fontbazi].ttf']=nic.ttf
          )
          for source in "${!direct_fonts[@]}"; do
            [[ -s "$GITHUB_WORKSPACE/$source" ]] && cp "$GITHUB_WORKSPACE/$source" "$font_dir/${direct_fonts[$source]}"
          done

          mapfile -t woff_fonts < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'IRANSansXFaNum-*.woff2' -print)
          if [[ ${#woff_fonts[@]} -gt 0 ]]; then
            python3 -m pip install --disable-pip-version-check --quiet fonttools brotli
            FONT_DIR="$font_dir" python3 - <<'PY'
          import os
          from pathlib import Path
          from fontTools.ttLib import TTFont
          root, out = Path(os.environ['GITHUB_WORKSPACE']), Path(os.environ['FONT_DIR'])
          for weight in ('regular','medium','bold'):
              source = next(iter(root.glob(f'IRANSansXFaNum-{weight}*.woff2')), None)
              if source is None: continue
              font = TTFont(source); font.flavor = None; font.save(out / f'iransansx_{weight}.ttf')
          PY
          fi

      - name: Verify security and source integration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          main='app/src/main/java/ir/bankmoviee/app/MainActivity.kt'
          player='app/src/main/java/ir/bankmoviee/app/PlayerActivity.kt'
          manifest='app/src/main/AndroidManifest.xml'

          grep -F 'X-BM-User-Token' "$main"
          grep -F 'private fun downloadUrl(link: JSONObject)' "$main"
          grep -F 'link.optString("download_url")' "$main"
          grep -F 'archive=2' "$main"
          grep -F 'RuntimeVault.config_url_primary' app/src/main/java/ir/bankmoviee/app/AppConfig.kt
          grep -F 'AccountSession.updateVip' app/src/main/java/ir/bankmoviee/app/AccountApi.kt
          grep -F 'downloads_locked' "$main"

          ! grep -R -E 'CastContext|CastButtonFactory|RemoteMediaClient|com.google.android.gms.cast' "$player" "$manifest" app/build.gradle
          ! grep -F "implementation 'com.google.android.gms:play-services-cast-framework" app/build.gradle

          grep -F "applicationId 'ir.bankmoviee.app'" app/build.gradle
          grep -F 'compileSdk 35' app/build.gradle
          grep -F 'targetSdk 35' app/build.gradle
          grep -F 'versionName "2.1"' app/build.gradle
          echo 'b73994bc2228e91763fde6d049fa792e44bcfce4f1359bef8d0bd6cd6d2f7b39  bankmovie_update.jks' | sha256sum -c -

          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in Path('app/src/main').rglob('*.xml'): ET.parse(path)
          sample = Path('server-required/bankmovie_remote_config.json.sample')
          if sample.exists(): json.loads(sample.read_text(encoding='utf-8'))
          print('XML/JSON verification passed')
          PY

          find server-required -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build ABI2 Lite releases
        shell: bash
        env:
          BANKMOVIE_ABIS: armeabi-v7a,arm64-v8a
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleAbi2LiteRelease

      - name: Build ABI4 Full releases
        shell: bash
        env:
          BANKMOVIE_ABIS: armeabi-v7a,arm64-v8a,x86,x86_64
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleAbi4FullRelease

      - name: Collect and verify signed APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            name="$(basename "$apk")"
            cp "$apk" "output/Bankmovie-v2.1-archive-vip-remote-$name"
          done
          test "$(find output -type f -name '*.apk' | wc -l)" -ge 6

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          while IFS= read -r apk; do
            "$apksigner" verify --verbose --print-certs "$apk"
          done < <(find output -type f -name '*.apk' | sort)
          sha256sum output/*.apk | tee output/SHA256SUMS.txt

      - name: Upload APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.1-Archive-VIP-Remote-APKs
          path: output/
          if-no-files-found: error
          retention-days: 30
