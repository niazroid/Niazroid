name: BankMovie 2.5 - Offline Genres, Watchlist Tabs & TV Resize - 8 APKs

# Build ONLY the pinned BankMovie 2.5 offline-genre & TV-resize ZIP. No stale-source fallback.
# Existing app APIs and previous Android app versions remain untouched by this CI job.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bankmovie-v25-offline-genres-tv-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ZIP: BankMovie_Android_MEDIA3_OFFLINE_GENRES_TV_ASPECT_WATCHLIST_V2.5.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required for signing-key recovery when an older FULLSOURCE zip
          # was deleted from the current branch but still exists in Git history.
          fetch-depth: 0

      - name: Locate exact Media3 project
        shell: bash
        run: |
          set -euo pipefail
          # No fallback to stale source in the repository. Missing ZIP is a hard failure.
          source_zip="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          [[ -s "$source_zip" ]] || {
            echo "::error::Required source ZIP missing: $SOURCE_ZIP. Upload this exact ZIP to the repository root."
            exit 1
          }
          echo "ac05964b4d60a828618044dbbd4f563eb1cc954af2f5c147a526b5a3ceb6dd08  $source_zip" | sha256sum --check --status || {
            echo '::error::Source ZIP checksum differs from the required BankMovie 2.5 release.'
            sha256sum "$source_zip"
            exit 1
          }
          unzip -tq "$source_zip"
          extract_dir="$RUNNER_TEMP/bankmovie-media3-src"
          mkdir -p "$extract_dir"
          unzip -q "$source_zip" -d "$extract_dir"
          mapfile -t matches < <(find "$extract_dir" -maxdepth 7 -path '*/app/build.gradle' -type f | sort)
          [[ ${#matches[@]} -eq 1 ]] || { echo "::error::Expected one app/build.gradle in media3 ZIP"; exit 1; }
          project_dir="$(dirname "$(dirname "${matches[0]}")")"

          # Verify direct offline drawables and TV display mode implementation.
          SRC_ROOT="$project_dir" python3 - <<'PYSOURCE'
          import hashlib, os, re
          from pathlib import Path
          root = Path(os.environ['SRC_ROOT'])
          src = root / 'app/src/main/java/ir/bankmoviee/app'
          expected = {
              'MainActivity.kt': '7ae75090cb3c1291ec84e22b008dd29d16d2969f99029615590e4e6be7fe096b',
              'PlayerActivity.kt': 'dace0c40e4f779cb82926b4934e8e2fa04affe98d9b2f5b3d49527d6dc55a056',
              'Media3PlaybackBridge.kt': 'ef8cf17f75676a749b17d9f8213896a96d3781b9e8f24ec6648687d9a4b5923d',
              'PosterDiskCache.kt': '54f80b558e73f57bd381ebbc816bee2255e8c9de7b9ebb5e38f0231702df817a',
              'app/build.gradle': '73f7b722cac602b2bfadf0724c78d690d6f9c98e6d50e3ab9e9dc48eebad3436',
          }
          for name, expected_hash in expected.items():
              data = (src / name).read_bytes() if not name.startswith('app/') else (root / name).read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected_hash:
                  raise SystemExit(f'SOURCE_MISMATCH {name}: {actual} != {expected_hash}')
              print('PASS_SOURCE_SHA256',name,actual[:20])
          main = (src / 'MainActivity.kt').read_text()
          bridge = (src / 'Media3PlaybackBridge.kt').read_text()
          player = (src / 'PlayerActivity.kt').read_text()
          gradle = (root / 'app/build.gradle').read_text()
          keys = ('action', 'adventure', 'animation', 'anime', 'biography', 'comedy', 'crime', 'documentary', 'drama', 'family', 'fantasy', 'history', 'horror', 'music', 'musical', 'mystery', 'noir', 'romance', 'school', 'sci_fi', 'science', 'short', 'sport', 'supernatural', 'thriller', 'war', 'western')
          for key in keys:
              if f'"{key}" -> R.drawable.bm_genre_{key}' not in main:
                  raise SystemExit('GENRE_RESOURCE_REFERENCE_MISSING: '+key)
              asset = root / f'app/src/main/res/drawable-nodpi/bm_genre_{key}.webp'
              if not asset.is_file() or asset.stat().st_size < 20000:
                  raise SystemExit('OFFLINE_GENRE_FILE_MISSING: '+key)
          required = [
              'setImageResource(genreImageResource(category.key))',
              'watchlistTabs(allItems)',
              'private fun watchlistIsSeries(',
          ]
          if not all(s in main for s in required): raise SystemExit('GENRE_OR_WATCHLIST_SOURCE_NOT_ACTIVE')
          if not all(s in bridge for s in ['private var requestedDisplayMode = "FIT"', 'applyRequestedDisplayMode()', 'videoView.videoSurfaceView?.requestLayout()']):
              raise SystemExit('TV_RESIZE_SOURCE_NOT_ACTIVE')
          if 'box.addView(settingButton("حالت تصویر"' not in player:
              raise SystemExit('TV_REMOTE_SETTINGS_MODE_MISSING')
          if '1.10.1' not in gradle or 'ffmpeg-decoder' in gradle.lower():
              raise SystemExit('MEDIA3_CHANGED_UNEXPECTEDLY')
          print('REQUIRED_BM25_OFFLINE_GENRES_TV_WATCHLIST_SOURCE_VERIFIED',len(keys))
          PYSOURCE

          for verifier in verify_media3_migration.py verify_media3_playback_fixes.py verify_media3_ui_polish.py verify_bm25_ui.py verify_bm25_offline_genres_tv.py; do
            [[ -s "$project_dir/$verifier" ]] || { echo "::error::Missing required source verifier $verifier"; exit 1; }
            python3 "$project_dir/$verifier"
          done

          # Embed a verifiable source stamp into every generated APK (asset is not obfuscated by R8).
          mkdir -p "$project_dir/app/src/main/assets" "$GITHUB_WORKSPACE/output"
          {
            echo 'BANKMOVIE_25_OFFLINE_GENRES_TV_20261116'
            echo "source_zip=$SOURCE_ZIP"
            echo 'app_label=Bankmovie'
            echo 'version_name=2.5'
            echo 'genres_offline=27'
            echo 'watchlist_tabs=movie_series'
            echo 'tv_display_modes=fit_crop_stretch'
            echo 'zip_sha256=ac05964b4d60a828618044dbbd4f563eb1cc954af2f5c147a526b5a3ceb6dd08'
            echo "build_commit=$GITHUB_SHA"
            echo "build_run=$GITHUB_RUN_ID"
          } > "$project_dir/app/src/main/assets/bankmovie_source_proof.txt"
          cp "$project_dir/app/src/main/assets/bankmovie_source_proof.txt" "$GITHUB_WORKSPACE/output/BANKMOVIE-SOURCE-PROOF.txt"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo '::notice::Exact requested ZIP and Kotlin source verified; APK stamp injected.'

      - name: Set monotonic Android versionCode
        shell: bash
        run: |
          set -euo pipefail
          # Unix epoch seconds are monotonic across workflow renames/replacements
          # and remain below Android's 2,100,000,000 versionCode ceiling today.
          version_code="$(date -u +%s)"
          if (( version_code <= 5400000 || version_code > 2100000000 )); then
            echo "::error::Generated Android versionCode is outside the safe range: $version_code"
            exit 1
          fi
          echo "BANKMOVIE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "::notice::Android versionCode locked for this release: $version_code"

      - name: Restore and verify stable signing keystore
        shell: bash
        env:
          BANKMOVIE_KEYSTORE_B64: ${{ secrets.BANKMOVIE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077

          target="$PROJECT_DIR/bankmovie_update.jks"
          expected_sha="b73994bc2228e91763fde6d049fa792e44bcfce4f1359bef8d0bd6cd6d2f7b39"

          verify_key() {
            local f="$1"
            [[ -s "$f" ]] || return 1
            local actual
            actual="$(sha256sum "$f" | awk '{print $1}')"
            [[ "$actual" == "$expected_sha" ]]
          }

          recover_key_from_zip() {
            local candidate="$1"
            local label="$2"
            local entry tmp

            unzip -tq "$candidate" >/dev/null 2>&1 || return 1
            entry="$(unzip -Z1 "$candidate" 2>/dev/null | grep -Ei '(^|/)bankmovie_update\.jks$' | head -n 1 || true)"
            [[ -n "$entry" ]] || return 1

            tmp="$(mktemp "$RUNNER_TEMP/bankmovie-update-key.XXXXXX")"
            if unzip -p "$candidate" "$entry" > "$tmp" 2>/dev/null && verify_key "$tmp"; then
              mv "$tmp" "$target"
              echo "::notice::Recovered stable signing key from $label."
              return 0
            fi
            rm -f "$tmp"
            return 1
          }

          materialize_lfs_blob_if_needed() {
            local candidate="$1"
            local out="$2"
            local lfs_oid cached

            if ! grep -q '^version https://git-lfs.github.com/spec/v1' "$candidate" 2>/dev/null; then
              cp "$candidate" "$out"
              return 0
            fi

            lfs_oid="$(sed -n 's/^oid sha256://p' "$candidate" | head -n 1)"
            [[ "$lfs_oid" =~ ^[0-9a-fA-F]{64}$ ]] || return 1

            if ! git lfs version >/dev/null 2>&1; then
              return 1
            fi

            # Fetch only the historical LFS object we need, not every old artifact.
            git lfs fetch --object-id origin "$lfs_oid" >/dev/null 2>&1 || true
            cached="$(find "$GITHUB_WORKSPACE/.git/lfs/objects/${lfs_oid:0:2}/${lfs_oid:2:2}" \
              -type f -name "$lfs_oid" -print -quit 2>/dev/null || true)"
            [[ -s "$cached" ]] || return 1
            cp "$cached" "$out"
          }

          # 1) Prefer the stable key already bundled with the current source.
          if verify_key "$target"; then
            echo "::notice::Stable BankMovie signing keystore is already present in the source."
          else
            rm -f "$target"

            # 2) Preferred CI path: encrypted GitHub Actions secret.
            if [[ -n "${BANKMOVIE_KEYSTORE_B64:-}" ]]; then
              printf '%s' "$BANKMOVIE_KEYSTORE_B64" | base64 --decode > "$target"
              if ! verify_key "$target"; then
                rm -f "$target"
                echo "::error::BANKMOVIE_KEYSTORE_B64 decoded successfully but it is not the stable BankMovie update keystore."
                exit 1
              fi
              echo "::notice::Stable signing keystore restored from GitHub Actions secret."
            fi

            # 3) Private-repository convenience: a root-level keystore file.
            if [[ ! -s "$target" && -s "$GITHUB_WORKSPACE/bankmovie_update.jks" ]]; then
              cp "$GITHUB_WORKSPACE/bankmovie_update.jks" "$target"
              if ! verify_key "$target"; then
                rm -f "$target"
                echo "::error::Repository bankmovie_update.jks does not match the stable BankMovie update key."
                exit 1
              fi
              echo "::notice::Stable signing keystore copied from repository root."
            fi

            # 4) Search every FULLSOURCE zip still present in the current checkout.
            #    This is recursive so archived files in subdirectories are not missed.
            if [[ ! -s "$target" ]]; then
              while IFS= read -r -d '' candidate; do
                if recover_key_from_zip "$candidate" "current repository: ${candidate#$GITHUB_WORKSPACE/}"; then
                  break
                fi
              done < <(find "$GITHUB_WORKSPACE" -type f -iname '*FULLSOURCE*.zip' -print0)
            fi

            # 5) Recovery for deleted older FULLSOURCE zips. Because checkout uses
            #    fetch-depth: 0, their blobs are still reachable from Git history.
            if [[ ! -s "$target" && -d "$GITHUB_WORKSPACE/.git" ]]; then
              echo "::notice::Stable key not found in the current tree; scanning deleted FULLSOURCE zips in Git history."
              cd "$GITHUB_WORKSPACE"
              declare -A seen_history_blobs=()

              while IFS=' ' read -r object path; do
                [[ -n "${object:-}" && -n "${path:-}" ]] || continue
                lower_path="${path,,}"
                [[ "$lower_path" == *fullsource*.zip ]] || continue
                [[ -z "${seen_history_blobs[$object]:-}" ]] || continue
                seen_history_blobs["$object"]=1
                [[ "$(git cat-file -t "$object" 2>/dev/null || true)" == "blob" ]] || continue

                raw="$(mktemp "$RUNNER_TEMP/bankmovie-history-raw.XXXXXX")"
                candidate="$(mktemp "$RUNNER_TEMP/bankmovie-history-zip.XXXXXX")"
                if ! git cat-file blob "$object" > "$raw" 2>/dev/null; then
                  rm -f "$raw" "$candidate"
                  continue
                fi

                if ! materialize_lfs_blob_if_needed "$raw" "$candidate"; then
                  rm -f "$raw" "$candidate"
                  continue
                fi
                rm -f "$raw"

                if recover_key_from_zip "$candidate" "Git history: $path"; then
                  rm -f "$candidate"
                  break
                fi
                rm -f "$candidate"
              done < <(git rev-list --objects --all)
            fi
          fi

          if ! verify_key "$target"; then
            echo "::error::Stable signing keystore was not found in the current source, repository secret, current repository files, or reachable Git history."
            echo "::error::If the old FULLSOURCE commit was force-purged from Git history, restore bankmovie_update.jks or set BANKMOVIE_KEYSTORE_B64."
            exit 1
          fi

          chmod 600 "$target"
          echo "::notice::BankMovie stable signing key SHA-256 verified."

      - name: Configure Firebase Cloud Messaging (optional)
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.BANKMOVIE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [[ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > "$PROJECT_DIR/app/google-services.json"
            python3 - <<'PYJSON'
          import json, os
          path=os.path.join(os.environ['PROJECT_DIR'],'app','google-services.json')
          with open(path,'r',encoding='utf-8') as f: data=json.load(f)
          clients=data.get('client') or []
          if not clients: raise SystemExit('google-services.json has no client entries')
          print('Firebase Android config injected')
          PYJSON
          else
            echo "::warning::BANKMOVIE_GOOGLE_SERVICES_JSON_B64 is not set. APK will build with the existing background-poll notification fallback, but instant FCM push will stay disabled."
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk_root" ]]; then
            echo "::error::Android SDK root was not found: $sdk_root"
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
            exit 1
          fi

          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "$sdkmanager_bin" || ! -x "$sdkmanager_bin" ]]; then
            echo "::error::sdkmanager was not found in the preinstalled GitHub runner Android SDK."
            find "$sdk_root" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "::notice::Using preinstalled Android SDK: $sdk_root"
          echo "::notice::Using sdkmanager: $sdkmanager_bin"

      - name: Install and verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager_bin="$(command -v sdkmanager)"
          yes | "$sdkmanager_bin" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" --sdk_root="$ANDROID_SDK_ROOT" \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0'

          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          echo "::notice::Android SDK 36 and Build Tools 35.0.0 are ready."

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare resilient Gradle artifact downloads
        shell: bash
        run: |
          set -euo pipefail
          # CI-only settings; original Android source and dependency versions stay unchanged.
          # Kotlin compiler 2.2.20 is a large artifact and can time out while downloading.
          cat >> "$PROJECT_DIR/gradle.properties" <<'GRADLE_PROPERTIES'
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=180000
          GRADLE_PROPERTIES

          helper="$RUNNER_TEMP/bankmovie-gradle-retry.sh"
          cat > "$helper" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          max_attempts=3
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            log_file="$(mktemp "${RUNNER_TEMP:-/tmp}/bankmovie-gradle-log.XXXXXX")"
            echo "::group::Gradle attempt ${attempt}/${max_attempts}: $*"
            set +e
            gradle --no-daemon --stacktrace "$@" 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e
            echo '::endgroup::'
            if (( status == 0 )); then
              rm -f "$log_file"
              exit 0
            fi
            # Retry ONLY transient network failures; never conceal source/compiler errors.
            if (( attempt == max_attempts )) || ! grep -Eiq \
              'Read timed out|SocketTimeoutException|Connect timed out|Connection timed out|Connection reset|Broken pipe|UnknownHostException|Temporary failure in name resolution|503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout|Too Many Requests|Received status code (429|50[0-9])|HTTP (429|50[0-9])' \
              "$log_file"; then
              echo "::error::Gradle stopped with exit code $status (attempt $attempt/$max_attempts)."
              echo "::group::Gradle root-cause lines"
              grep -n -E '^e: |^> Task .* FAILED|^FAILURE:|^\* What went wrong:|^Execution failed for task|^> .*Exception|^> Could not|^Caused by:|^\[ERROR\]' "$log_file" | tail -n 90 || true
              echo '--- Last 90 Gradle log lines ---'
              tail -n 90 "$log_file" || true
              echo '::endgroup::'
              mkdir -p "$GITHUB_WORKSPACE/output"
              cp "$log_file" "$GITHUB_WORKSPACE/output/gradle-failure.log" || true
              rm -f "$log_file"
              exit "$status"
            fi
            rm -f "$log_file"
            pause=$((attempt * 15))
            echo "::warning::Transient dependency download failure; retrying Gradle in ${pause}s (attempt $((attempt+1))/$max_attempts)."
            sleep "$pause"
          done
          BASH
          chmod +x "$helper"
          echo "BANKMOVIE_GRADLE_RETRY=$helper" >> "$GITHUB_ENV"
          echo '::notice::Gradle download timeouts set to 120s connect / 180s read; network-only retry enabled.'

      - name: Warm Gradle plugin classpath before APK builds
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          # Fail early/retry while resolving the Kotlin 2.0.21 plugin/compiler jars.
          "$BANKMOVIE_GRADLE_RETRY" help

      # Historical VLC-specific text-pattern verifiers are not applicable to
      # the new engine. The actual Gradle compile and APK audit below are required.
      - name: Verify Media3 bridge and no native VLC dependency
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 verify_media3_migration.py
          python3 verify_media3_playback_fixes.py
          python3 verify_media3_ui_polish.py

      - name: Install and verify BankMovie font pack
        shell: bash
        run: |
          set -euo pipefail
          font_dir="$PROJECT_DIR/app/src/main/assets/fonts"
          mkdir -p "$font_dir"
          python3 -m pip install --disable-pip-version-check --quiet fonttools brotli

          font_zip="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'irancell*.zip' -print -quit)"
          if [[ -n "$font_zip" ]]; then
            FONT_ZIP="$font_zip" FONT_DIR="$font_dir" python3 - <<'PY'
          import os, re
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive, output = Path(os.environ['FONT_ZIP']), Path(os.environ['FONT_DIR'])
          targets = {1:'irancell_bold.ttf',2:'irancell_regular.ttf',3:'irancell_black.ttf',4:'irancell_semibold.ttf',5:'irancell_medium.ttf'}
          with ZipFile(archive) as zf:
              indexed = {}
              for item in zf.infolist():
                  if item.is_dir() or not item.filename.lower().endswith('.ttf'): continue
                  match = re.search(r'irancell[^0-9]*([1-5])', PurePosixPath(item.filename).name, re.I)
                  if match: indexed[int(match.group(1))] = item
              for number, name in targets.items():
                  if number not in indexed: raise SystemExit(f'Missing Irancell font {number}')
                  data = zf.read(indexed[number], pwd=b'fontbazi')
                  if len(data) < 1024: raise SystemExit(f'Invalid font: {name}')
                  (output / name).write_bytes(data)
          PY
          fi

          declare -A direct_fonts=(
            [Cinema.otf]=cinema.otf
            ['Diako Hima Regular-@Fontsplua.ttf']=diako_hima.ttf
            ['Nic [@fontbazi].ttf']=nic.ttf
          )
          for source in "${!direct_fonts[@]}"; do
            [[ -s "$GITHUB_WORKSPACE/$source" ]] && cp "$GITHUB_WORKSPACE/$source" "$font_dir/${direct_fonts[$source]}"
          done

          FONT_DIR="$font_dir" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" python3 - <<'PY'
          import os
          from pathlib import Path
          from fontTools.ttLib import TTFont
          root, out = Path(os.environ['GITHUB_WORKSPACE']), Path(os.environ['FONT_DIR'])
          for weight in ('regular','medium','bold'):
              source = next(iter(root.glob(f'IRANSansXFaNum-{weight}*.woff2')), None)
              if source is None: continue
              font = TTFont(source); font.flavor = None; font.save(out / f'iransansx_{weight}.ttf')
          PY

          filimo_source="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'filimo-demo-variable-vf.woff2' -print -quit)"
          if [[ -z "$filimo_source" ]]; then
            filimo_source="$RUNNER_TEMP/filimo-demo-variable-vf.woff2"
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 12 \
              'https://bankmovie.top/assets/fonts/filimo-demo-variable-vf.woff2' \
              --output "$filimo_source"
          fi
          test -s "$filimo_source"
          FILIMO_SOURCE="$filimo_source" FONT_DIR="$font_dir" python3 - <<'PY'
          import os
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont

          src = Path(os.environ['FILIMO_SOURCE'])
          out_dir = Path(os.environ['FONT_DIR'])
          weights = {400:'400', 500:'500', 700:'700', 900:'900', 950:'950'}

          source_font = TTFont(src)
          if 'fvar' not in source_font or not any(axis.axisTag == 'wght' for axis in source_font['fvar'].axes):
              raise SystemExit('Filimo source is not the expected variable wght font')

          for weight, suffix in weights.items():
              font = TTFont(src)
              static_font = instantiateVariableFont(font, {'wght': weight}, inplace=False, optimize=True)
              static_font.flavor = None

              # Normalize metadata so Android recognizes the requested weight.
              is_bold = weight >= 700
              static_font['OS/2'].usWeightClass = weight
              static_font['OS/2'].fsSelection &= ~(1 << 5)
              static_font['OS/2'].fsSelection &= ~(1 << 6)
              static_font['OS/2'].fsSelection |= (1 << 5) if is_bold else (1 << 6)
              if is_bold:
                  static_font['head'].macStyle |= 1
              else:
                  static_font['head'].macStyle &= ~1

              family = f'BankMovie Filimo {weight}'
              subfamily = 'Bold' if is_bold else 'Regular'
              ps_name = f'BankMovieFilimo-{weight}'
              for record in static_font['name'].names:
                  value = None
                  if record.nameID == 1:
                      value = family
                  elif record.nameID == 2:
                      value = subfamily
                  elif record.nameID == 4:
                      value = f'{family} {subfamily}'
                  elif record.nameID == 6:
                      value = ps_name
                  elif record.nameID == 17:
                      value = subfamily
                  if value is not None:
                      try:
                          record.string = value.encode(record.getEncoding())
                      except Exception:
                          pass

              out = out_dir / f'bankmovie_filimo_{suffix}.ttf'
              static_font.save(out)
              if out.stat().st_size < 4096:
                  raise SystemExit(f'Converted BankMovie font is invalid: {out.name}')
          PY

          required_fonts=(
            bankmovie_filimo_400.ttf bankmovie_filimo_500.ttf bankmovie_filimo_700.ttf bankmovie_filimo_900.ttf bankmovie_filimo_950.ttf
            irancell_regular.ttf irancell_medium.ttf irancell_semibold.ttf irancell_bold.ttf irancell_black.ttf
            cinema.otf diako_hima.ttf nic.ttf
            iransansx_regular.ttf iransansx_medium.ttf iransansx_bold.ttf
          )
          for font in "${required_fonts[@]}"; do
            if [[ ! -s "$font_dir/$font" ]]; then
              echo "::error::Required Android font asset is missing: $font"
              exit 1
            fi
          done
          echo "::notice::BankMovie + legacy font pack installed and verified."

      # Keep the original ABI2-Lite/ABI4-Full edition and 8-artifact contract.
      - name: Build ABI2 Lite releases
        shell: bash
        env:
          BANKMOVIE_ABIS: armeabi-v7a,arm64-v8a
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          "$BANKMOVIE_GRADLE_RETRY" clean assembleAbi2LiteRelease

      - name: Build ABI4 Full releases
        shell: bash
        env:
          BANKMOVIE_ABIS: armeabi-v7a,arm64-v8a,x86,x86_64
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          "$BANKMOVIE_GRADLE_RETRY" assembleAbi4FullRelease

      - name: Collect exactly 8 APKs with original filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          rm -f output/*.apk
          python3 - <<'PYCOLLECT'
          import os
          import shutil
          from pathlib import Path
          from zipfile import ZipFile

          apk_root = Path(os.environ['PROJECT_DIR']) / 'app/build/outputs/apk'
          out = Path('output')
          editions = {
              'abi2Lite': ('ABI2-Lite', [
                  ('Universal', 'universal'),
                  ('Armeabi-v7a', 'armeabi-v7a'),
                  ('Arm64-v8a', 'arm64-v8a')]),
              'abi4Full': ('ABI4-Full', [
                  ('Universal', 'universal'),
                  ('Armeabi-v7a', 'armeabi-v7a'),
                  ('Arm64-v8a', 'arm64-v8a'),
                  ('X86', 'x86'),
                  ('X86_64', 'x86_64')]),
          }
          for flavor, (edition, kinds) in editions.items():
              # Gradle may use camel-case or lower-case folder names depending on version.
              folders = [p for p in apk_root.glob('*/release') if p.parent.name.lower() == flavor.lower()]
              if len(folders) != 1:
                  raise SystemExit(f'Expected one release directory for {flavor}, found: {folders}')
              files = sorted(folders[0].glob('*.apk'))
              if not files:
                  raise SystemExit(f'No APK generated for {flavor} in {folders[0]}')
              def matching(token):
                  for p in files:
                      stem = p.stem.lower()
                      if token == 'universal':
                          if 'universal' in stem: return p
                      elif token == 'x86':
                          if '-x86-' in stem or stem.endswith('-x86'): return p
                      elif token in stem:
                          return p
                  return None
              universal = matching('universal')
              if universal is None and len(files) == 1:
                  # Some AGP configurations output only a normal, native-free APK.
                  universal = files[0]
              if universal is None:
                  raise SystemExit(f'Universal APK missing for {edition}: {[p.name for p in files]}')
              with ZipFile(universal) as apk:
                  native_libs = [n for n in apk.namelist() if n.startswith('lib/') and n.endswith('.so')]
              for label, token in kinds:
                  candidate = universal if token == 'universal' else matching(token)
                  if candidate is None:
                      if native_libs:
                          raise SystemExit(f'Cannot copy a universal APK as {edition} {label}: native libraries present {native_libs}')
                      # With no JNI libraries, APKs are inherently multi-ABI. Preserve
                      # original eight separate artifact names using signed universal bytes.
                      candidate = universal
                      print(f'Native-free edition: using universal APK for {edition} {label}')
                  target = out / f'Bankmovie-v2.5-{edition}-{label}.apk'
                  shutil.copy2(candidate, target)
                  print(f'{target.name}: {target.stat().st_size:,} bytes (source: {candidate.name})')
          assert len(list(out.glob('*.apk'))) == 8, 'Expected exactly 8 separately named APKs'
          PYCOLLECT

      - name: Verify all 8 signed APKs, update identity and no bundled VLC
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt_bin"
          for apk in output/*.apk; do
            "$apksigner" verify --verbose --print-certs "$apk"
            version_code="$($aapt_bin dump badging "$apk" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n 1)"
            version_name="$($aapt_bin dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
            [[ "$version_name" == "2.5" ]] || { echo "::error::Unexpected versionName: $apk ($version_name)"; exit 1; }
            app_label="$($aapt_bin dump badging "$apk" | sed -n "s/^application-label:'\([^']*\)'.*/\1/p" | head -n 1)"
            [[ "$app_label" == "Bankmovie" ]] || { echo "::error::Expected original Bankmovie label, got: $app_label"; exit 1; }
            [[ "$version_code" == "$BANKMOVIE_VERSION_CODE" ]] || { echo "::error::Unexpected versionCode: $apk ($version_code)"; exit 1; }
            APK_FILE="$apk" python3 - <<'PYAUDIT'
          import os, zipfile
          with zipfile.ZipFile(os.environ['APK_FILE']) as z:
              forbidden = [n for n in z.namelist() if 'libvlc' in n.lower() or 'libvlccore' in n.lower()]
              if forbidden: raise SystemExit(f'VLC native libraries still found: {forbidden}')
              if any('ffmpeg' in n.lower() for n in z.namelist() if n.startswith('lib/')):
                  raise SystemExit('Unexpected FFmpeg native library packaged')
              found = {n.rsplit('/',1)[-1].replace('.webp','') for n in z.namelist()
                       if n.endswith('.webp') and 'bm_genre_' in n}
              required = {f'bm_genre_{key}' for key in ('action', 'adventure', 'animation', 'anime', 'biography', 'comedy', 'crime', 'documentary', 'drama', 'family', 'fantasy', 'history', 'horror', 'music', 'musical', 'mystery', 'noir', 'romance', 'school', 'sci_fi', 'science', 'short', 'sport', 'supernatural', 'thriller', 'war', 'western')}
              missing = required - found
              if missing: raise SystemExit(f'APK missing offline genre images: {sorted(missing)}')
              print('APK_OFFLINE_GENRES_OK',len(required),os.environ['APK_FILE'])
              expected_proof = open('output/BANKMOVIE-SOURCE-PROOF.txt', 'rb').read()
              actual_proof = z.read('assets/bankmovie_source_proof.txt')
              if expected_proof != actual_proof:
                  raise SystemExit('Source stamp absent or wrong in '+os.environ['APK_FILE'])
              print('APK_SOURCE_STAMP_OK:', os.environ['APK_FILE'])
          PYAUDIT
            echo "Verified $apk"
          done
          sha256sum output/*.apk > output/SHA256SUMS.txt
          {
            echo 'BankMovie 2.5 Media3 eight signed APK sizes (bytes)'
            find output -maxdepth 1 -name '*.apk' -printf '%f %s\n' | sort
          } > output/APK-SIZES.txt

      - name: Upload ABI2 Lite Universal
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.5-ABI2-Lite-Universal
          path: output/Bankmovie-v2.5-ABI2-Lite-Universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ABI2 Lite Armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: Bankmovie-2.5-ABI2-Lite-Armeabi-v7a
          path: output/Bankmovie-v2.5-ABI2-Lite-Armeabi-v7a.apk
