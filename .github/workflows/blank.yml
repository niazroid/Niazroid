name: Build BankMovie Windows v1.1.44 Weekly Schedule Hardened Zero-Secret

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

env:
  SOURCE_ZIP: BankMovie-v1.1.44-movie-info-svg.zip
  EXTRACT_DIR: _bankmovie_source
  DESKTOP_DIR: _bankmovie_source/bankmovie_desktop_v2_pack/desktop

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        shell: pwsh
        run: |
          $zip = Join-Path "${{ github.workspace }}" "${{ env.SOURCE_ZIP }}"
          if (-not (Test-Path $zip)) { throw "Required source archive not found: $zip" }
          $dest = Join-Path "${{ github.workspace }}" "${{ env.EXTRACT_DIR }}"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force

      - name: Validate source security model
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.1.44') { throw 'Expected version 1.1.44' }
          $main = Get-Content electron/main.js -Raw
          $preload = Get-Content electron/preload.js -Raw
          $runtime = Get-Content electron/runtime.generated.js -Raw
          if ($main -notmatch 'bmEnsureDeviceAccess') { throw 'Device token bootstrap missing' }
          if ($main -notmatch 'bmScheduleDeviceAccessRefresh') { throw 'Proactive token refresh missing' }
          if ($main -notmatch 'X-BM-DPoP') { throw 'DPoP proof missing' }
          if ($main -notmatch 'device_challenge\.php') { throw 'Challenge endpoint missing' }
          if ($main -notmatch 'setAppUserModelId') { throw 'Windows notification identity fix missing' }
          if ($main -match 'X-BM-App-Key|BM_WIN_V1_SECRET|DEFAULT\.appSecret') { throw 'Static API secret logic must not ship' }
          if ($runtime -notmatch 'configPublicKey') { throw 'Pinned public key missing' }
          if ($runtime -match 'BEGIN (RSA )?PRIVATE KEY|maintenance_secret') { throw 'Private/server secret leaked into runtime' }
          $privateHits = Get-ChildItem -Recurse -File | Select-String -Pattern 'BEGIN (RSA )?PRIVATE KEY'
          if ($privateHits) { throw 'Private key material must never ship in Windows package' }
          if ($main -notmatch 'advancedSearchRequest') { throw 'Advanced search missing' }
          if ($main -notmatch 'api6\.php') { throw 'Archive 3 API route missing' }
          if ($preload -notmatch 'advancedSearch') { throw 'Preload bridge missing' }
          if ($preload -notmatch 'weeklySchedule') { throw 'Weekly schedule bridge missing' }
          if ($main -notmatch 'weekly_schedule\.php') { throw 'Weekly schedule API integration missing' }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript before hardening
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          node --check src/app.js
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/runtime.generated.js
          node --check scripts/afterPack.js
          node --check scripts/obfuscate-production.js

      - name: Obfuscate privileged Electron code
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          node scripts/obfuscate-production.js
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/runtime.generated.js

      - name: Build hardened Windows installer
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --publish never

      - name: Create SHA-256 checksums
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          $lines = @()
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($_.Name)"
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-v1.1.44-${{ github.sha }}
          path: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
            ${{ env.DESKTOP_DIR }}/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
            ${{ env.DESKTOP_DIR }}/dist/SHA256SUMS.txt
