name: Build BankMovie Windows 1.2.0 Archive UI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  SOURCE_ZIP: bankmovie_desktop_source_v1.2.0_ARCHIVE_UI.zip
  EXTRACT_DIR: _bankmovie_source

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract exact BankMovie source ZIP
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = '${{ github.workspace }}'
          $zipName = $env:SOURCE_ZIP
          Write-Host "Workspace: $workspace"
          Write-Host "Looking for exact source archive: $zipName"

          $zip = Get-ChildItem -Path $workspace -Recurse -File -Filter $zipName | Select-Object -First 1
          if (-not $zip) {
            Write-Error "Required source archive not found: $zipName"
            Write-Host "Upload exactly '$zipName' anywhere inside the repository."
            Write-Host 'Repository root files:'
            Get-ChildItem -Path $workspace -Force | ForEach-Object { Write-Host " - $($_.Name)" }
            exit 1
          }

          $extract = Join-Path $workspace $env:EXTRACT_DIR
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          New-Item -ItemType Directory -Path $extract | Out-Null
          Write-Host "Using: $($zip.FullName)"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force

          $desktopPackage = Get-ChildItem -Path $extract -Recurse -File -Filter package.json | Where-Object {
            try {
              $pkg = Get-Content $_.FullName -Raw | ConvertFrom-Json
              $pkg.name -eq 'bankmovie-windows'
            } catch { $false }
          } | Select-Object -First 1

          if (-not $desktopPackage) {
            Write-Error 'BankMovie desktop package.json was not found after extraction.'
            Get-ChildItem -Path $extract -Recurse -Depth 4 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          $desktopDir = Split-Path $desktopPackage.FullName -Parent
          Write-Host "Desktop source: $desktopDir"
          "desktop_dir=$desktopDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ steps.source.outputs.desktop_dir }}
        run: npm install

      - name: Verify desktop source
        shell: pwsh
        working-directory: ${{ steps.source.outputs.desktop_dir }}
        run: |
          node --check src/app.js
          node --check electron/main.js
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          Write-Host "Building $($pkg.name) v$($pkg.version)"
          if ($pkg.version -ne '1.2.0') { throw "Expected version 1.2.0, found $($pkg.version)" }

      - name: Build Windows installer
        shell: pwsh
        working-directory: ${{ steps.source.outputs.desktop_dir }}
        run: npm run build:win

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-1.2.0
          path: ${{ steps.source.outputs.desktop_dir }}/dist/**
          if-no-files-found: error

      - name: Publish GitHub Release assets for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.source.outputs.desktop_dir }}/dist/*.exe
            ${{ steps.source.outputs.desktop_dir }}/dist/*.blockmap
          generate_release_notes: true
