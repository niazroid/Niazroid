name: Build BankMovie Windows v1.8.0

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

env:
  SOURCE_ZIP: bankmovie_desktop_source_v1.8.0_ARCHIVE_PRIVACY_DOWNLOADER.zip
  EXTRACT_DIR: _bankmovie_source
  DESKTOP_DIR: _bankmovie_source/bankmovie_desktop_v2_pack/desktop

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact source archive
        shell: pwsh
        run: |
          $zip = Join-Path "${{ github.workspace }}" "${{ env.SOURCE_ZIP }}"
          if (-not (Test-Path $zip)) {
            Write-Host "Repository files:"
            Get-ChildItem "${{ github.workspace }}" | ForEach-Object { Write-Host " - $($_.Name)" }
            throw "Required source archive not found: $zip"
          }

      - name: Extract exact BankMovie Desktop source
        shell: pwsh
        run: |
          $zip = Join-Path "${{ github.workspace }}" "${{ env.SOURCE_ZIP }}"
          $dest = Join-Path "${{ github.workspace }}" "${{ env.EXTRACT_DIR }}"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force

          $desktop = Join-Path "${{ github.workspace }}" "${{ env.DESKTOP_DIR }}"
          $package = Join-Path $desktop "package.json"
          if (-not (Test-Path $package)) { throw "package.json not found at: $package" }

          $pkg = Get-Content $package -Raw | ConvertFrom-Json
          if ($pkg.name -ne 'bankmovie-windows') { throw "Unexpected package: $($pkg.name)" }
          if ($pkg.version -ne '1.8.0') { throw "Expected BankMovie Desktop 1.8.0 but found $($pkg.version)" }

      - name: Validate private build secrets
        shell: pwsh
        env:
          BM_DESKTOP_DOMAIN: ${{ secrets.BM_DESKTOP_DOMAIN }}
          BM_DESKTOP_APP_KEY: ${{ secrets.BM_DESKTOP_APP_KEY }}
          BM_DESKTOP_APP_SECRET: ${{ secrets.BM_DESKTOP_APP_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BM_DESKTOP_DOMAIN)) { throw "Missing GitHub Secret: BM_DESKTOP_DOMAIN" }
          if ([string]::IsNullOrWhiteSpace($env:BM_DESKTOP_APP_KEY)) { throw "Missing GitHub Secret: BM_DESKTOP_APP_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:BM_DESKTOP_APP_SECRET)) { throw "Missing GitHub Secret: BM_DESKTOP_APP_SECRET" }

      - name: Generate private runtime config
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          BM_DESKTOP_DOMAIN: ${{ secrets.BM_DESKTOP_DOMAIN }}
          BM_DESKTOP_APP_KEY: ${{ secrets.BM_DESKTOP_APP_KEY }}
          BM_DESKTOP_APP_SECRET: ${{ secrets.BM_DESKTOP_APP_SECRET }}
        run: |
          $runtime = @{
            domain = $env:BM_DESKTOP_DOMAIN.TrimEnd('/')
            appKey = $env:BM_DESKTOP_APP_KEY
            appSecret = $env:BM_DESKTOP_APP_SECRET
          } | ConvertTo-Json -Compress

          $content = "module.exports = Object.freeze($runtime);"
          Set-Content -Path "electron/runtime.generated.js" -Value $content -Encoding UTF8

          Write-Host "Private runtime config generated for build."
          Write-Host "Credential values are not printed."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm install

      - name: Validate JavaScript
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          node --check src/app.js
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/runtime.generated.js

      - name: Build Windows installer
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Remove generated credential source
        if: always()
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          if (Test-Path "electron/runtime.generated.js") {
            Set-Content -Path "electron/runtime.generated.js" -Value "// removed after build" -Encoding UTF8
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-v1.8.0-${{ github.sha }}
          path: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.zip
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.zip
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
