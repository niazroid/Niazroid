name: Build BankMovie Windows v1.1.0 - Bundle

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

env:
  BUNDLE_ZIP: bankmovie_windows_v1.1.0_MEDIAFIX_bundle.zip
  INNER_ZIP: bankmovie_desktop_source_v1.1.0_MEDIAFIX.zip
  BUNDLE_EXTRACT: _bankmovie_bundle_extract
  SOURCE_EXTRACT: _bankmovie_source
  DESKTOP_DIR: _bankmovie_source/bankmovie_desktop_v2_pack/desktop

jobs:
  build-windows:
    name: Build BankMovie Windows 1.1.0
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract exact bundle and nested desktop ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = '${{ github.workspace }}'

          # Your repository currently contains this OUTER bundle.
          $bundle = Get-ChildItem -Path $workspace -Recurse -File -Filter '${{ env.BUNDLE_ZIP }}' -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $bundle) {
            Write-Host 'Repository root files:'
            Get-ChildItem -Path $workspace -Force | ForEach-Object { Write-Host " - $($_.Name)" }
            throw "Bundle not found: ${{ env.BUNDLE_ZIP }}"
          }

          Write-Host "Using OUTER bundle: $($bundle.FullName)"

          # Verify it is a real ZIP (PK signature), not a Git LFS pointer.
          $stream = [System.IO.File]::OpenRead($bundle.FullName)
          try {
            $byte1 = $stream.ReadByte()
            $byte2 = $stream.ReadByte()
          } finally {
            $stream.Dispose()
          }
          if ($byte1 -ne 0x50 -or $byte2 -ne 0x4B) {
            throw "The bundle is not a real ZIP file: $($bundle.FullName)"
          }

          $bundleDest = Join-Path $workspace '${{ env.BUNDLE_EXTRACT }}'
          $sourceDest = Join-Path $workspace '${{ env.SOURCE_EXTRACT }}'

          if (Test-Path $bundleDest) { Remove-Item $bundleDest -Recurse -Force }
          if (Test-Path $sourceDest) { Remove-Item $sourceDest -Recurse -Force }
          New-Item -ItemType Directory -Path $bundleDest -Force | Out-Null
          New-Item -ItemType Directory -Path $sourceDest -Force | Out-Null

          Write-Host 'Extracting OUTER bundle...'
          Expand-Archive -LiteralPath $bundle.FullName -DestinationPath $bundleDest -Force

          # The desktop source is a SECOND ZIP inside the outer bundle.
          $innerZip = Get-ChildItem -Path $bundleDest -Recurse -File -Filter '${{ env.INNER_ZIP }}' -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $innerZip) {
            Write-Host 'Files found inside OUTER bundle:'
            Get-ChildItem -Path $bundleDest -Recurse -File | ForEach-Object { Write-Host " - $($_.FullName)" }
            throw "Nested desktop ZIP not found: ${{ env.INNER_ZIP }}"
          }

          Write-Host "Using INNER desktop ZIP: $($innerZip.FullName)"
          Write-Host 'Extracting INNER desktop source...'
          Expand-Archive -LiteralPath $innerZip.FullName -DestinationPath $sourceDest -Force

          $desktop = Join-Path $workspace '${{ env.DESKTOP_DIR }}'
          $packagePath = Join-Path $desktop 'package.json'

          if (-not (Test-Path $packagePath)) {
            Write-Host 'Extracted desktop-source files:'
            Get-ChildItem -Path $sourceDest -Recurse -File | ForEach-Object { Write-Host " - $($_.FullName)" }
            throw "package.json not found at expected path: $packagePath"
          }

          $pkg = Get-Content $packagePath -Raw | ConvertFrom-Json
          if ($pkg.name -ne 'bankmovie-windows') {
            throw "Wrong package name. Expected bankmovie-windows, found: $($pkg.name)"
          }
          if ($pkg.version -ne '1.1.0') {
            throw "Wrong package version. Expected 1.1.0, found: $($pkg.version)"
          }

          Write-Host "OK: $($pkg.name) v$($pkg.version)"
          Write-Host "Desktop directory: $desktop"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm install

      - name: Validate JavaScript
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check src/app.js

      - name: Build Windows installer
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Show build output
        if: always()
        shell: pwsh
        run: |
          $dist = Join-Path '${{ github.workspace }}' '${{ env.DESKTOP_DIR }}/dist'
          if (Test-Path $dist) {
            Get-ChildItem -Path $dist -Recurse -File | Format-Table FullName, Length
          } else {
            Write-Host 'dist directory does not exist.'
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-1.1.0-${{ github.sha }}
          path: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.zip
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.zip
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
