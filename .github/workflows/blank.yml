name: Build BankMovie Windows v1.5.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

env:
  SOURCE_ZIP: bankmovie_desktop_source_v1.5.0_REDMOVIE_UX.zip
  EXTRACT_DIR: _bankmovie_source
  DESKTOP_DIR: _bankmovie_source/bankmovie_desktop_v2_pack/desktop
  EXPECTED_VERSION: 1.5.0

jobs:
  build-windows:
    name: Build BankMovie Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact BankMovie source archive
        shell: pwsh
        run: |
          $zip = Join-Path "${{ github.workspace }}" "${{ env.SOURCE_ZIP }}"
          if (-not (Test-Path $zip)) {
            Write-Host "Repository root contents:"
            Get-ChildItem "${{ github.workspace }}" | ForEach-Object { Write-Host " - $($_.Name)" }
            throw "Required source archive not found: $zip"
          }
          Write-Host "Using exact source archive: $zip"

      - name: Extract source once
        shell: pwsh
        run: |
          $zip = Join-Path "${{ github.workspace }}" "${{ env.SOURCE_ZIP }}"
          $dest = Join-Path "${{ github.workspace }}" "${{ env.EXTRACT_DIR }}"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force

          $desktop = Join-Path "${{ github.workspace }}" "${{ env.DESKTOP_DIR }}"
          $package = Join-Path $desktop "package.json"
          if (-not (Test-Path $package)) {
            Get-ChildItem $dest -Recurse | ForEach-Object { Write-Host " - $($_.FullName)" }
            throw "Desktop package.json was not found at: $package"
          }

          $pkg = Get-Content $package -Raw | ConvertFrom-Json
          if ($pkg.name -ne "bankmovie-windows") {
            throw "Unexpected package name: $($pkg.name)"
          }
          if ($pkg.version -ne "${{ env.EXPECTED_VERSION }}") {
            throw "Wrong BankMovie version. Expected ${{ env.EXPECTED_VERSION }}, found $($pkg.version)"
          }
          Write-Host "Verified BankMovie Desktop $($pkg.version): $desktop"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm install

      - name: Build Windows NSIS installer
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Verify build output
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          if (-not (Test-Path "dist")) { throw "dist folder was not created." }
          $exe = Get-ChildItem "dist" -Filter "*.exe" -File
          if (-not $exe) { throw "No Windows EXE was produced." }
          Get-ChildItem "dist" -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-v1.5.0-${{ github.sha }}
          path: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.zip
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.zip
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
