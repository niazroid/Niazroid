name: Build BankMovie Windows v1.0.0 Separate x64 and ia32

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

env:
  SOURCE_ZIP: BankMovie-v1.0.0-x64-ia32-update-fix.zip
  EXTRACT_DIR: _bankmovie_source
  DESKTOP_DIR: _bankmovie_source/bankmovie_desktop_v2_pack/desktop

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        shell: pwsh
        run: |
          $zip = Join-Path "${{ github.workspace }}" "${{ env.SOURCE_ZIP }}"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            Write-Host "Available ZIP files in repository root:"
            Get-ChildItem -LiteralPath "${{ github.workspace }}" -Filter '*.zip' -File | Select-Object -ExpandProperty Name | ForEach-Object { Write-Host " - $_" }
            throw "Missing ${{ env.SOURCE_ZIP }} in repository root. Upload/commit the v1.0.0 source ZIP beside README (not the server patches)."
          }
          $dest = Join-Path "${{ github.workspace }}" "${{ env.EXTRACT_DIR }}"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force

      - name: Validate source security model
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.0.0') { throw 'Expected version 1.0.0' }
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF -ne "refs/tags/v$($pkg.version)") { throw 'Release tag does not match app version' }
          $main = Get-Content electron/main.js -Raw
          $preload = Get-Content electron/preload.js -Raw
          $runtime = Get-Content electron/runtime.generated.js -Raw
          if ($main -notmatch 'bmEnsureDeviceAccess') { throw 'Device token bootstrap missing' }
          if ($main -notmatch 'bmScheduleDeviceAccessRefresh') { throw 'Proactive token refresh missing' }
          if ($main -notmatch 'X-BM-DPoP') { throw 'DPoP proof missing' }
          if ($main -notmatch 'device_challenge\.php') { throw 'Challenge endpoint missing' }
          if ($main -notmatch 'setAppUserModelId') { throw 'Windows notification identity fix missing' }
          if ($main -match 'X-BM-App-Key|BM_WIN_V1_SECRET|DEFAULT\.appSecret') { throw 'Static API secret logic must not ship' }
          if ($runtime -notmatch 'configPublicKey') { throw 'Pinned public key missing' }
          if ($runtime -match 'BEGIN (RSA )?PRIVATE KEY|maintenance_secret') { throw 'Private/server secret leaked into runtime' }
          $privateHits = Get-ChildItem -Recurse -File | Select-String -Pattern 'BEGIN (RSA )?PRIVATE KEY'
          if ($privateHits) { throw 'Private key material must never ship in Windows package' }
          if ($main -notmatch 'advancedSearchRequest') { throw 'Advanced search missing' }
          if ($main -notmatch 'api6\.php') { throw 'Archive 3 API route missing' }
          if ($preload -notmatch 'advancedSearch') { throw 'Preload bridge missing' }
          if ($preload -notmatch 'weeklySchedule') { throw 'Weekly schedule bridge missing' }
          if ($pkg.build.nsis.include) { throw 'Standard NSIS must not load any custom dark theme hook' }
          if ($main -notmatch 'BMFailover') { throw 'Signed content failover missing' }
          if ($main -notmatch 'weekly_schedule\.php') { throw 'Weekly schedule API integration missing' }

      - name: Test version and Archive 1 fallback
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: node tests/release-v1-archive-reset.test.js

      - name: Test update gate (version 1.0.0)
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: node tests/update-gate-v1.0.0.test.js

      - name: Test Home navigation
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: node tests/test-home-navigation-v149.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript before hardening
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          node --check src/app.js
          node --check src/desktop-policy.js
          node --check src/desktop-policy-ui.js
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/content-failover.js
          node --check electron/runtime.generated.js
          node --check scripts/afterPack.js
          node --check scripts/obfuscate-production.js
          node --check tests/security-smoke.js
          node tests/security-smoke.js
          node tests/desktop-policy.test.js
          node tests/comment-ui.test.js
          node tests/weekly-navigation.test.js

      - name: Obfuscate privileged Electron code
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          node scripts/obfuscate-production.js
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/content-failover.js
          node --check electron/runtime.generated.js

      # Manual/branch artifacts may remain unsigned for internal testing only.
      # Tagged public releases require a valid Windows signing certificate.
      - name: Require release signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'Public release requires WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD secrets.'
          }

      - name: Build hardened Windows installer (${{ matrix.arch }})
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        # Explicit target:arch is essential! Building both in one command creates one combined installer.
        run: npx electron-builder --win nsis:${{ matrix.arch }} --publish never

      - name: Check expected architecture-specific installer
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          $expected = "BankMovie-Setup-1.0.0-${{ matrix.arch }}.exe"
          if (-not (Test-Path (Join-Path dist $expected))) { 
            Get-ChildItem dist | Select-Object -ExpandProperty Name
            throw "Missing separate $expected"
          }
          $installers = @(Get-ChildItem dist -Filter 'BankMovie-Setup-*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one ${{ matrix.arch }} installer per job" }

      - name: Verify installer Authenticode signature for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          $exes = @(Get-ChildItem dist -Filter '*.exe' -File)
          if ($exes.Count -eq 0) { throw 'No Windows installer found for signature verification.' }
          foreach ($exe in $exes) {
            $signature = Get-AuthenticodeSignature -FilePath $exe.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid installer Authenticode signature: $($exe.Name) ($($signature.Status))"
            }
          }

      - name: Create SHA-256 checksum for this architecture
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          $installer = Get-Item "dist/BankMovie-Setup-1.0.0-${{ matrix.arch }}.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "dist/SHA256SUMS-${{ matrix.arch }}.txt" -Encoding ascii

      - name: Upload separate Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-v1.0.0-${{ matrix.arch }}
          path: |
            ${{ env.DESKTOP_DIR }}/dist/BankMovie-Setup-1.0.0-${{ matrix.arch }}.exe
            ${{ env.DESKTOP_DIR }}/dist/SHA256SUMS-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Collect the two separate installers
        uses: actions/download-artifact@v4
        with:
          pattern: BankMovie-Windows-v1.0.0-*
          path: release-files
          merge-multiple: true

      - name: Verify both installers and create release checksums
        shell: pwsh
        run: |
          $expected = @('BankMovie-Setup-1.0.0-x64.exe', 'BankMovie-Setup-1.0.0-ia32.exe')
          $lines = @()
          foreach ($name in $expected) {
            $path = Join-Path release-files $name
            if (-not (Test-Path $path)) { throw "Missing release artifact: $name" }
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $name"
          }
          $lines | Set-Content release-files/SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/*.exe
            release-files/SHA256SUMS.txt
