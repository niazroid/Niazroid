name: Audit existing BankMovie Windows installer
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Actions run ID of the blocked build (no rebuild)'
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Retrieve original build artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: BankMovie-Windows-v1.0.0-*
          path: audit-input
      - name: Inspect installer without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path audit-report -Force | Out-Null
          $root = (Resolve-Path audit-input).Path
          $files = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'BankMovie-Setup-*.exe')
          if ($files.Count -eq 0) { throw 'No installer found in the selected original run.' }
          $results = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $sig = Get-AuthenticodeSignature -FilePath $file.FullName
            $checksums = @(Get-ChildItem -LiteralPath $file.DirectoryName -File -Filter 'SHA256SUMS*.txt' | Get-Content)
            $expected = @($checksums | Where-Object { $_ -match ('^[a-fA-F0-9]{64}\s+\*?' + [regex]::Escape($file.Name) + '$') })
            $match = if ($expected.Count -eq 1) { $expected[0].Substring(0,64).ToLowerInvariant() -eq $hash } else { $null }
            [pscustomobject]@{ file=$file.Name; bytes=$file.Length; sha256=$hash; recorded_checksum_matches=$match; signature=$sig.Status.ToString(); signer=$sig.SignerCertificate.Subject; timestamp_signer=$sig.TimeStamperCertificate.Subject }
          }
          ConvertTo-Json -InputObject @($results) -Depth 4 | Set-Content audit-report/installers.json
          Get-Content audit-report/installers.json
          $scan = [ordered]@{ status='not_run'; reason=''; detections=@() }
          try {
            if (-not (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)) { throw 'Defender unavailable on runner' }
            $av = Get-MpComputerStatus
            if (-not $av.AntivirusEnabled -or -not $av.AMServiceEnabled) { throw 'Defender is not enabled on runner' }
            Update-MpSignature -ErrorAction Stop
            $started = Get-Date
            Start-MpScan -ScanType CustomScan -ScanPath $root -ErrorAction Stop
            $hits = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object { $_.InitialDetectionTime -ge $started.AddSeconds(-2) -or (($_.Resources -join ' ') -like "*$root*") } | Select-Object ThreatID, InitialDetectionTime, Resources, ActionSuccess)
            $scan.detections = $hits
            $scan.status = if ($hits.Count -gt 0) { 'detections_reported' } else { 'no_detections_reported_by_defender' }
          } catch { $scan.status = 'inconclusive'; $scan.reason = $_.Exception.Message }
          $scan | ConvertTo-Json -Depth 6 | Set-Content audit-report/defender.json
          Get-Content audit-report/defender.json
          if ($scan.status -eq 'detections_reported' -or @($results | Where-Object { $_.recorded_checksum_matches -eq $false }).Count -gt 0) { throw 'Security audit found a detection or checksum mismatch.' }
      - name: Upload audit report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-installer-audit-report
          path: audit-report/
          if-no-files-found: warn
