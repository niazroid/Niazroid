name: Build BankMovie Windows v1.3 Final

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankmovie-windows-v13-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      SOURCE_ZIP: BankMovie-Windows-v1.3-IO-WINDOWSTATE-FIX-source.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract exact source and set paths
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE $env:SOURCE_ZIP
          if (-not (Test-Path $zip)) {
            Write-Host "Required source ZIP was not found: $zip"
            Write-Host "Files in repository root:"
            Get-ChildItem $env:GITHUB_WORKSPACE -File | ForEach-Object { Write-Host " - $($_.Name)" }
            exit 1
          }

          $root = Join-Path $env:RUNNER_TEMP "BankMovie-Windows-v1.3"
          if (Test-Path $root) {
            Remove-Item $root -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $zip -DestinationPath $root -Force

          $project = Join-Path $root "src\BankMovie.Windows\BankMovie.Windows.csproj"
          $installer = Join-Path $root "installer\BankMovie.iss"
          $publish = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish"
          $output = Join-Path $env:GITHUB_WORKSPACE "artifacts\output"

          if (-not (Test-Path $project)) {
            Write-Host "Project was not found at: $project"
            Get-ChildItem $root -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          if (-not (Test-Path $installer)) {
            Write-Host "Installer script was not found at: $installer"
            exit 1
          }

          Add-Content -Path $env:GITHUB_ENV -Value "SOURCE_ROOT=$root"
          Add-Content -Path $env:GITHUB_ENV -Value "PROJECT=$project"
          Add-Content -Path $env:GITHUB_ENV -Value "INSTALLER_SCRIPT=$installer"
          Add-Content -Path $env:GITHUB_ENV -Value "PUBLISH_DIR=$publish"
          Add-Content -Path $env:GITHUB_ENV -Value "OUTPUT_DIR=$output"

          Write-Host "Source ZIP: $zip"
          Write-Host "Project: $project"
          Write-Host "Installer: $installer"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set build version
        shell: pwsh
        run: |
          $version = "1.3.$env:GITHUB_RUN_NUMBER"
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version"
          Write-Host "Version: $version"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore "$env:PROJECT" --runtime win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:PUBLISH_DIR | Out-Null
          dotnet publish "$env:PROJECT" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output "$env:PUBLISH_DIR" `
            -p:Version=$env:APP_VERSION `
            -p:FileVersion="$env:APP_VERSION.0" `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify published application
        shell: pwsh
        run: |
          $app = Join-Path $env:PUBLISH_DIR "BankMovie.exe"
          if (-not (Test-Path $app)) {
            Write-Host "BankMovie.exe was not created. Publish files:"
            Get-ChildItem $env:PUBLISH_DIR -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          $vlc = Get-ChildItem $env:PUBLISH_DIR -Recurse -File -Filter "libvlc.dll" | Select-Object -First 1
          if ($null -eq $vlc) {
            Write-Host "libvlc.dll was not included in the publish output."
            exit 1
          }

          Write-Host "Application: $app"
          Write-Host "LibVLC: $($vlc.FullName)"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OUTPUT_DIR | Out-Null
          $portable = Join-Path $env:OUTPUT_DIR "BankMovie-Portable-x64.zip"
          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath $portable -Force

      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          $webview = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $webview
          if (-not (Test-Path $webview)) { exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "WEBVIEW_BOOTSTRAPPER=$webview"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Setup EXE
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup compiler was not found: $iscc"
            exit 1
          }

          & $iscc `
            "/DMyAppVersion=$env:APP_VERSION" `
            "/DSourceDir=$env:PUBLISH_DIR" `
            "/DWebView2Bootstrapper=$env:WEBVIEW_BOOTSTRAPPER" `
            "/O$env:OUTPUT_DIR" `
            "$env:INSTALLER_SCRIPT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create checksums
        shell: pwsh
        run: |
          $checksum = Join-Path $env:OUTPUT_DIR "SHA256SUMS.txt"
          Get-ChildItem $env:OUTPUT_DIR -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Content -Path $checksum -Value "$hash  $($_.Name)"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-v1.3-${{ github.run_number }}
          path: artifacts/output/*
          if-no-files-found: error
          retention-days: 30
