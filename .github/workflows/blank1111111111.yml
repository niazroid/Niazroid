name: Build BankMovie Windows v1

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'installer/**'
      - '.github/workflows/build-windows.yml'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: bankmovie-windows-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      PUBLISH_DIR: ${{ github.workspace }}\artifacts\publish
      OUTPUT_DIR: ${{ github.workspace }}\artifacts\output
      # Deliberately frozen until the Windows product is declared complete.
      BM_PUBLIC_VERSION: 1.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project paths
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Repository files:"
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Select-Object Name, FullName

          $projects = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Recurse -File -Filter 'BankMovie.Windows.csproj' -ErrorAction SilentlyContinue)
          if ($projects.Count -eq 0) {
            Write-Host "No BankMovie.Windows.csproj found. Available .csproj files:"
            Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Recurse -File -Filter '*.csproj' -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host " - $($_.FullName)" }
            throw 'BankMovie.Windows.csproj was not found anywhere in the repository.'
          }
          if ($projects.Count -gt 1) {
            Write-Host "Multiple BankMovie.Windows.csproj files found:"
            $projects | ForEach-Object { Write-Host " - $($_.FullName)" }
            throw 'More than one BankMovie.Windows.csproj was found; keep only one source tree in the repository.'
          }

          $project = $projects[0].FullName
          $projectRoot = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $project))

          $installerCandidates = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Recurse -File -Filter 'BankMovie.iss' -ErrorAction SilentlyContinue)
          if ($installerCandidates.Count -eq 0) {
            throw 'installer/BankMovie.iss was not found anywhere in the repository.'
          }

          # Prefer the installer that belongs to the same source tree as the project.
          $installer = $installerCandidates |
            Sort-Object @{Expression={ if ($_.FullName.StartsWith($projectRoot, [System.StringComparison]::OrdinalIgnoreCase)) { 0 } else { 1 } }}, FullName |
            Select-Object -First 1

          "PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_SCRIPT=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Detected project: $project"
          Write-Host "Detected installer: $($installer.FullName)"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate v1 version policy
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROJECT) -or !(Test-Path -LiteralPath $env:PROJECT)) {
            throw "Project not found after auto-detection: $env:PROJECT"
          }
          $projectText = Get-Content -LiteralPath $env:PROJECT -Raw
          if ($projectText -notmatch '<Version>1\.0\.0</Version>') { throw 'Project version must remain 1.0.0 during development.' }
          if ($projectText -notmatch '<FileVersion>1\.0\.0\.0</FileVersion>') { throw 'FileVersion must remain 1.0.0.0 during development.' }
          Write-Host 'Version policy OK: public version is fixed at v1.'

      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:PROJECT" -r win-x64

      - name: Build
        shell: pwsh
        run: dotnet build "$env:PROJECT" -c Release -r win-x64 --no-restore -p:Version=$env:BM_PUBLIC_VERSION -p:FileVersion=1.0.0.0

      - name: Publish self-contained x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:PUBLISH_DIR | Out-Null
          dotnet publish "$env:PROJECT" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o "$env:PUBLISH_DIR" `
            -p:Version=$env:BM_PUBLIC_VERSION `
            -p:FileVersion=1.0.0.0 `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false

      - name: Validate runtime
        shell: pwsh
        run: |
          $exe = Join-Path $env:PUBLISH_DIR 'BankMovie.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'BankMovie.exe was not created.' }
          $libvlc = Get-ChildItem $env:PUBLISH_DIR -Recurse -File -Filter 'libvlc.dll' | Select-Object -First 1
          if (!$libvlc) { throw 'libvlc.dll is missing from publish output.' }
          Write-Host "BankMovie: $exe"
          Write-Host "LibVLC: $($libvlc.FullName)"

      - name: Create portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OUTPUT_DIR | Out-Null
          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath "$env:OUTPUT_DIR\BankMovie-Windows-v1-Portable-x64.zip" -Force

      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $target
          if ((Get-Item $target).Length -lt 500000) { throw 'Invalid WebView2 bootstrapper.' }
          "WEBVIEW_BOOTSTRAPPER=$target" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) { throw 'Inno Setup compiler not found.' }
          & $iscc `
            "/DMyAppVersion=$env:BM_PUBLIC_VERSION" `
            "/DSourceDir=$env:PUBLISH_DIR" `
            "/DWebView2Bootstrapper=$env:WEBVIEW_BOOTSTRAPPER" `
            "/O$env:OUTPUT_DIR" `
            "$env:INSTALLER_SCRIPT"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $setup = Get-ChildItem $env:OUTPUT_DIR -File -Filter 'BankMovie-Setup-x64.exe' | Select-Object -First 1
          if (!$setup) { throw 'Setup EXE was not created.' }
          Rename-Item -LiteralPath $setup.FullName -NewName 'BankMovie-Windows-v1-Setup-x64.exe'

      - name: SHA-256
        shell: pwsh
        run: |
          $checksumFile = Join-Path $env:OUTPUT_DIR 'SHA256SUMS.txt'
          if (Test-Path -LiteralPath $checksumFile) { Remove-Item $checksumFile -Force }
          Get-ChildItem $env:OUTPUT_DIR -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath $checksumFile -Append -Encoding ascii
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-v1
          path: artifacts/output/*
          if-no-files-found: error
          retention-days: 30
