name: Build BankMovie Windows V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "BankMovie-Windows-v1-rebuilt-source.zip"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: bankmovie-windows-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      SOURCE_ZIP: ${{ github.workspace }}\BankMovie-Windows-v1-rebuilt-source.zip
      SOURCE_DIR: ${{ github.workspace }}\_bankmovie_v1_source
      PROJECT: ${{ github.workspace }}\_bankmovie_v1_source\src\BankMovie.Windows\BankMovie.Windows.csproj
      INSTALLER_SCRIPT: ${{ github.workspace }}\_bankmovie_v1_source\installer\BankMovie.iss
      PUBLISH_DIR: ${{ github.workspace }}\artifacts\publish
      OUTPUT_DIR: ${{ github.workspace }}\artifacts\output
      BM_PUBLIC_VERSION: 1.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract BankMovie V1 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Source ZIP: $env:SOURCE_ZIP"

          if (!(Test-Path -LiteralPath $env:SOURCE_ZIP)) {
            Write-Host "Repository root files:"
            Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force |
              ForEach-Object { Write-Host " - $($_.Name)" }

            throw "BankMovie-Windows-v1-rebuilt-source.zip was not found in repository root."
          }

          if (Test-Path -LiteralPath $env:SOURCE_DIR) {
            Remove-Item -LiteralPath $env:SOURCE_DIR -Recurse -Force
          }

          New-Item -ItemType Directory -Path $env:SOURCE_DIR -Force | Out-Null
          Expand-Archive -LiteralPath $env:SOURCE_ZIP -DestinationPath $env:SOURCE_DIR -Force

          if (!(Test-Path -LiteralPath $env:PROJECT)) {
            Write-Host "Extracted files:"
            Get-ChildItem -LiteralPath $env:SOURCE_DIR -Recurse -File |
              ForEach-Object { Write-Host " - $($_.FullName)" }

            throw "Project was not found after extracting source ZIP: $env:PROJECT"
          }

          if (!(Test-Path -LiteralPath $env:INSTALLER_SCRIPT)) {
            throw "Installer script was not found: $env:INSTALLER_SCRIPT"
          }

          Write-Host "Project: $env:PROJECT"
          Write-Host "Installer: $env:INSTALLER_SCRIPT"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: "_bankmovie_v1_source/src/BankMovie.Windows/BankMovie.Windows.csproj"

      - name: Keep public version fixed at V1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectText = Get-Content -LiteralPath $env:PROJECT -Raw

          if ($projectText -notmatch "<Version>1\.0\.0</Version>") {
            throw "BankMovie public version must remain 1.0.0."
          }

          if ($projectText -notmatch "<FileVersion>1\.0\.0\.0</FileVersion>") {
            throw "BankMovie FileVersion must remain 1.0.0.0."
          }

          Write-Host "Version locked to V1 / 1.0.0."

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore "$env:PROJECT" `
            --runtime win-x64

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed with exit code $LASTEXITCODE"
          }

      - name: Build Release x64
        shell: pwsh
        run: |
          dotnet build "$env:PROJECT" `
            --configuration Release `
            --runtime win-x64 `
            --no-restore `
            -p:Version=$env:BM_PUBLIC_VERSION `
            -p:FileVersion=1.0.0.0 `
            -p:AssemblyVersion=1.0.0.0

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet build failed with exit code $LASTEXITCODE"
          }

      - name: Publish lightweight framework-dependent Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath $env:PUBLISH_DIR) {
            Remove-Item -LiteralPath $env:PUBLISH_DIR -Recurse -Force
          }

          New-Item -ItemType Directory -Path $env:PUBLISH_DIR -Force | Out-Null

          dotnet publish "$env:PROJECT" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --no-restore `
            --output "$env:PUBLISH_DIR" `
            -p:Version=$env:BM_PUBLIC_VERSION `
            -p:FileVersion=1.0.0.0 `
            -p:AssemblyVersion=1.0.0.0 `
            -p:SelfContained=false `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE"
          }

      - name: Validate external-player-only publish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Join-Path $env:PUBLISH_DIR "BankMovie.exe"
          if (!(Test-Path -LiteralPath $exe)) {
            throw "BankMovie.exe was not generated."
          }

          $forbidden = @(
            "libvlc.dll",
            "libvlccore.dll",
            "LibVLCSharp.dll",
            "LibVLCSharp.WPF.dll"
          )
          foreach ($name in $forbidden) {
            $match = Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Recurse -File -Filter $name -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -ne $match) {
              throw "Internal-player runtime must not be bundled: $($match.FullName)"
            }
          }

          Write-Host "BankMovie.exe OK"
          Write-Host "Internal LibVLC runtime is not bundled."

      - name: Validate lightweight publish size
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $runtimeFiles = @(
            "coreclr.dll",
            "clrjit.dll",
            "hostpolicy.dll",
            "System.Private.CoreLib.dll"
          )

          foreach ($name in $runtimeFiles) {
            $match = Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Recurse -File -Filter $name -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -ne $match) {
              throw "Framework-dependent publish unexpectedly bundled .NET runtime file: $($match.FullName)"
            }
          }

          $publishBytes = (Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $publishMiB = [math]::Round($publishBytes / 1MB, 2)
          Write-Host "Framework-dependent publish size: $publishMiB MiB"

          if ($publishBytes -gt 25MB) {
            throw "Publish is unexpectedly large ($publishMiB MiB). Expected <= 25 MiB for the web shell."
          }

          # Keep GitHub's artifact ZIP clean: do not generate a ZIP inside it.
          $nestedZip = Get-ChildItem -LiteralPath $env:SOURCE_DIR -Recurse -File -Filter *.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $nestedZip) {
            throw "Nested ZIP found inside source package: $($nestedZip.FullName)"
          }

      - name: Download Microsoft WebView2 bootstrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Path $env:OUTPUT_DIR -Force | Out-Null

          $target = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile $target

          if (!(Test-Path -LiteralPath $target)) {
            throw "WebView2 bootstrapper download failed."
          }

          if ((Get-Item -LiteralPath $target).Length -lt 500000) {
            throw "Downloaded WebView2 bootstrapper is invalid."
          }

          "WEBVIEW_BOOTSTRAPPER=$target" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download .NET 8 Desktop Runtime x64 offline installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $target = Join-Path $env:RUNNER_TEMP "windowsdesktop-runtime-8-x64.exe"
          Invoke-WebRequest `
            -Uri "https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe" `
            -OutFile $target

          if (!(Test-Path -LiteralPath $target)) {
            throw ".NET 8 Desktop Runtime offline installer download failed."
          }

          if ((Get-Item -LiteralPath $target).Length -lt 40000000) {
            throw "Downloaded .NET 8 Desktop Runtime installer is unexpectedly small/invalid."
          }

          "DOTNET_DESKTOP_RUNTIME_INSTALLER=$target" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with exit code $LASTEXITCODE"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe was not found."
          }

          & $iscc `
            "/DMyAppVersion=$env:BM_PUBLIC_VERSION" `
            "/DSourceDir=$env:PUBLISH_DIR" `
            "/DWebView2Bootstrapper=$env:WEBVIEW_BOOTSTRAPPER" `
            "/DDotNetDesktopRuntimeInstaller=$env:DOTNET_DESKTOP_RUNTIME_INSTALLER" `
            "/O$env:OUTPUT_DIR" `
            "$env:INSTALLER_SCRIPT"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compile failed with exit code $LASTEXITCODE"
          }

          $generated = Join-Path $env:OUTPUT_DIR "BankMovie-Setup-x64.exe"
          if (!(Test-Path -LiteralPath $generated)) {
            throw "BankMovie-Setup-x64.exe was not generated."
          }

          $finalSetup = Join-Path $env:OUTPUT_DIR "BankMovie-Windows-v1-Setup-x64.exe"
          if (Test-Path -LiteralPath $finalSetup) {
            Remove-Item -LiteralPath $finalSetup -Force
          }

          Move-Item -LiteralPath $generated -Destination $finalSetup

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $checksumFile = Join-Path $env:OUTPUT_DIR "SHA256SUMS.txt"

          if (Test-Path -LiteralPath $checksumFile) {
            Remove-Item -LiteralPath $checksumFile -Force
          }

          Get-ChildItem -LiteralPath $env:OUTPUT_DIR -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)" |
                Out-File -FilePath $checksumFile -Append -Encoding ascii
            }

      - name: Show final output
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath $env:OUTPUT_DIR -File |
            Select-Object Name, Length, LastWriteTime

      - name: Upload V1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-v1
          path: artifacts/output/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
