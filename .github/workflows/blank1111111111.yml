name: Build BankMovie Windows Current

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'BankMovie-Windows-CURRENT-source.zip'
      - '.github/workflows/build-windows.yml'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: bankmovie-windows-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      SOURCE_ARCHIVE: ${{ github.workspace }}\BankMovie-Windows-CURRENT-source.zip
      PUBLISH_DIR: ${{ github.workspace }}\artifacts\publish
      OUTPUT_DIR: ${{ github.workspace }}\artifacts\output

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract exact current source
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath $env:SOURCE_ARCHIVE)) {
            Write-Host 'Repository root files:'
            Get-ChildItem $env:GITHUB_WORKSPACE -File | ForEach-Object { Write-Host " - $($_.Name)" }
            throw 'BankMovie-Windows-CURRENT-source.zip is missing from repository root.'
          }

          $archiveHash = (Get-FileHash -LiteralPath $env:SOURCE_ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Selected exact source: $env:SOURCE_ARCHIVE"
          Write-Host "Source SHA256: $archiveHash"

          $extractDir = Join-Path $env:RUNNER_TEMP 'BankMovie-Windows-CURRENT'
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          Expand-Archive -LiteralPath $env:SOURCE_ARCHIVE -DestinationPath $extractDir -Force
          "SOURCE_ROOT=$extractDir" >> $env:GITHUB_ENV

      - name: Locate and defensively fix WPF source
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem $env:SOURCE_ROOT -Recurse -File -Filter 'BankMovie.Windows.csproj')
          if ($projects.Count -ne 1) { throw "Expected exactly one csproj, found $($projects.Count)." }
          $installers = @(Get-ChildItem $env:SOURCE_ROOT -Recurse -File -Filter 'BankMovie.iss')
          if ($installers.Count -ne 1) { throw "Expected exactly one BankMovie.iss, found $($installers.Count)." }

          $project = $projects[0].FullName
          $projectDir = Split-Path $project -Parent
          $appFile = Join-Path $projectDir 'App.xaml.cs'
          $playerFile = Join-Path $projectDir 'PlayerWindow.xaml.cs'

          if (!(Test-Path $appFile)) { throw 'App.xaml.cs was not found.' }
          if (!(Test-Path $playerFile)) { throw 'PlayerWindow.xaml.cs was not found.' }

          # Defensive patch: this also protects the build if an older source was accidentally renamed CURRENT.
          $app = Get-Content -LiteralPath $appFile -Raw
          $app = $app.Replace('public partial class App : Application', 'public partial class App : System.Windows.Application')
          Set-Content -LiteralPath $appFile -Value $app -Encoding utf8

          $player = Get-Content -LiteralPath $playerFile -Raw
          $player = $player.Replace('private void Window_KeyDown(object sender, KeyEventArgs e)', 'private void Window_KeyDown(object sender, System.Windows.Input.KeyEventArgs e)')
          $player = $player.Replace('private void InteractionLayer_MouseMove(object sender, MouseEventArgs e)', 'private void InteractionLayer_MouseMove(object sender, System.Windows.Input.MouseEventArgs e)')
          Set-Content -LiteralPath $playerFile -Value $player -Encoding utf8

          $csproj = Get-Content -LiteralPath $project -Raw
          $csproj = $csproj -replace '<UseWindowsForms>\s*true\s*</UseWindowsForms>', ''
          Set-Content -LiteralPath $project -Value $csproj -Encoding utf8

          $appCheck = Get-Content -LiteralPath $appFile -Raw
          $playerCheck = Get-Content -LiteralPath $playerFile -Raw
          if ($appCheck -notmatch 'App\s*:\s*System\.Windows\.Application') {
            throw 'WPF Application qualification is missing after patch.'
          }
          if ($playerCheck -notmatch 'System\.Windows\.Input\.KeyEventArgs') {
            throw 'WPF KeyEventArgs qualification is missing after patch.'
          }
          if ($playerCheck -notmatch 'System\.Windows\.Input\.MouseEventArgs') {
            throw 'WPF MouseEventArgs qualification is missing after patch.'
          }

          Write-Host 'Verified source lines:'
          Select-String -Path $appFile -Pattern 'partial class App' | ForEach-Object { Write-Host $_.Line.Trim() }
          Select-String -Path $playerFile -Pattern 'Window_KeyDown|InteractionLayer_MouseMove' | ForEach-Object { Write-Host $_.Line.Trim() }

          "PROJECT=$project" >> $env:GITHUB_ENV
          "INSTALLER_SCRIPT=$($installers[0].FullName)" >> $env:GITHUB_ENV
          Write-Host "Project found: $project"
          Write-Host "Installer found: $($installers[0].FullName)"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "1.3.${{ github.run_number }}"
          if ("${{ github.event_name }}" -eq 'release') {
            $tag = "${{ github.event.release.tag_name }}".TrimStart('v')
            if ($tag -match '^\d+\.\d+\.\d+(\.\d+)?$') { $version = $tag }
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Build version: $version"

      - name: Restore project
        shell: pwsh
        run: dotnet restore "$env:PROJECT" -r win-x64

      - name: Publish self-contained x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:PUBLISH_DIR | Out-Null
          dotnet publish "$env:PROJECT" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o "$env:PUBLISH_DIR" `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:FileVersion=${{ steps.version.outputs.value }} `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false

      - name: Validate application and player runtime
        shell: pwsh
        run: |
          $exe = Join-Path $env:PUBLISH_DIR 'BankMovie.exe'
          if (!(Test-Path $exe)) { throw 'BankMovie.exe was not created.' }
          $libvlc = Get-ChildItem $env:PUBLISH_DIR -Recurse -Filter 'libvlc.dll' | Select-Object -First 1
          if (!$libvlc) { throw 'libvlc.dll is missing from publish output.' }
          Write-Host "BankMovie executable: $exe"
          Write-Host "LibVLC runtime: $($libvlc.FullName)"

      - name: Create portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OUTPUT_DIR | Out-Null
          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath "$env:OUTPUT_DIR\BankMovie-Portable-x64.zip" -Force

      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $target
          if ((Get-Item $target).Length -lt 500000) { throw 'The downloaded WebView2 bootstrapper is invalid.' }
          "WEBVIEW_BOOTSTRAPPER=$target" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup EXE
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler was not found.' }
          & $iscc `
            "/DMyAppVersion=${{ steps.version.outputs.value }}" `
            "/DSourceDir=$env:PUBLISH_DIR" `
            "/DWebView2Bootstrapper=$env:WEBVIEW_BOOTSTRAPPER" `
            "/O$env:OUTPUT_DIR" `
            "$env:INSTALLER_SCRIPT"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $checksumFile = Join-Path $env:OUTPUT_DIR 'SHA256SUMS.txt'
          if (Test-Path $checksumFile) { Remove-Item $checksumFile -Force }
          Get-ChildItem $env:OUTPUT_DIR -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath $checksumFile -Append -Encoding ascii
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-${{ steps.version.outputs.value }}
          path: artifacts/output/*
          if-no-files-found: error
          retention-days: 30
