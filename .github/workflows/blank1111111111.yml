name: Build BankMovie Native Windows v2.0.1

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      SOURCE_ZIP: BankMovie-Windows-NATIVE-v2.0.1-MPV-PIPE-FIX-source.zip
      PROJECT_REL: src/BankMovie.Windows/BankMovie.Windows.csproj
      INSTALLER_REL: installer/BankMovie.iss

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract exact native source
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE $env:SOURCE_ZIP
          if (!(Test-Path -LiteralPath $zip)) {
            throw "Exact source file was not found: $env:SOURCE_ZIP"
          }

          $sourceRoot = Join-Path $env:RUNNER_TEMP 'BankMovie-Native-v2.0.1'
          if (Test-Path -LiteralPath $sourceRoot) {
            Remove-Item -LiteralPath $sourceRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $sourceRoot -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $sourceRoot -Force

          $project = Join-Path $sourceRoot $env:PROJECT_REL
          $installer = Join-Path $sourceRoot $env:INSTALLER_REL
          if (!(Test-Path -LiteralPath $project)) { throw "Project not found inside exact source: $project" }
          if (!(Test-Path -LiteralPath $installer)) { throw "Installer script not found: $installer" }

          "SOURCE_ROOT=$sourceRoot" >> $env:GITHUB_ENV
          "PROJECT=$project" >> $env:GITHUB_ENV
          "INSTALLER_SCRIPT=$installer" >> $env:GITHUB_ENV
          "PUBLISH_DIR=$(Join-Path $env:RUNNER_TEMP 'BankMovie-Native-Publish')" >> $env:GITHUB_ENV
          "OUTPUT_DIR=$(Join-Path $env:GITHUB_WORKSPACE 'artifacts')" >> $env:GITHUB_ENV

          Write-Host "Exact source: $zip"
          Write-Host "Project: $project"

      - name: Restore and publish native app
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:PUBLISH_DIR) {
            Remove-Item -LiteralPath $env:PUBLISH_DIR -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:PUBLISH_DIR -Force | Out-Null

          dotnet restore $env:PROJECT -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed.' }

          dotnet publish $env:PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -o $env:PUBLISH_DIR
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }

          $exe = Join-Path $env:PUBLISH_DIR 'BankMovie.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'BankMovie.exe was not produced.' }

      - name: Download compact mpv engine
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'BankMovie-Windows-Build' }
          $repositories = @(
            'shinchiro/mpv-winbuild-cmake',
            'zhongfly/mpv-winbuild'
          )
          $asset = $null

          foreach ($repository in $repositories) {
            try {
              $releases = @(Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repository/releases?per_page=6")
              foreach ($release in $releases) {
                $candidates = @($release.assets | Where-Object {
                  $_.name -match '(?i)(mpv).*(x86_64|win64).*(\.7z|\.zip)$' -and
                  $_.name -notmatch '(?i)(arm|aarch64|i686|x86-|sdk|dev|debug|v3)'
                })
                if ($candidates.Count -gt 0) {
                  $asset = $candidates | Sort-Object name -Descending | Select-Object -First 1
                  break
                }
              }
            } catch {
              Write-Warning "Could not read releases from $repository"
            }
            if ($null -ne $asset) { break }
          }

          if ($null -eq $asset) {
            throw 'A compatible x64 mpv release asset could not be found.'
          }

          $downloadPath = Join-Path $env:RUNNER_TEMP $asset.name
          $extractPath = Join-Path $env:RUNNER_TEMP 'mpv-extracted'
          if (Test-Path -LiteralPath $extractPath) { Remove-Item -LiteralPath $extractPath -Recurse -Force }
          New-Item -ItemType Directory -Path $extractPath -Force | Out-Null

          Write-Host "Downloading mpv asset: $($asset.name)"
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $downloadPath
          if ($downloadPath.EndsWith('.zip', [System.StringComparison]::OrdinalIgnoreCase)) {
            Expand-Archive -LiteralPath $downloadPath -DestinationPath $extractPath -Force
          } else {
            & 7z x $downloadPath "-o$extractPath" -y | Out-Host
            if ($LASTEXITCODE -ne 0) { throw '7-Zip extraction of mpv failed.' }
          }

          $mpvExe = Get-ChildItem -LiteralPath $extractPath -Recurse -File -Filter 'mpv.exe' |
            Where-Object { $_.FullName -notmatch '(?i)(sdk|dev|debug)' } |
            Select-Object -First 1
          if ($null -eq $mpvExe) { throw 'mpv.exe was not found after extraction.' }

          $mpvTarget = Join-Path $env:PUBLISH_DIR 'mpv'
          New-Item -ItemType Directory -Path $mpvTarget -Force | Out-Null
          Copy-Item -Path (Join-Path $mpvExe.Directory.FullName '*') -Destination $mpvTarget -Recurse -Force

          if (!(Test-Path -LiteralPath (Join-Path $mpvTarget 'mpv.exe'))) {
            throw 'mpv.exe was not copied to the application output.'
          }

      - name: Validate native-only output
        shell: pwsh
        run: |
          if (Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Recurse -File | Where-Object { $_.Name -match '(?i)(WebView2|libvlc)' }) {
            throw 'Forbidden WebView2 or LibVLC file was found in native output.'
          }
          if (!(Test-Path -LiteralPath (Join-Path $env:PUBLISH_DIR 'mpv\mpv.exe'))) {
            throw 'Embedded mpv engine is missing.'
          }
          $size = (Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ('Published size: {0:N1} MB' -f ($size / 1MB))

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer only
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:OUTPUT_DIR) {
            Remove-Item -LiteralPath $env:OUTPUT_DIR -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:OUTPUT_DIR -Force | Out-Null

          [xml]$projectXml = Get-Content -LiteralPath $env:PROJECT
          $version = [string]$projectXml.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '2.0.0' }

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) { throw 'ISCC.exe was not found.' }

          & $iscc "/DMyAppVersion=$version" "/DSourceDir=$env:PUBLISH_DIR" "/O$env:OUTPUT_DIR" $env:INSTALLER_SCRIPT | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed.' }

          $setup = Join-Path $env:OUTPUT_DIR 'BankMovie-Native-Setup-x64.exe'
          if (!(Test-Path -LiteralPath $setup)) { throw 'Native setup executable was not produced.' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $setup |
            ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -LiteralPath (Join-Path $env:OUTPUT_DIR 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload native setup
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Native-Windows-v2.0.1
          path: |
            artifacts/BankMovie-Native-Setup-x64.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
