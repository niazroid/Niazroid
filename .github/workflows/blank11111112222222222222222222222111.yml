name: Build BankMovie Windows v1.1.15

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

env:
  SOURCE_ZIP: BankMovie-v1.1.15.zip
  EXTRACT_DIR: _bankmovie_source
  DESKTOP_DIR: _bankmovie_source/bankmovie_desktop_v2_pack/desktop
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        shell: pwsh
        run: |
          $zip = Join-Path "${{ github.workspace }}" "${{ env.SOURCE_ZIP }}"
          if (-not (Test-Path $zip)) { throw "Required source archive not found: $zip" }

          $dest = Join-Path "${{ github.workspace }}" "${{ env.EXTRACT_DIR }}"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force

      - name: Validate package and NSIS hook
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');if(p.version!=='1.1.15')throw new Error('Expected 1.1.15');p.build=p.build||{};p.build.forceCodeSigning=false;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.build.forceCodeSigning -ne $false) { throw "forceCodeSigning must be false" }

          $nsh = Get-Content "build-assets/installer-black.nsh" -Raw

          if ($nsh -notmatch "!macro customInit[\s\S]*Call BM_GUIINIT") {
            throw "BM_GUIINIT is not connected through customInit"
          }

          if ($nsh -notmatch "Function BM_GUIINIT") {
            throw "BM_GUIINIT is missing"
          }

          if ($nsh -notmatch "Function BM_DarkControls") {
            throw "BM_DarkControls is missing"
          }

      - name: Generate runtime config
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          @"
          module.exports = Object.freeze({
            domain: 'https://bankmovie.top'
          });
          "@ | Set-Content -Path "electron/runtime.generated.js" -Encoding UTF8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          node --check src/app.js
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/runtime.generated.js

      - name: Build Windows installer
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never

      - name: Create SHA-256 checksums
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          $lines = @()
          Get-ChildItem "dist" -File | Where-Object {
            $_.Extension -in ".exe", ".blockmap", ".yml"
          } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($_.Name)"
          }
          $lines | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-v1.1.15-${{ github.sha }}
          path: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
            ${{ env.DESKTOP_DIR }}/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
            ${{ env.DESKTOP_DIR }}/dist/SHA256SUMS.txt
