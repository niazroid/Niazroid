name: GohstVpn Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: gohstvpn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_ABI: android-arm64
    steps:
      - name: Use HTTPS for public GitHub dependencies
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout GohstVpn
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Ensure Mihomo core sources exist
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f core/Clash.Meta/go.mod ]; then
            echo 'Mihomo submodule is absent (usually because a GitHub source ZIP was uploaded).'
            rm -rf core/Clash.Meta
            git clone --depth 1 --branch FlClash https://github.com/chen08209/Clash.Meta.git core/Clash.Meta
          fi
          test -f core/Clash.Meta/go.mod

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go core toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: '3.47.4'
          cache: true

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK using the project's official packaging script
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env dev --arch arm64 --targets apk -v

      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: GohstVpn-test-arm64
          path: dist/**/*.apk
          if-no-files-found: error
          retention-days: 14
