name: GohstVpn Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: gohstvpn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Use HTTPS for public GitHub dependencies
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout GohstVpn
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # A GitHub upload may contain a GohstVpn/ parent directory.
      # Find the REAL Flutter project root instead of assuming repository root.
      - name: Detect Flutter project folder
        shell: bash
        run: |
          set -euo pipefail
          root=""
          while IFS= read -r -d '' pubspec; do
            candidate="$(dirname "$pubspec")"
            if [[ -f "$candidate/setup.dart" && -d "$candidate/android" ]]; then
              if [[ -n "$root" ]]; then
                echo "::error::Multiple Flutter project roots were found. Keep one GohstVpn source tree."
                exit 1
              fi
              root="$candidate"
            fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name pubspec.yaml -print0)
          if [[ -z "$root" ]]; then
            echo "::error::Could not find pubspec.yaml + setup.dart + android/. Upload project source, not a wrapper folder without files."
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f | head -60 || true
            exit 1
          fi
          echo "PROJECT_DIR=$root" >> "$GITHUB_ENV"
          echo "Flutter project root: $root"
          ls -l "$root/pubspec.yaml" "$root/setup.dart"

      - name: Ensure Mihomo core sources exist
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ ! -f core/Clash.Meta/go.mod ]]; then
            echo 'Mihomo Git submodule not present; downloading the public FlClash branch.'
            rm -rf core/Clash.Meta
            git clone --depth 1 --branch FlClash https://github.com/chen08209/Clash.Meta.git core/Clash.Meta
          fi
          test -f core/Clash.Meta/go.mod

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go core toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: '**/core/go.sum'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: '3.47.4'
          cache: true

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build GohstVpn APK
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          dart setup.dart android --env dev --arch arm64 --targets apk -v

      - name: Collect generated APKs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gohstvpn-apks"
          mkdir -p "$out"
          count=0
          for directory in "$PROJECT_DIR/dist" "$PROJECT_DIR/build/app/outputs/flutter-apk"; do
            if [[ -d "$directory" ]]; then
              while IFS= read -r -d '' apk; do
                count=$((count + 1))
                cp "$apk" "$out/${count}-$(basename "$apk")"
              done < <(find "$directory" -type f -name '*.apk' -print0)
            fi
          done
          if [[ "$count" == 0 ]]; then
            echo "::error::Build finished but no APK was found under dist/ or build/app/outputs/flutter-apk/."
            exit 1
          fi
          echo "Found $count APK file(s)"
          ls -lh "$out"

      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: GohstVpn-test-arm64
          path: ${{ runner.temp }}/gohstvpn-apks/*.apk
          if-no-files-found: error
          retention-days: 14
