# GohstVpn source is stored as one ZIP in the repository ROOT.
# Install this file at .github/workflows/gohstvpn-android.yml
# Use this standalone full-source build rather than the older overlay workflows.
name: GHOST VPN V22 - ARM64 VersionCode Fix

on:
  workflow_dispatch:

permissions:
  contents: write  # private repository: write non-secret signing fingerprint marker
  actions: read    # restore private signing artifact from previous builds

concurrency:
  group: ghost-vpn-signing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: Build ARM64 APK with automatic signing
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: V22 preflight - detect actual workflow filename
        shell: bash
        run: |
          set -euo pipefail
          echo 'GHOST VPN V22 PRE-FLIGHT OK - ARM64 VERSIONCODE FIX'
          echo "Commit: $GITHUB_SHA"
          echo "Workflow: $GITHUB_WORKFLOW_REF"
          # Resolve the ACTUAL workflow path; the file can be named anything
          # under .github/workflows/, e.g. blank111...yml.
          WORKFLOW_REF_PATH="${GITHUB_WORKFLOW_REF%@*}"
          WORKFLOW_RELATIVE="${WORKFLOW_REF_PATH#"$GITHUB_REPOSITORY"/}"
          if [[ "$WORKFLOW_RELATIVE" == "$WORKFLOW_REF_PATH" ||
                "$WORKFLOW_RELATIVE" != .github/workflows/* ||
                "$WORKFLOW_RELATIVE" == *'..'* ]]; then
            echo "::error::Unexpected GITHUB_WORKFLOW_REF: $GITHUB_WORKFLOW_REF"
            exit 1
          fi
          WORKFLOW="$GITHUB_WORKSPACE/$WORKFLOW_RELATIVE"
          echo "Resolved workflow file: $WORKFLOW_RELATIVE"
          test -f "$WORKFLOW" || { echo "::error::Workflow file missing at checked out commit: $WORKFLOW_RELATIVE"; exit 1; }
          grep -Fxq 'name: GHOST VPN V22 - ARM64 VersionCode Fix' "$WORKFLOW" || {
            echo "::error::Wrong workflow version at $WORKFLOW_RELATIVE. Commit V22 and start a NEW run (not Re-run jobs)."
            exit 1
          }
          if grep -n -- '--no-fatal-'"infos" "$WORKFLOW"; then
            echo '::error::The old invalid Dart CLI option remains in the workflow.'
            exit 1
          fi
          grep -Fq 'dart analyze --no-fatal-warnings' "$WORKFLOW" || {
            echo '::error::V22 analyzer step is missing.'
            exit 1
          }
          echo 'VERIFIED: invalid analyzer option absent and V22 command present.'

      - name: Extract complete GHOST VPN 1.0.0 source (no layered patches)
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/GHOST-VPN-FlClash-v1.0.0-full-source.zip"
          PROJECT="$RUNNER_TEMP/gohstvpn-locked-v4/GohstVpn"
          if [[ ! -s "$ZIP" ]]; then
            echo '::error::Upload GHOST-VPN-FlClash-v1.0.0-full-source.zip to repository ROOT.'
            exit 1
          fi
          unzip -tq "$ZIP" >/dev/null
          mkdir -p "$RUNNER_TEMP/gohstvpn-locked-v4"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          for path in pubspec.yaml setup.dart android/settings.gradle.kts core/go.mod lib/views/profiles/add.dart lib/l10n/intl/messages_fa.dart; do
            test -s "$PROJECT/$path" || { echo "::error::Missing GohstVpn/$path"; exit 1; }
          done
          grep -qx 'version: 1.0.0+9' <(grep '^version:' "$PROJECT/pubspec.yaml") || {
            echo '::error::The ZIP does not contain GHOST VPN version 1.0.0+9.'
            exit 1
          }
          if grep -q '_addManual' "$PROJECT/lib/views/profiles/add.dart"; then
            echo '::error::Manual config entry remains in the source.'
            exit 1
          fi
          echo "GOHSTVPN_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo 'GHOST VPN v1.0.0 complete source loaded; previous update overlays are not required.'

      - name: Restore public Mihomo core missing from ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          if [[ ! -f core/Clash.Meta/go.mod ]]; then
            rm -rf core/Clash.Meta
            git clone --depth 1 --branch FlClash https://github.com/chen08209/Clash.Meta.git core/Clash.Meta
          fi
          test -f core/Clash.Meta/go.mod || {
            echo '::error::Mihomo core source could not be fetched'
            exit 1
          }

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false

      - name: Fix Mihomo URLTest callback compatibility (3 to 4 args)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          python3 - <<'PYFIX'
          from pathlib import Path
          path = Path('core/hub.go')
          contents = path.read_text(encoding='utf-8')
          legacy = 'adapter.UrlTestHook = func(url string, name string, delay uint16) {'
          replacement = ('adapter.UrlTestHook = func(url string, name string, delay uint16, canceled bool) {\n'
                         '\t\tif canceled {\n\t\t\treturn\n\t\t}')
          newer = 'adapter.UrlTestHook = func(url string, name string, delay uint16, canceled bool) {'
          if contents.count(legacy) == 1:
              contents = contents.replace(legacy, replacement, 1)
              path.write_text(contents, encoding='utf-8')
              print('SUCCESS: patched URLTestHook for new Mihomo callback signature')
          elif newer in contents:
              print('SKIP: URLTestHook already has 4 parameters')
          else:
              raise SystemExit('ERROR: unexpected URLTestHook signature; not patching blindly')
          PYFIX
          gofmt -w core/hub.go
          grep -n -A 7 'adapter.UrlTestHook = func' core/hub.go

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Flutter dependencies in extracted project
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          echo "pubspec located at: $(pwd)/pubspec.yaml"
          flutter pub get

      - name: Format Dart changes and check translated source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          dart format lib/views/profiles/add.dart lib/providers/actions/profiles.dart lib/l10n/intl/messages_fa.dart lib/widgets/motion_grid.dart
          test "$(grep -c 'version: 1.0.0+9' pubspec.yaml)" -eq 1
          grep -Fq 'english.messages.messages.cast<String, Function>()' lib/l10n/intl/messages_fa.dart
          grep -Fq 'textDirection ?? Directionality.of(context)' lib/widgets/motion_grid.dart
          ! grep -Fq '_addManual' lib/views/profiles/add.dart

      - name: Test Dart logic serially without compiling VPN native assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          # These unit tests do not use Go/Rust FFI. Native hooks have shared
          # output directories and must not compile binaries in parallel tests.
          # The release APK build below MUST restore build_assets: true.
          BACKUP="$RUNNER_TEMP/ghost-vpn-native-build-pubspec.yaml"
          cp pubspec.yaml "$BACKUP"
          restore_release_pubspec() { cp "$BACKUP" pubspec.yaml; }
          trap restore_release_pubspec EXIT
          python3 - <<'PY_TEST_HOOKS'
          from pathlib import Path
          file = Path('pubspec.yaml')
          contents = file.read_text(encoding='utf-8')
          original = ('hooks:\n  user_defines:\n    setup:\n'
                      '      build_assets: true\n    rust_api:\n'
                      '      build_assets: true\n')
          temporary = original.replace('build_assets: true', 'build_assets: false')
          if contents.count(original) != 1:
              raise SystemExit('ERROR: unexpected native hook config; not altering it.')
          file.write_text(contents.replace(original, temporary, 1), encoding='utf-8')
          print('TEST MODE: Go/Mihomo and Rust native compilation disabled for pure Dart tests.')
          PY_TEST_HOOKS
          # --no-pub avoids re-resolving dependencies while temporarily in test mode.
          # --concurrency=1 prevents native hook cache races between test suites.
          flutter test --no-pub --concurrency=1 --reporter expanded \
            test/common/proxy_link_importer_test.dart \
            test/common/gohst_display_name_test.dart \
            test/ghost_active_server_test.dart \
            test/common/ghost_latency_rank_test.dart
          restore_release_pubspec
          trap - EXIT
          python3 - <<'PY_RELEASE_HOOKS'
          from pathlib import Path
          contents = Path('pubspec.yaml').read_text(encoding='utf-8')
          expected = ('hooks:\n  user_defines:\n    setup:\n'
                      '      build_assets: true\n    rust_api:\n'
                      '      build_assets: true\n')
          if contents.count(expected) != 1:
              raise SystemExit('ERROR: release-native build hooks were not restored')
          print('RELEASE MODE: Go/Mihomo and Rust native compilation re-enabled for APK.')
          PY_RELEASE_HOOKS

      - name: Analyze modified Dart modules
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          # dart analyze accepts zero or ONE directory argument, not a list of files.
          # Analyze the project to catch actual errors; warnings are nonfatal.
          dart analyze --no-fatal-warnings

      # 1) Existing secrets: true permanent signing (works for both public/private repositories).
      # 2) No secrets + PRIVATE repository: generate once, reuse via private artifacts.
      #    Private artifacts expire, so download and securely back up the generated key.
      # 3) No secrets + PUBLIC repository: test-only debug-signed .dev APK.
      #    NEVER publish release keystore/password in public artifacts or source control.
      - name: Auto-sign on GitHub (safe signing mode)
        id: signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          STORE_B64: ${{ secrets.GHOST_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.GHOST_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GHOST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GHOST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYDIR="$RUNNER_TEMP/ghost-vpn-signing"
          mkdir -p "$KEYDIR"
          chmod 700 "$KEYDIR"
          KEYFILE="$KEYDIR/keystore.jks"
          MARKER_PATH='.github/GHOST-VPN-SIGNING-INITIALIZED.txt'

          if [[ -n "$STORE_B64" ]]; then
            for name in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [[ -z "${!name}" ]]; then
                echo "::error::Signing secret $name is missing. Add all four signing secrets."
                exit 1
              fi
            done
            printf '%s' "$STORE_B64" | base64 -d > "$KEYFILE"
            echo 'mode=secrets' >> "$GITHUB_OUTPUT"
            echo 'new=false' >> "$GITHUB_OUTPUT"
            echo 'Signing from existing persistent GitHub Secrets.'
          elif [[ "$IS_PRIVATE" == 'true' ]]; then
            ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=GHOST-VPN-PRIVATE-SIGNING&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
            if [[ -n "$ARTIFACT_ID" ]]; then
              curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
                -o "$RUNNER_TEMP/ghost-signing-backup.zip"
              unzip -q "$RUNNER_TEMP/ghost-signing-backup.zip" -d "$KEYDIR"
              test -s "$KEYFILE" && test -s "$KEYDIR/password.txt"
              echo 'new=false' >> "$GITHUB_OUTPUT"
              echo 'Restored existing signing identity from PRIVATE GitHub artifact.'
            else
              if gh api "repos/$GITHUB_REPOSITORY/contents/$MARKER_PATH?ref=$GITHUB_REF_NAME" >/dev/null 2>&1; then
                echo '::error::Previous signing artifact expired or was deleted. Refusing to rotate signing key and break updates. Restore your keystore backup as signing secrets.'
                exit 1
              fi
              PASS=$(openssl rand -hex 32)
              keytool -genkeypair -noprompt -keystore "$KEYFILE" -storetype JKS \
                -alias ghost -keyalg RSA -keysize 3072 -validity 10000 \
                -storepass "$PASS" -keypass "$PASS" -dname 'CN=GHOST VPN, O=GHOST VPN, C=US' >/dev/null 2>&1
              printf '%s' "$PASS" > "$KEYDIR/password.txt"
              echo 'new=true' >> "$GITHUB_OUTPUT"
              echo 'Generated GHOST VPN signing identity for the first PRIVATE-repo build.'
            fi
            PASS=$(cat "$KEYDIR/password.txt")
            KEY_ALIAS=ghost
            STORE_PASSWORD="$PASS"
            KEY_PASSWORD="$PASS"
            echo 'mode=private-artifact' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=public-test' >> "$GITHUB_OUTPUT"
            echo 'new=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Repository is PUBLIC and has no signing secrets. Building a TEST APK with Android debug signing (.dev). This DOES NOT provide a persistent update-compatible release signature.'
            exit 0
          fi

          chmod 600 "$KEYFILE"
          cp "$KEYFILE" "$GOHSTVPN_PROJECT/android/app/keystore.jks"
          chmod 600 "$GOHSTVPN_PROJECT/android/app/keystore.jks"
          for value in "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            echo "::add-mask::$value"
          done
          {
            echo "GHOST_STORE_PASSWORD=$STORE_PASSWORD"
            echo "GHOST_KEY_ALIAS=$KEY_ALIAS"
            echo "GHOST_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Renew private signing-key backup (90-day retention)
        if: steps.signing.outputs.mode == 'private-artifact'
        uses: actions/upload-artifact@v4
        with:
          name: GHOST-VPN-PRIVATE-SIGNING
          path: ${{ runner.temp }}/ghost-vpn-signing/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 90

      - name: Mark signing identity as initialized (no secrets in git)
        if: steps.signing.outputs.mode == 'private-artifact' && steps.signing.outputs.new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONTENT=$(printf 'GHOST VPN signing initialized. Do not generate another key; restore the original keystore backup if missing.\n' | base64 -w0)
          jq -n --arg content "$CONTENT" --arg branch "$GITHUB_REF_NAME" \
            '{message:"Initialize GHOST VPN signing marker (no private key)",content:$content,branch:$branch}' \
            | gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.github/GHOST-VPN-SIGNING-INITIALIZED.txt" --input - >/dev/null
          echo 'Private key backed up in Actions; public repository files contain only a harmless marker.'

      - name: Ensure native VPN engine is enabled for release
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          python3 - <<'PY_NATIVE_RELEASE'
          from pathlib import Path
          contents = Path('pubspec.yaml').read_text(encoding='utf-8')
          expected = ('hooks:\n  user_defines:\n    setup:\n'
                      '      build_assets: true\n    rust_api:\n'
                      '      build_assets: true\n')
          if contents.count(expected) != 1:
              raise SystemExit('ERROR: release APK must compile both Go and Rust native assets')
          print('VERIFIED: both native engine build hooks are enabled for Android APK.')
          PY_NATIVE_RELEASE

      - name: Build Android ARM64 APK
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          GHOST_TELEGRAM_BOT_URL: ${{ vars.GHOST_TELEGRAM_BOT_URL }}
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          dart setup.dart android --env stable --arch arm64 --targets apk -v

      - name: Collect APK output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gohstvpn-apk-v22"
          count=0
          for folder in "$GOHSTVPN_PROJECT/dist" "$GOHSTVPN_PROJECT/build/app/outputs/flutter-apk"; do
            if [[ -d "$folder" ]]; then
              while IFS= read -r -d '' apk; do
                count=$((count + 1))
                cp "$apk" "$RUNNER_TEMP/gohstvpn-apk-v22/${count}-$(basename "$apk")"
              done < <(find "$folder" -type f -name '*.apk' -print0)
            fi
          done
          if (( count == 0 )); then
            echo '::error::Build ended but no APK exists in dist/ or Flutter APK output folder'
            exit 1
          fi
          ls -lh "$RUNNER_TEMP/gohstvpn-apk-v22/"

      - name: Verify APK version, package identity and Android signature
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK" && test -d "$SDK/build-tools" || {
            echo '::error::Android build tools not found for verification.'; exit 1;
          }
          APKSIGNER=$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$SDK/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$APKSIGNER" && test -x "$AAPT" || {
            echo '::error::apksigner/aapt are missing.'; exit 1;
          }
          for apk in "$RUNNER_TEMP"/gohstvpn-apk-v22/*.apk; do
            echo "Checking $(basename "$apk")"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            PACKAGE_INFO=$("$AAPT" dump badging "$apk" | grep '^package: ')
            echo "$PACKAGE_INFO"
            grep -q "versionName='1.0.0'" <<< "$PACKAGE_INFO" || {
              echo '::error::Unexpected APK version; expected 1.0.0.'; exit 1;
            }
            # Flutter's --split-per-abi adds 2000 to the base pubspec
            # versionCode for the arm64-v8a APK: 1.0.0+9 -> 2009.
            # Do not lower the Android code to 9; that would break updates.
            grep -q "versionCode='2009'" <<< "$PACKAGE_INFO" || {
              echo '::error::Unexpected ARM64 APK build number; expected 2009 (2000+9).'; exit 1;
            }
            case '${{ steps.signing.outputs.mode }}' in
              secrets|private-artifact)
                grep -q "name='com.gohstvpn.app'" <<< "$PACKAGE_INFO" || {
                  echo '::error::Release package ID is wrong.'; exit 1;
                }
                # Fail if a supposed production release fell back to debug signing.
                if "$APKSIGNER" verify --print-certs "$apk" | grep -Fq 'CN=Android Debug'; then
                  echo '::error::Release APK is signed with Android Debug key!'; exit 1
                fi
                echo 'Verified: release package with non-debug signing identity.' ;;
              public-test)
                grep -q "name='com.gohstvpn.app.dev'" <<< "$PACKAGE_INFO" || {
                  echo '::error::Debug-test package ID is wrong.'; exit 1;
                }
                echo '::warning::APK is DEBUG-signed; valid for testing, not a permanent release signing identity.' ;;
              *) echo '::error::Unknown signing mode.'; exit 1 ;;
            esac
          done
          echo 'APK integrity, ARM64 versionCode=2009, versionName=1.0.0 and signature verification passed.'

      - name: Upload GohstVpn APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GHOST-VPN-arm64-V22-${{ steps.signing.outputs.mode }}
          path: ${{ runner.temp }}/gohstvpn-apk-v22/*.apk
          if-no-files-found: error
          retention-days: 14


      - name: Explain signing result
        if: always()
        shell: bash
        run: |
          echo '### GHOST VPN signing status' >> "$GITHUB_STEP_SUMMARY"
          case '${{ steps.signing.outputs.mode }}' in
            secrets)
              echo '✅ Signed with your persistent GitHub Secrets keystore.' >> "$GITHUB_STEP_SUMMARY" ;;
            private-artifact)
              echo '✅ Signed with an auto-created/reused keystore stored in PRIVATE Actions artifacts. Download the artifact and keep an OFFLINE BACKUP; GitHub artifact retention is limited.' >> "$GITHUB_STEP_SUMMARY" ;;
            public-test)
              echo '⚠️ Public repo: test-only debug signature; NOT suitable for automatic future app updates. Permanent release signing requires one-time private GitHub Secrets setup.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo '❌ Signing did not complete.' >> "$GITHUB_STEP_SUMMARY" ;;
          esac
