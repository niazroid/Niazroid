# GohstVpn source is stored as one ZIP in the repository ROOT.
# Install this file at .github/workflows/gohstvpn-android.yml
# Do not run the older V3 or other FlClash/Karing workflows.
name: GohstVpn ZIP LOCKED V5 - Ping Hook Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Extract ZIP, fix Mihomo ping hook, build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: PROOF V5 - extract EXACT GohstVpn ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo '===== GOHSTVPN ZIP LOCKED V5 ====='
          ZIP="$GITHUB_WORKSPACE/GohstVpn-FlClash-v0.1.0-source.zip"
          PROJECT="$RUNNER_TEMP/gohstvpn-locked-v4/GohstVpn"
          echo "Locked ZIP: $ZIP"
          if [[ ! -f "$ZIP" ]]; then
            echo "::error::Missing EXACT file: GohstVpn-FlClash-v0.1.0-source.zip in repository root"
            exit 1
          fi
          unzip -tq "$ZIP" >/dev/null || {
            echo '::error::ZIP is damaged or stored as a Git LFS pointer.'
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/gohstvpn-locked-v4"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          for required in pubspec.yaml setup.dart android/settings.gradle.kts core/go.mod; do
            if [[ ! -f "$PROJECT/$required" ]]; then
              echo "::error::ZIP does not contain GohstVpn/$required"
              exit 1
            fi
          done
          echo "GOHSTVPN_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SUCCESS: Flutter project extracted into $PROJECT"

      - name: Restore public Mihomo core missing from ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          if [[ ! -f core/Clash.Meta/go.mod ]]; then
            rm -rf core/Clash.Meta
            git clone --depth 1 --branch FlClash https://github.com/chen08209/Clash.Meta.git core/Clash.Meta
          fi
          test -f core/Clash.Meta/go.mod || {
            echo '::error::Mihomo core source could not be fetched'
            exit 1
          }

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false

      - name: Fix Mihomo URLTest callback compatibility (3 to 4 args)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          python3 - <<'PYFIX'
          from pathlib import Path
          path = Path('core/hub.go')
          contents = path.read_text(encoding='utf-8')
          legacy = 'adapter.UrlTestHook = func(url string, name string, delay uint16) {'
          replacement = ('adapter.UrlTestHook = func(url string, name string, delay uint16, canceled bool) {\n'
                         '\t\tif canceled {\n\t\t\treturn\n\t\t}')
          newer = 'adapter.UrlTestHook = func(url string, name string, delay uint16, canceled bool) {'
          if contents.count(legacy) == 1:
              contents = contents.replace(legacy, replacement, 1)
              path.write_text(contents, encoding='utf-8')
              print('SUCCESS: patched URLTestHook for new Mihomo callback signature')
          elif newer in contents:
              print('SKIP: URLTestHook already has 4 parameters')
          else:
              raise SystemExit('ERROR: unexpected URLTestHook signature; not patching blindly')
          PYFIX
          gofmt -w core/hub.go
          grep -n -A 7 'adapter.UrlTestHook = func' core/hub.go

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Flutter dependencies in extracted project
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          echo "pubspec located at: $(pwd)/pubspec.yaml"
          flutter pub get

      - name: Build Android ARM64 APK
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          dart setup.dart android --env dev --arch arm64 --targets apk -v

      - name: Collect APK output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gohstvpn-apk-v5"
          count=0
          for folder in "$GOHSTVPN_PROJECT/dist" "$GOHSTVPN_PROJECT/build/app/outputs/flutter-apk"; do
            if [[ -d "$folder" ]]; then
              while IFS= read -r -d '' apk; do
                count=$((count + 1))
                cp "$apk" "$RUNNER_TEMP/gohstvpn-apk-v5/${count}-$(basename "$apk")"
              done < <(find "$folder" -type f -name '*.apk' -print0)
            fi
          done
          if (( count == 0 )); then
            echo '::error::Build ended but no APK exists in dist/ or Flutter APK output folder'
            exit 1
          fi
          ls -lh "$RUNNER_TEMP/gohstvpn-apk-v5/"

      - name: Upload GohstVpn APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GohstVpn-arm64-V5
          path: ${{ runner.temp }}/gohstvpn-apk-v5/*.apk
          if-no-files-found: error
          retention-days: 14
