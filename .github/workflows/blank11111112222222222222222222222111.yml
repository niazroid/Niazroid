# GohstVpn source is stored as one ZIP in the repository ROOT.
# Install this file at .github/workflows/gohstvpn-android.yml
# Do not run the older V3 or other FlClash/Karing workflows.
name: GohstVpn V10 - Dashboard Analyze Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Apply v0.2-v0.5 overlays, build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: PROOF V6 - extract EXACT GohstVpn v0.1 ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo '===== GOHSTVPN V10 DART HOTFIX ====='
          ZIP="$GITHUB_WORKSPACE/GohstVpn-FlClash-v0.1.0-source.zip"
          PROJECT="$RUNNER_TEMP/gohstvpn-locked-v4/GohstVpn"
          echo "Locked ZIP: $ZIP"
          if [[ ! -f "$ZIP" ]]; then
            echo "::error::Missing EXACT file: GohstVpn-FlClash-v0.1.0-source.zip in repository root"
            exit 1
          fi
          unzip -tq "$ZIP" >/dev/null || {
            echo '::error::ZIP is damaged or stored as a Git LFS pointer.'
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/gohstvpn-locked-v4"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          for required in pubspec.yaml setup.dart android/settings.gradle.kts core/go.mod; do
            if [[ ! -f "$PROJECT/$required" ]]; then
              echo "::error::ZIP does not contain GohstVpn/$required"
              exit 1
            fi
          done
          echo "GOHSTVPN_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SUCCESS: Flutter project extracted into $PROJECT"

      - name: Apply EXACT GohstVpn v0.2 update overlay
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/GohstVpn-v0.2.0-update.zip"
          if [[ ! -f "$PATCH" ]]; then
            echo '::error::Upload the exact GohstVpn-v0.2.0-update.zip file into your repository ROOT'
            exit 1
          fi
          unzip -tq "$PATCH" >/dev/null
          unzip -oq "$PATCH" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          test -f "$GOHSTVPN_PROJECT/lib/common/proxy_link_importer.dart"
          grep -q 'version: 0.2.0+2' "$GOHSTVPN_PROJECT/pubspec.yaml"
          echo 'SUCCESS: GohstVpn v0.2 sources are applied to the ORIGINAL v0.1 ZIP'

      - name: Apply EXACT GohstVpn v0.3 style and subscription update
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/GohstVpn-v0.3.0-update.zip"
          if [[ ! -f "$PATCH" ]]; then
            echo '::error::Upload EXACT GohstVpn-v0.3.0-update.zip to repository root'
            exit 1
          fi
          unzip -tq "$PATCH" >/dev/null
          unzip -oq "$PATCH" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          test -f "$GOHSTVPN_PROJECT/lib/views/proxies/gohst_mobile_list.dart"
          test -f "$GOHSTVPN_PROJECT/lib/common/gohst_subscription_notice.dart"
          grep -q 'version: 0.3.0+3' "$GOHSTVPN_PROJECT/pubspec.yaml"
          echo 'SUCCESS: GohstVpn v0.3 overlay verified'

      - name: Apply EXACT GohstVpn v0.4 smart UI update
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/GohstVpn-v0.4.0-update.zip"
          if [[ ! -f "$PATCH" ]]; then
            echo '::error::Upload EXACT GohstVpn-v0.4.0-update.zip to repository ROOT'
            exit 1
          fi
          unzip -tq "$PATCH" >/dev/null
          unzip -oq "$PATCH" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          grep -q 'version: 0.4.0+4' "$GOHSTVPN_PROJECT/pubspec.yaml"
          grep -q 'class GohstConnectionToggle' "$GOHSTVPN_PROJECT/lib/views/dashboard/gohst_dashboard.dart"
          echo 'SUCCESS: v0.4 smart UI files installed'

      - name: Apply EXACT GohstVpn v0.5 dashboard and auto-ping update
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/GohstVpn-v0.5.0-update.zip"
          if [[ ! -f "$PATCH" ]]; then
            echo '::error::Upload EXACT GohstVpn-v0.5.0-update.zip to the repository ROOT'
            exit 1
          fi
          unzip -tq "$PATCH" >/dev/null
          unzip -oq "$PATCH" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          grep -q 'version: 0.5.0+5' "$GOHSTVPN_PROJECT/pubspec.yaml"
          grep -q 'class _GohstDashboardState' "$GOHSTVPN_PROJECT/lib/views/dashboard/gohst_dashboard.dart"
          test -s "$GOHSTVPN_PROJECT/assets/images/gohst_refresh.svg"
          echo 'SUCCESS: v0.5 update overlay installed'

      - name: Fix dashboard Dart analysis warnings (V10)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          python3 - <<'PY_DART'
          from pathlib import Path
          import re
          file = Path('lib/views/dashboard/gohst_dashboard.dart')
          source = file.read_text(encoding='utf-8')
          unused = "import 'package:fl_clash/icons/icons.dart';\n"
          if source.count(unused) != 1:
              raise SystemExit('ERROR: dashboard source differs from v0.5; unused import mismatch')
          source = source.replace(unused, '')
          pattern = re.compile(r'^(?P<indent>[ \t]*)if \((?P<cond>.+?)\) (?P<stmt>.+;)$')
          updated = []
          fixed = 0
          for line in source.splitlines(keepends=True):
              match = pattern.fullmatch(line.rstrip('\n'))
              if match and '...[' not in match.group('stmt'):
                  indent, cond, stmt = match.group('indent', 'cond', 'stmt')
                  updated.append(f'{indent}if ({cond}) {{\n{indent}  {stmt}\n{indent}}}\n')
                  fixed += 1
              else:
                  updated.append(line)
          if fixed != 17:
              raise SystemExit(f'ERROR: unexpected dashboard version; expected 17 inline if statements but got {fixed}')
          file.write_text(''.join(updated), encoding='utf-8')
          print(f'SUCCESS: removed unused icon import; fixed {fixed} curly-brace issues')
          PY_DART

      - name: Restore public Mihomo core missing from ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          if [[ ! -f core/Clash.Meta/go.mod ]]; then
            rm -rf core/Clash.Meta
            git clone --depth 1 --branch FlClash https://github.com/chen08209/Clash.Meta.git core/Clash.Meta
          fi
          test -f core/Clash.Meta/go.mod || {
            echo '::error::Mihomo core source could not be fetched'
            exit 1
          }

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false

      - name: Fix Mihomo URLTest callback compatibility (3 to 4 args)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          python3 - <<'PYFIX'
          from pathlib import Path
          path = Path('core/hub.go')
          contents = path.read_text(encoding='utf-8')
          legacy = 'adapter.UrlTestHook = func(url string, name string, delay uint16) {'
          replacement = ('adapter.UrlTestHook = func(url string, name string, delay uint16, canceled bool) {\n'
                         '\t\tif canceled {\n\t\t\treturn\n\t\t}')
          newer = 'adapter.UrlTestHook = func(url string, name string, delay uint16, canceled bool) {'
          if contents.count(legacy) == 1:
              contents = contents.replace(legacy, replacement, 1)
              path.write_text(contents, encoding='utf-8')
              print('SUCCESS: patched URLTestHook for new Mihomo callback signature')
          elif newer in contents:
              print('SKIP: URLTestHook already has 4 parameters')
          else:
              raise SystemExit('ERROR: unexpected URLTestHook signature; not patching blindly')
          PYFIX
          gofmt -w core/hub.go
          grep -n -A 7 'adapter.UrlTestHook = func' core/hub.go

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Flutter dependencies in extracted project
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          echo "pubspec located at: $(pwd)/pubspec.yaml"
          flutter pub get

      - name: Format and syntax-check modified Dart files
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          dart format lib/bootstrap.dart lib/application.dart lib/providers/app.dart lib/providers/actions/profiles.dart lib/views/dashboard/gohst_dashboard.dart lib/providers/state/theme.dart
          dart format lib/common/proxy_link_importer.dart lib/models/profile.dart lib/providers/action.dart lib/providers/actions/profiles.dart lib/providers/state/theme.dart lib/views/disclaimer.dart lib/views/profiles/add.dart test/common/proxy_link_importer_test.dart lib/common/gohst_display_name.dart lib/common/gohst_subscription_notice.dart lib/views/proxies/card.dart lib/views/proxies/proxies.dart lib/views/proxies/gohst_mobile_list.dart lib/views/dashboard/gohst_dashboard.dart test/common/gohst_display_name_test.dart

      - name: Test VLESS conversion with synthetic data
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          flutter test test/common/proxy_link_importer_test.dart test/common/gohst_display_name_test.dart

      - name: Analyze modified Dart modules
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          dart analyze lib/views/dashboard/gohst_dashboard.dart lib/providers/actions/profiles.dart lib/providers/state/theme.dart lib/providers/app.dart lib/application.dart lib/bootstrap.dart lib/models/profile.dart

      - name: Build Android ARM64 APK
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          dart setup.dart android --env dev --arch arm64 --targets apk -v

      - name: Collect APK output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gohstvpn-apk-v9"
          count=0
          for folder in "$GOHSTVPN_PROJECT/dist" "$GOHSTVPN_PROJECT/build/app/outputs/flutter-apk"; do
            if [[ -d "$folder" ]]; then
              while IFS= read -r -d '' apk; do
                count=$((count + 1))
                cp "$apk" "$RUNNER_TEMP/gohstvpn-apk-v9/${count}-$(basename "$apk")"
              done < <(find "$folder" -type f -name '*.apk' -print0)
            fi
          done
          if (( count == 0 )); then
            echo '::error::Build ended but no APK exists in dist/ or Flutter APK output folder'
            exit 1
          fi
          ls -lh "$RUNNER_TEMP/gohstvpn-apk-v9/"

      - name: Upload GohstVpn APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GohstVpn-arm64-V10
          path: ${{ runner.temp }}/gohstvpn-apk-v9/*.apk
          if-no-files-found: error
          retention-days: 14
