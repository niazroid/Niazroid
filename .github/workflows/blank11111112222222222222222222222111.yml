# Save THIS FILE at: .github/workflows/GohstVpn-ZIP-APK-v3.yml
# Select "GohstVpn ZIP APK V3 - NEW" in the GitHub Actions sidebar.
# This is a NEW workflow; do not re-run "GohstVpn Android APK".
name: GohstVpn ZIP APK V3 - NEW

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk-from-zip:
    name: Unzip GohstVpn and build Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout ZIP from repository
        uses: actions/checkout@v4

      - name: V3 PROOF - extract GohstVpn ZIP (not detect root)
        shell: bash
        run: |
          set -euo pipefail
          echo '=== RUNNING GOHSTVPN ZIP APK V3 - NEW ==='
          archive="$GITHUB_WORKSPACE/GohstVpn-FlClash-v0.1.0-source.zip"
          echo "Archive: $archive"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Source ZIP not found at $archive"
            exit 1
          fi
          if ! unzip -tq "$archive" >/dev/null; then
            echo '::error::ZIP is corrupt or uploaded as an LFS pointer'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/gohstvpn-v3"
          unzip -q "$archive" -d "$RUNNER_TEMP/gohstvpn-v3"
          project="$RUNNER_TEMP/gohstvpn-v3/GohstVpn"
          for required in pubspec.yaml setup.dart android/settings.gradle.kts core/go.mod; do
            if [[ ! -f "$project/$required" ]]; then
              echo "::error::Missing $required in extracted ZIP at $project"
              exit 1
            fi
          done
          echo "GOHSTVPN_PROJECT=$project" >> "$GITHUB_ENV"
          echo "Found actual Flutter project: $project"
          ls -lh "$project/pubspec.yaml" "$project/setup.dart"

      - name: Fetch Mihomo (source ZIP does not include Git submodules)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          if [[ ! -f core/Clash.Meta/go.mod ]]; then
            rm -rf core/Clash.Meta
            git clone --depth 1 --branch FlClash https://github.com/chen08209/Clash.Meta.git core/Clash.Meta
          fi
          test -f core/Clash.Meta/go.mod

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: master
          cache: true

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Flutter project dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          flutter --version
          flutter pub get

      - name: Compile GohstVpn arm64 Android APK
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          dart setup.dart android --env dev --arch arm64 --targets apk -v

      - name: Collect built APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gohstvpn-v3-apks"
          count=0
          for dir in "$GOHSTVPN_PROJECT/dist" "$GOHSTVPN_PROJECT/build/app/outputs/flutter-apk"; do
            if [[ -d "$dir" ]]; then
              while IFS= read -r -d '' apk; do
                count=$((count + 1))
                cp "$apk" "$RUNNER_TEMP/gohstvpn-v3-apks/${count}-$(basename "$apk")"
              done < <(find "$dir" -type f -name '*.apk' -print0)
            fi
          done
          if (( count == 0 )); then
            echo '::error::Build ended without APK in dist or build/app/outputs/flutter-apk'
            exit 1
          fi
          ls -lh "$RUNNER_TEMP/gohstvpn-v3-apks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GohstVpn-V3-arm64
          path: ${{ runner.temp }}/gohstvpn-v3-apks/*.apk
          if-no-files-found: error
          retention-days: 14
