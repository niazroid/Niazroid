# name: Build BankMovie Windows v1.1.31

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

env:
  SOURCE_ZIP: BankMovie-v1.1.31.zip
  EXTRACT_DIR: _bankmovie_source
  DESKTOP_DIR: _bankmovie_source/bankmovie_desktop_v2_pack/desktop
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        shell: pwsh
        run: |
          $zip = Join-Path "${{ github.workspace }}" "${{ env.SOURCE_ZIP }}"
          if (-not (Test-Path $zip)) {
            throw "Required source archive not found: $zip"
          }

          $dest = Join-Path "${{ github.workspace }}" "${{ env.EXTRACT_DIR }}"
          if (Test-Path $dest) {
            Remove-Item $dest -Recurse -Force
          }

          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force

      - name: Validate package and real advanced search
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');if(p.version!=='1.1.31')throw new Error('Expected 1.1.31');p.build=p.build||{};p.build.forceCodeSigning=false;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.build.forceCodeSigning -ne $false) {
            throw "forceCodeSigning must be false"
          }

          $main = Get-Content "electron/main.js" -Raw
          $preload = Get-Content "electron/preload.js" -Raw
          $app = Get-Content "src/app.js" -Raw
          $css = Get-Content "src/styles.css" -Raw
          $html = Get-Content "src/index.html" -Raw

          if ($main -notmatch "advancedSearchRequest") { throw "Real advanced search request is missing" }
          if ($main -notmatch "api6\.php") { throw "Archive 3 API6 route is missing" }
          if ($main -notmatch "archive1SearchRequest") { throw "Archive 1 site-synced search transport is missing" }
          if ($main -notmatch "searchParams\.genre") { throw "Archive 1 genre parameter is missing" }
          if ($main -notmatch "searchParams\.imdbrate") { throw "Archive 1 IMDb parameter is missing" }
          if ($preload -notmatch "advancedSearch") { throw "Advanced search preload bridge is missing" }
          if ($app -notmatch "bm1119PerformSearch") { throw "Advanced search UI binding is missing" }
          if ($app -notmatch "exactYear") { throw "Exact-year filter is missing" }
          if ($app -notmatch "director") { throw "Director filter is missing" }
          if ($app -notmatch "actor") { throw "Actor filter is missing" }
          if ($css -notmatch "bm1119-search-box") { throw "Search-box shell style is missing" }
          if ($html -notmatch "bm1119-search-box") { throw "Search-box shell markup is missing" }
          if ($css -notmatch "hero/slider header-search contrast fix") { throw "Hero search contrast patch is missing" }
          if ($css -notmatch "source badges / age rating") { throw "Source badge styles are missing" }

          $main = Get-Content "electron/main.js" -Raw
          if ($main -notmatch "contentRequestTimeoutMs") { throw "Long detail timeout patch is missing" }
          if ($main -notmatch "if \(a === 'detail'\) return 90000") { throw "90s detail timeout is missing" }

          $app = Get-Content "src/app.js" -Raw
          if ($app -notmatch "bm1121Encoder") { throw "Encoder metadata patch is missing" }
          if ($app -notmatch "bm1121AgeRating") { throw "Age rating patch is missing" }
          if ($app -notmatch "bm1122BindHeaderSearch") { throw "Header archive search binding is missing" }
          if ($app -notmatch "bm1122PolishEmptyStates") { throw "Animated empty-state binding is missing" }
          if ($app -notmatch "bm1123InjectSearchArchiveStrip") { throw "Search-page archive strip is missing" }
          if ($app -notmatch "bm1123EnsureHomeFooter") { throw "Home social footer is missing" }
          if ($app -notmatch "bm1123BindSocialButtons") { throw "Social binding is missing" }
          if ($app -notmatch "bm1124LoadHomeArchive") { throw "Archive isolation patch is missing" }
          if ($app -notmatch "bm1124SectionEnabled") { throw "Desktop section controls are missing" }
          if ($app -notmatch "نام فیلم، سریال یا بازیگر") { throw "Readable search placeholder is missing" }
          if ($main -notmatch "archive1SearchRequest") { throw "Archive 1 site-synced submitted search is missing" }
          if ($main -notmatch "live_search: actorLookup") { throw "Archive 1 submitted actor lookup via site API2 is missing" }
          if ($main -notmatch "archive1ActorRequest") { throw "Archive 1 actor pagination transport is missing" }
          if ($main -match "archive1LiveSearchRequest|my-f2mx\.top/quick-search") { throw "Direct/live upstream desktop search must not exist" }
          if ($preload -match "archive1LiveSearch") { throw "Windows must not expose a live-search preload bridge" }
          if ($preload -notmatch "archive1Actor") { throw "Archive 1 actor preload bridge is missing" }
          if ($app -notmatch "bm1126SvgIcon") { throw "Comment SVG action patch is missing" }
          if ($app -notmatch "bm1131SearchActorsHtml") { throw "Submitted Archive 1 actor result UI is missing" }
          if ($app -match "bm1126BindLiveSearchEverywhere|bm1126LiveTimer") { throw "Windows live-search typing UI must be removed" }
          if ($css -notmatch "bm1126-rating-radio") { throw "Animated rating stars are missing" }
          if ($css -notmatch "bm1131-search-actors") { throw "Submitted actor result styles are missing" }

          $css = Get-Content "src/styles.css" -Raw
          if ($css -notmatch "compact responsive cards") { throw "Compact card sizing patch is missing" }

          $html = Get-Content "src/index.html" -Raw
          if ($html -notmatch "startup-follow-title") { throw "Startup social loader is missing" }

          $css = Get-Content "src/styles.css" -Raw
          if ($css -notmatch "startup loader — full cinematic screen") { throw "Cinematic startup loader styles are missing" }
          if ($css -notmatch "home-only social footer") { throw "Social footer styles are missing" }

          $css = Get-Content "src/styles.css" -Raw
          if ($css -notmatch "cinematic empty-state animation") { throw "Empty-state animation styles are missing" }
          if ($app -notmatch "return 60\*60\*1000") { throw "One-hour detail cache is missing" }

          $nsh = Get-Content "build-assets/installer-black.nsh" -Raw
          if ($nsh -notmatch "!ifndef BUILD_UNINSTALLER") {
            throw "NSIS BUILD_UNINSTALLER hotfix is missing"
          }

      - name: Generate runtime config
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          @"
          module.exports = Object.freeze({
            domain: 'https://bankmovie.top'
          });
          "@ | Set-Content -Path "electron/runtime.generated.js" -Encoding UTF8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          node --check src/app.js
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/runtime.generated.js

      - name: Build Windows installer
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never

      - name: Create SHA-256 checksums
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          $lines = @()
          Get-ChildItem "dist" -File | Where-Object {
            $_.Extension -in ".exe", ".blockmap", ".yml"
          } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($_.Name)"
          }
          $lines | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-v1.1.25-${{ github.sha }}
          path: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
            ${{ env.DESKTOP_DIR }}/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
            ${{ env.DESKTOP_DIR }}/dist/SHA256SUMS.txt
