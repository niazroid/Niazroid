name: Build BankMovie Windows v1.9.4 SIGNED

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SOURCE_ZIP: BankMovie-v1.9.4-SIGNED-READY.zip
  EXTRACT_DIR: _bankmovie_source
  DESKTOP_DIR: _bankmovie_source/bankmovie_desktop_v2_pack/desktop

jobs:
  build-windows-signed:
    name: Signed Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: pwsh
        run: |
          $zip = Join-Path "${{ github.workspace }}" "${{ env.SOURCE_ZIP }}"
          if (-not (Test-Path $zip)) {
            Write-Host "Repository files:"
            Get-ChildItem "${{ github.workspace }}" | ForEach-Object { Write-Host " - $($_.Name)" }
            throw "Required source archive not found: $zip"
          }

      - name: Extract source
        shell: pwsh
        run: |
          $zip = Join-Path "${{ github.workspace }}" "${{ env.SOURCE_ZIP }}"
          $dest = Join-Path "${{ github.workspace }}" "${{ env.EXTRACT_DIR }}"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force

          $package = Join-Path "${{ github.workspace }}" "${{ env.DESKTOP_DIR }}/package.json"
          if (-not (Test-Path $package)) { throw "package.json not found: $package" }

          $pkg = Get-Content $package -Raw | ConvertFrom-Json
          if ($pkg.name -ne "bankmovie-windows") { throw "Unexpected package: $($pkg.name)" }
          if ($pkg.version -ne "1.9.4") { throw "Expected version 1.9.4 but found $($pkg.version)" }

      - name: Generate runtime config
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          @"
          module.exports = Object.freeze({
            domain: 'https://bankmovie.top'
          });
          "@ | Set-Content -Path "electron/runtime.generated.js" -Encoding UTF8

      - name: Require trusted signing certificate
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_B64)) {
            throw "Missing repository secret: WINDOWS_CERTIFICATE_PFX_BASE64"
          }
          if ([string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
            throw "Missing repository secret: WINDOWS_CERTIFICATE_PASSWORD"
          }

          $pfx = Join-Path $env:RUNNER_TEMP "bankmovie-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))

          if (-not (Test-Path $pfx)) {
            throw "Failed to materialize signing certificate."
          }

          "CSC_LINK=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_KEY_PASSWORD=$env:CERT_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Signing certificate prepared."
          Write-Host "The private certificate content is not printed."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Validate source
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          node --check src/app.js
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/runtime.generated.js

      - name: Build and sign Windows installer
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm run build:win

      - name: Verify Authenticode signatures
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          $executables = Get-ChildItem "dist" -Recurse -Filter *.exe
          if (-not $executables) {
            throw "No EXE files found in dist."
          }

          $failed = @()

          foreach ($exe in $executables) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Host ""
            Write-Host "File: $($exe.Name)"
            Write-Host "Status: $($sig.Status)"
            if ($sig.SignerCertificate) {
              Write-Host "Subject: $($sig.SignerCertificate.Subject)"
              Write-Host "Issuer: $($sig.SignerCertificate.Issuer)"
              Write-Host "Expires: $($sig.SignerCertificate.NotAfter)"
            }

            if ($sig.Status -ne "Valid") {
              $failed += $exe.FullName
            }
          }

          if ($failed.Count -gt 0) {
            Write-Host "Unsigned/invalid files:"
            $failed | ForEach-Object { Write-Host " - $_" }
            throw "Code-signing verification failed. Unsigned builds will not be published."
          }

      - name: Create SHA-256 checksums
        shell: pwsh
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          $lines = @()
          Get-ChildItem "dist" -File | Where-Object {
            $_.Extension -in ".exe", ".zip", ".blockmap", ".yml"
          } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($_.Name)"
          }
          $lines | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload signed build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankMovie-Windows-v1.9.4-SIGNED-${{ github.sha }}
          path: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
            ${{ env.DESKTOP_DIR }}/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.DESKTOP_DIR }}/dist/*.exe
            ${{ env.DESKTOP_DIR }}/dist/*.blockmap
            ${{ env.DESKTOP_DIR }}/dist/*.yml
            ${{ env.DESKTOP_DIR }}/dist/SHA256SUMS.txt

      - name: Remove signing certificate from runner
        if: always()
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "bankmovie-code-signing.pfx"
          if (Test-Path $pfx) {
            Remove-Item $pfx -Force
          }
