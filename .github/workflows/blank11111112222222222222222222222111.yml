# GohstVpn source is stored as one ZIP in the repository ROOT.
# Install this file at .github/workflows/gohstvpn-android.yml
# Do not run the older V3 or other FlClash/Karing workflows.
name: GHOST VPN V14 - Telegram Bot Dart Fix

on:
  workflow_dispatch:

permissions:
  contents: write  # private repository: write non-secret signing fingerprint marker
  actions: read    # restore private signing artifact from previous builds

concurrency:
  group: ghost-vpn-signing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: Build ARM64 APK with automatic signing
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: PROOF V6 - extract EXACT GohstVpn v0.1 ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo '===== GHOST VPN V11 FIXED RELEASE ====='
          ZIP="$GITHUB_WORKSPACE/GohstVpn-FlClash-v0.1.0-source.zip"
          PROJECT="$RUNNER_TEMP/gohstvpn-locked-v4/GohstVpn"
          echo "Locked ZIP: $ZIP"
          if [[ ! -f "$ZIP" ]]; then
            echo "::error::Missing EXACT file: GohstVpn-FlClash-v0.1.0-source.zip in repository root"
            exit 1
          fi
          unzip -tq "$ZIP" >/dev/null || {
            echo '::error::ZIP is damaged or stored as a Git LFS pointer.'
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/gohstvpn-locked-v4"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          for required in pubspec.yaml setup.dart android/settings.gradle.kts core/go.mod; do
            if [[ ! -f "$PROJECT/$required" ]]; then
              echo "::error::ZIP does not contain GohstVpn/$required"
              exit 1
            fi
          done
          echo "GOHSTVPN_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SUCCESS: Flutter project extracted into $PROJECT"

      - name: Apply EXACT GohstVpn v0.2 update overlay
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/GohstVpn-v0.2.0-update.zip"
          if [[ ! -f "$PATCH" ]]; then
            echo '::error::Upload the exact GohstVpn-v0.2.0-update.zip file into your repository ROOT'
            exit 1
          fi
          unzip -tq "$PATCH" >/dev/null
          unzip -oq "$PATCH" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          test -f "$GOHSTVPN_PROJECT/lib/common/proxy_link_importer.dart"
          grep -q 'version: 0.2.0+2' "$GOHSTVPN_PROJECT/pubspec.yaml"
          echo 'SUCCESS: GohstVpn v0.2 sources are applied to the ORIGINAL v0.1 ZIP'

      - name: Apply EXACT GohstVpn v0.3 style and subscription update
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/GohstVpn-v0.3.0-update.zip"
          if [[ ! -f "$PATCH" ]]; then
            echo '::error::Upload EXACT GohstVpn-v0.3.0-update.zip to repository root'
            exit 1
          fi
          unzip -tq "$PATCH" >/dev/null
          unzip -oq "$PATCH" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          test -f "$GOHSTVPN_PROJECT/lib/views/proxies/gohst_mobile_list.dart"
          test -f "$GOHSTVPN_PROJECT/lib/common/gohst_subscription_notice.dart"
          grep -q 'version: 0.3.0+3' "$GOHSTVPN_PROJECT/pubspec.yaml"
          echo 'SUCCESS: GohstVpn v0.3 overlay verified'

      - name: Apply EXACT GohstVpn v0.4 smart UI update
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/GohstVpn-v0.4.0-update.zip"
          if [[ ! -f "$PATCH" ]]; then
            echo '::error::Upload EXACT GohstVpn-v0.4.0-update.zip to repository ROOT'
            exit 1
          fi
          unzip -tq "$PATCH" >/dev/null
          unzip -oq "$PATCH" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          grep -q 'version: 0.4.0+4' "$GOHSTVPN_PROJECT/pubspec.yaml"
          grep -q 'class GohstConnectionToggle' "$GOHSTVPN_PROJECT/lib/views/dashboard/gohst_dashboard.dart"
          echo 'SUCCESS: v0.4 smart UI files installed'

      - name: Apply EXACT GohstVpn v0.5 dashboard and auto-ping update
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/GohstVpn-v0.5.0-update.zip"
          if [[ ! -f "$PATCH" ]]; then
            echo '::error::Upload EXACT GohstVpn-v0.5.0-update.zip to the repository ROOT'
            exit 1
          fi
          unzip -tq "$PATCH" >/dev/null
          unzip -oq "$PATCH" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          grep -q 'version: 0.5.0+5' "$GOHSTVPN_PROJECT/pubspec.yaml"
          grep -q 'class _GohstDashboardState' "$GOHSTVPN_PROJECT/lib/views/dashboard/gohst_dashboard.dart"
          test -s "$GOHSTVPN_PROJECT/assets/images/gohst_refresh.svg"
          echo 'SUCCESS: v0.5 update overlay installed'

      - name: Fix dashboard Dart analysis warnings (V10)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          python3 - <<'PY_DART'
          from pathlib import Path
          import re
          file = Path('lib/views/dashboard/gohst_dashboard.dart')
          source = file.read_text(encoding='utf-8')
          unused = "import 'package:fl_clash/icons/icons.dart';\n"
          if source.count(unused) != 1:
              raise SystemExit('ERROR: dashboard source differs from v0.5; unused import mismatch')
          source = source.replace(unused, '')
          pattern = re.compile(r'^(?P<indent>[ \t]*)if \((?P<cond>.+?)\) (?P<stmt>.+;)$')
          updated = []
          fixed = 0
          for line in source.splitlines(keepends=True):
              match = pattern.fullmatch(line.rstrip('\n'))
              if match and '...[' not in match.group('stmt'):
                  indent, cond, stmt = match.group('indent', 'cond', 'stmt')
                  updated.append(f'{indent}if ({cond}) {{\n{indent}  {stmt}\n{indent}}}\n')
                  fixed += 1
              else:
                  updated.append(line)
          if fixed != 17:
              raise SystemExit(f'ERROR: unexpected dashboard version; expected 17 inline if statements but got {fixed}')
          file.write_text(''.join(updated), encoding='utf-8')
          print(f'SUCCESS: removed unused icon import; fixed {fixed} curly-brace issues')
          PY_DART

      - name: Apply EXACT GHOST VPN v0.6 brand, toasts and subscription alerts
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/GHOST-VPN-v0.6.0-update.zip"
          if [[ ! -s "$PATCH" ]]; then
            echo '::error::Upload EXACT GHOST-VPN-v0.6.0-update.zip to repository root'
            exit 1
          fi
          unzip -tq "$PATCH" >/dev/null
          unzip -oq "$PATCH" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          grep -q 'version: 0.6.0+6' "$GOHSTVPN_PROJECT/pubspec.yaml"
          grep -q 'GHOST VPN' "$GOHSTVPN_PROJECT/lib/common/constant.dart"
          test -s "$GOHSTVPN_PROJECT/assets/images/ghost_brand_logo.png"
          echo 'SUCCESS: v0.6 updates overlaid onto V10 fixes'

      - name: Apply GHOST VPN v0.6.1 real selected server and bot fix
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/GHOST-VPN-v0.6.1-server-info-bot-update.zip"
          if [[ ! -s "$PATCH" ]]; then
            echo '::error::Missing exact GHOST-VPN-v0.6.1-server-info-bot-update.zip in repository root'
            exit 1
          fi
          unzip -tq "$PATCH" >/dev/null
          unzip -oq "$PATCH" -d "$RUNNER_TEMP/gohstvpn-locked-v4"
          cd "$GOHSTVPN_PROJECT"
          grep -q 'version: 0.6.1+7' pubspec.yaml
          grep -q 'V2_ghostvpn_bot' lib/common/ghost_purchase_bot.dart
          test -s lib/common/ghost_active_server.dart
          test -s test/ghost_active_server_test.dart
          echo 'SUCCESS: dashboard, ping resolver and Telegram purchase bot patched'

      - name: Fix Telegram bot Dart constant evaluation (v0.6.1)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          python3 - <<'PY_GHOST_BOT_FIX'
          from pathlib import Path
          path = Path('lib/common/ghost_purchase_bot.dart')
          source = path.read_text(encoding='utf-8')
          old = 'const ghostTelegramBotUrl = _configuredGhostTelegramBotUrl.isEmpty'
          new = 'final ghostTelegramBotUrl = _configuredGhostTelegramBotUrl.isEmpty'
          if source.count(old) != 1:
              raise SystemExit('ERROR: expected GHOST VPN 0.6.1 bot declaration not found exactly once')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          print('FIXED: Telegram bot URL remains the same, but its fallback is evaluated at runtime.')
          PY_GHOST_BOT_FIX
          grep -n '^final ghostTelegramBotUrl' lib/common/ghost_purchase_bot.dart

      - name: Restore public Mihomo core missing from ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          if [[ ! -f core/Clash.Meta/go.mod ]]; then
            rm -rf core/Clash.Meta
            git clone --depth 1 --branch FlClash https://github.com/chen08209/Clash.Meta.git core/Clash.Meta
          fi
          test -f core/Clash.Meta/go.mod || {
            echo '::error::Mihomo core source could not be fetched'
            exit 1
          }

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false

      - name: Fix Mihomo URLTest callback compatibility (3 to 4 args)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          python3 - <<'PYFIX'
          from pathlib import Path
          path = Path('core/hub.go')
          contents = path.read_text(encoding='utf-8')
          legacy = 'adapter.UrlTestHook = func(url string, name string, delay uint16) {'
          replacement = ('adapter.UrlTestHook = func(url string, name string, delay uint16, canceled bool) {\n'
                         '\t\tif canceled {\n\t\t\treturn\n\t\t}')
          newer = 'adapter.UrlTestHook = func(url string, name string, delay uint16, canceled bool) {'
          if contents.count(legacy) == 1:
              contents = contents.replace(legacy, replacement, 1)
              path.write_text(contents, encoding='utf-8')
              print('SUCCESS: patched URLTestHook for new Mihomo callback signature')
          elif newer in contents:
              print('SKIP: URLTestHook already has 4 parameters')
          else:
              raise SystemExit('ERROR: unexpected URLTestHook signature; not patching blindly')
          PYFIX
          gofmt -w core/hub.go
          grep -n -A 7 'adapter.UrlTestHook = func' core/hub.go

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Flutter dependencies in extracted project
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          echo "pubspec located at: $(pwd)/pubspec.yaml"
          flutter pub get

      - name: Format and syntax-check modified Dart files
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          dart format lib/common/ghost_active_server.dart test/ghost_active_server_test.dart lib/common/ghost_purchase_bot.dart lib/bootstrap.dart lib/application.dart lib/providers/app.dart lib/providers/actions/profiles.dart lib/views/dashboard/gohst_dashboard.dart lib/providers/state/theme.dart
          dart format lib/common/proxy_link_importer.dart lib/models/profile.dart lib/providers/action.dart lib/providers/actions/profiles.dart lib/providers/state/theme.dart lib/views/disclaimer.dart lib/views/profiles/add.dart test/common/proxy_link_importer_test.dart lib/common/gohst_display_name.dart lib/common/gohst_subscription_notice.dart lib/views/proxies/card.dart lib/views/proxies/proxies.dart lib/views/proxies/gohst_mobile_list.dart lib/views/dashboard/gohst_dashboard.dart test/common/gohst_display_name_test.dart

      - name: Test VLESS conversion with synthetic data
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          flutter test test/common/proxy_link_importer_test.dart test/common/gohst_display_name_test.dart test/ghost_active_server_test.dart

      - name: Analyze modified Dart modules
        shell: bash
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          dart analyze lib/common/ghost_active_server.dart test/ghost_active_server_test.dart lib/common/ghost_purchase_bot.dart lib/views/dashboard/gohst_dashboard.dart lib/providers/actions/profiles.dart lib/providers/state/theme.dart lib/providers/app.dart lib/application.dart lib/bootstrap.dart lib/models/profile.dart

      # 1) Existing secrets: true permanent signing (works for both public/private repositories).
      # 2) No secrets + PRIVATE repository: generate once, reuse via private artifacts.
      #    Private artifacts expire, so download and securely back up the generated key.
      # 3) No secrets + PUBLIC repository: test-only debug-signed .dev APK.
      #    NEVER publish release keystore/password in public artifacts or source control.
      - name: Auto-sign on GitHub (safe signing mode)
        id: signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          STORE_B64: ${{ secrets.GHOST_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.GHOST_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GHOST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GHOST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYDIR="$RUNNER_TEMP/ghost-vpn-signing"
          mkdir -p "$KEYDIR"
          chmod 700 "$KEYDIR"
          KEYFILE="$KEYDIR/keystore.jks"
          MARKER_PATH='.github/GHOST-VPN-SIGNING-INITIALIZED.txt'

          if [[ -n "$STORE_B64" ]]; then
            for name in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [[ -z "${!name}" ]]; then
                echo "::error::Signing secret $name is missing. Add all four signing secrets."
                exit 1
              fi
            done
            printf '%s' "$STORE_B64" | base64 -d > "$KEYFILE"
            echo 'mode=secrets' >> "$GITHUB_OUTPUT"
            echo 'new=false' >> "$GITHUB_OUTPUT"
            echo 'Signing from existing persistent GitHub Secrets.'
          elif [[ "$IS_PRIVATE" == 'true' ]]; then
            ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=GHOST-VPN-PRIVATE-SIGNING&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
            if [[ -n "$ARTIFACT_ID" ]]; then
              curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
                -o "$RUNNER_TEMP/ghost-signing-backup.zip"
              unzip -q "$RUNNER_TEMP/ghost-signing-backup.zip" -d "$KEYDIR"
              test -s "$KEYFILE" && test -s "$KEYDIR/password.txt"
              echo 'new=false' >> "$GITHUB_OUTPUT"
              echo 'Restored existing signing identity from PRIVATE GitHub artifact.'
            else
              if gh api "repos/$GITHUB_REPOSITORY/contents/$MARKER_PATH?ref=$GITHUB_REF_NAME" >/dev/null 2>&1; then
                echo '::error::Previous signing artifact expired or was deleted. Refusing to rotate signing key and break updates. Restore your keystore backup as signing secrets.'
                exit 1
              fi
              PASS=$(openssl rand -hex 32)
              keytool -genkeypair -noprompt -keystore "$KEYFILE" -storetype JKS \
                -alias ghost -keyalg RSA -keysize 3072 -validity 10000 \
                -storepass "$PASS" -keypass "$PASS" -dname 'CN=GHOST VPN, O=GHOST VPN, C=US' >/dev/null 2>&1
              printf '%s' "$PASS" > "$KEYDIR/password.txt"
              echo 'new=true' >> "$GITHUB_OUTPUT"
              echo 'Generated GHOST VPN signing identity for the first PRIVATE-repo build.'
            fi
            PASS=$(cat "$KEYDIR/password.txt")
            KEY_ALIAS=ghost
            STORE_PASSWORD="$PASS"
            KEY_PASSWORD="$PASS"
            echo 'mode=private-artifact' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=public-test' >> "$GITHUB_OUTPUT"
            echo 'new=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Repository is PUBLIC and has no signing secrets. Building a TEST APK with Android debug signing (.dev). This DOES NOT provide a persistent update-compatible release signature.'
            exit 0
          fi

          chmod 600 "$KEYFILE"
          cp "$KEYFILE" "$GOHSTVPN_PROJECT/android/app/keystore.jks"
          chmod 600 "$GOHSTVPN_PROJECT/android/app/keystore.jks"
          for value in "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            echo "::add-mask::$value"
          done
          {
            echo "GHOST_STORE_PASSWORD=$STORE_PASSWORD"
            echo "GHOST_KEY_ALIAS=$KEY_ALIAS"
            echo "GHOST_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Renew private signing-key backup (90-day retention)
        if: steps.signing.outputs.mode == 'private-artifact'
        uses: actions/upload-artifact@v4
        with:
          name: GHOST-VPN-PRIVATE-SIGNING
          path: ${{ runner.temp }}/ghost-vpn-signing/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 90

      - name: Mark signing identity as initialized (no secrets in git)
        if: steps.signing.outputs.mode == 'private-artifact' && steps.signing.outputs.new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONTENT=$(printf 'GHOST VPN signing initialized. Do not generate another key; restore the original keystore backup if missing.\n' | base64 -w0)
          jq -n --arg content "$CONTENT" --arg branch "$GITHUB_REF_NAME" \
            '{message:"Initialize GHOST VPN signing marker (no private key)",content:$content,branch:$branch}' \
            | gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.github/GHOST-VPN-SIGNING-INITIALIZED.txt" --input - >/dev/null
          echo 'Private key backed up in Actions; public repository files contain only a harmless marker.'

      - name: Build Android ARM64 APK
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          GHOST_TELEGRAM_BOT_URL: ${{ vars.GHOST_TELEGRAM_BOT_URL }}
        run: |
          set -euo pipefail
          cd "$GOHSTVPN_PROJECT"
          dart setup.dart android --env stable --arch arm64 --targets apk -v

      - name: Collect APK output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gohstvpn-apk-v9"
          count=0
          for folder in "$GOHSTVPN_PROJECT/dist" "$GOHSTVPN_PROJECT/build/app/outputs/flutter-apk"; do
            if [[ -d "$folder" ]]; then
              while IFS= read -r -d '' apk; do
                count=$((count + 1))
                cp "$apk" "$RUNNER_TEMP/gohstvpn-apk-v9/${count}-$(basename "$apk")"
              done < <(find "$folder" -type f -name '*.apk' -print0)
            fi
          done
          if (( count == 0 )); then
            echo '::error::Build ended but no APK exists in dist/ or Flutter APK output folder'
            exit 1
          fi
          ls -lh "$RUNNER_TEMP/gohstvpn-apk-v9/"

      - name: Upload GohstVpn APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GHOST-VPN-arm64-V14-${{ steps.signing.outputs.mode }}
          path: ${{ runner.temp }}/gohstvpn-apk-v9/*.apk
          if-no-files-found: error
          retention-days: 14


      - name: Explain signing result
        if: always()
        shell: bash
        run: |
          echo '### GHOST VPN signing status' >> "$GITHUB_STEP_SUMMARY"
          case '${{ steps.signing.outputs.mode }}' in
            secrets)
              echo '✅ Signed with your persistent GitHub Secrets keystore.' >> "$GITHUB_STEP_SUMMARY" ;;
            private-artifact)
              echo '✅ Signed with an auto-created/reused keystore stored in PRIVATE Actions artifacts. Download the artifact and keep an OFFLINE BACKUP; GitHub artifact retention is limited.' >> "$GITHUB_STEP_SUMMARY" ;;
            public-test)
              echo '⚠️ Public repo: test-only debug signature; NOT suitable for automatic future app updates. Permanent release signing requires one-time private GitHub Secrets setup.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo '❌ Signing did not complete.' >> "$GITHUB_STEP_SUMMARY" ;;
          esac
