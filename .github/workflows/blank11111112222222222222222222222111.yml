name: GohstVpn Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'GohstVpn-FlClash-v0.1.0-source.zip'
      - '.github/workflows/gohstvpn-android.yml'

permissions:
  contents: read

concurrency:
  group: gohstvpn-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository containing source ZIP
        uses: actions/checkout@v4

      - name: Extract actual GohstVpn Flutter project
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/GohstVpn-FlClash-v0.1.0-source.zip"
          if [[ ! -f "$archive" ]]; then
            echo "::error::GohstVpn-FlClash-v0.1.0-source.zip not found in repository root."
            exit 1
          fi
          if ! unzip -tq "$archive" >/dev/null; then
            echo "::error::Source ZIP is invalid or is a Git LFS pointer. Upload/download the actual ZIP."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/gohstvpn-source"
          unzip -q "$archive" -d "$RUNNER_TEMP/gohstvpn-source"
          project="$RUNNER_TEMP/gohstvpn-source/GohstVpn"
          for required in pubspec.yaml setup.dart android/settings.gradle.kts core/go.mod; do
            if [[ ! -e "$project/$required" ]]; then
              echo "::error::Extracted project is missing $required at $project"
              exit 1
            fi
          done
          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"
          echo "Project unpacked at $project"

      - name: Obtain public Mihomo core source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ ! -f core/Clash.Meta/go.mod ]]; then
            rm -rf core/Clash.Meta
            git clone --depth 1 --branch FlClash \
              https://github.com/chen08209/Clash.Meta.git core/Clash.Meta
          fi
          test -f core/Clash.Meta/go.mod

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: master
          cache: true

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Set up Rust for Android arm64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build GohstVpn Android arm64 APK
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          dart setup.dart android --env dev --arch arm64 --targets apk

      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gohstvpn-apks"
          count=0
          for directory in "$PROJECT_DIR/dist" "$PROJECT_DIR/build/app/outputs/flutter-apk"; do
            if [[ -d "$directory" ]]; then
              while IFS= read -r -d '' apk; do
                count=$((count + 1))
                cp "$apk" "$RUNNER_TEMP/gohstvpn-apks/$count-$(basename "$apk")"
              done < <(find "$directory" -type f -name '*.apk' -print0)
            fi
          done
          if [[ "$count" -eq 0 ]]; then
            echo "::error::Build completed but no APK was found in dist/ or build/app/outputs/flutter-apk/."
            exit 1
          fi
          ls -lh "$RUNNER_TEMP/gohstvpn-apks"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GohstVpn-Android-arm64-APK
          path: ${{ runner.temp }}/gohstvpn-apks/*.apk
          if-no-files-found: error
          retention-days: 14
